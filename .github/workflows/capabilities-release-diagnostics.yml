name: Capabilities Release Diagnostics

on:
  push:
    branches:
      - 2026-09-25-capabilities-audit
    paths:
      - .github/workflows/capabilities-release-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Print exact repair sources
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          for path in             music_app/static/css/runtime/non-album-and-player.css             music_app/static/css/button-component.css             music_app/static/css/runtime/trigger-anchor.css             tests/e2e/actions/navigationPanelActions.js             tests/e2e/poms/navigationPanel.js             tests/e2e/phase7/poms/capabilityBoundaryPage.js             tests/e2e/phase7/actions/capabilityBoundaryActions.js; do
            echo "===== BEGIN $path ====="
            cat "$path"
            echo "===== END $path ====="
          done
