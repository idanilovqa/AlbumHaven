name: Capabilities Release Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/chatgpt/pr17-run301-visual-diagnostics-20260929'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify diagnostic head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD^) -ne '9bdc4c6fc11d216594ff359529e8e85f9016a5b8') { throw 'Unexpected diagnostic parent' }
          if (git status --porcelain) { throw 'Dirty checkout' }
      - name: Print focused source
        shell: python
        run: |
          from pathlib import Path
          targets = {
            'tests/components/searchInput.spec.js': (170, 300),
            'tests/components/triggerAnchorSurface.spec.js': (180, 235),
            'tests/components/buttonInteractionOutline.spec.js': (160, 205),
            'music_app/static/css/runtime/trigger-anchor.css': (1, 175),
            'music_app/static/js/runtime/trigger-anchor.js': (1, 125),
            'music_app/static/js/runtime/player-loop-playback.js': (880, 1120),
            'music_app/static/js/playback-control-cluster.js': (1, 320),
          }
          for raw, (start, end) in targets.items():
            path = Path(raw)
            print(f'===== {raw} [{start}:{end}] =====')
            if not path.exists():
              print('MISSING')
              continue
            lines = path.read_text(encoding='utf-8').splitlines()
            for n in range(max(1,start), min(end,len(lines))+1):
              print(f'{n:05d}: {lines[n-1]}')
