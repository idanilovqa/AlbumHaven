name: Capabilities Release Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-25-capabilities-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify source parent
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "655b5f65a6dabcfd022ffe49d944131282b532ac"
          test -z "$(git status --porcelain)"
      - name: Print focused source excerpts
        shell: python
        run: |
          from pathlib import Path
          targets = [
              ("tests/js/runtime/utility-list-builders.test.js", ["saved loop layout keeps edit timestamps"]),
              ("music_app/static/css/runtime/non-album-and-player.css", [".utility-loop-shell", ".utility-loop-player-main", ".utility-loop-timeline-wrap"]),
              ("tests/components/buttonInteractionOutline.spec.js", ["non-green player surfaces derive computed action hover colors"]),
              ("music_app/static/css/button-component.css", [".action-button:hover", ".ui-button:hover"]),
              ("music_app/static/css/appearance-backgrounds.css", ["appearance-item-action-hover-background"]),
              ("tests/components/searchInput.spec.js", ["Settings filter dropdown right edge joins its anchor button"]),
              ("tests/components/triggerAnchorSurface.spec.js", ["a dropdown extending both sides has mirrored left and right joins"]),
              ("music_app/static/css/runtime/trigger-anchor.css", [".trigger-anchor-open::after", ".trigger-anchor-surface::after", "data-trigger-anchor-context='content'"]),
              ("music_app/static/js/runtime/player-loop-playback.js", ["data-loop-action-owner", "loopActionOwner", "loop-action-owner"]),
              ("music_app/static/js/runtime/utility-loop-playback.js", ["data-loop-action-owner", "loopActionOwner", "loop-action-owner"]),
              ("music_app/static/js/runtime/utility-list-builders.js", ["data-loop-action-owner", "loopActionOwner", "loop-action-owner"]),
              ("music_app/static/js/appearance-backgrounds.js", ["waveform_recent_colors", "recent"]),
              ("music_app/services/appearance_preferences_postgres.py", ["waveform_recent_colors", "waveform"]),
              ("tests/e2e/actions/galleryActions.js", ["scrollToAlbumUnderHeading", "data-sidebar-all-artists"]),
              ("music_app/static/js/runtime/navigation-tree.js", ["data-sidebar-all-artists", "expanded", "collapsed"]),
          ]
          for raw, needles in targets:
              path = Path(raw)
              print(f"\n===== {raw} =====")
              if not path.exists():
                  print("MISSING")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              emitted=set()
              for needle in needles:
                  matches=[i for i,line in enumerate(lines) if needle in line]
                  print(f"--- needle {needle!r}: {len(matches)} match(es)")
                  for i in matches[:8]:
                      lo=max(0,i-16); hi=min(len(lines),i+36)
                      key=(lo,hi)
                      if key in emitted: continue
                      emitted.add(key)
                      for n in range(lo,hi):
                          print(f"{n+1:05d}: {lines[n]}")
          print("\n===== package scripts =====")
          import json
          pkg=json.loads(Path("package.json").read_text(encoding="utf-8"))
          for key,value in sorted(pkg.get("scripts",{}).items()):
              if any(word in key.lower() for word in ("test","component","e2e")):
                  print(f"{key}: {value}")
