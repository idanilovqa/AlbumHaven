name: Capabilities Release Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Print source hashes
        shell: bash
        run: |
          git rev-parse HEAD
          git status --porcelain
