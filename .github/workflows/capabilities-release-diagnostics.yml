name: Capabilities Release Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/chatgpt/pr17-focused-repair-20260929-b4ec1a5'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify helper parent
        shell: pwsh
        run: |
          if ((git rev-parse HEAD^) -ne 'b4ec1a51a4ca717e42f73f2b9cb362e833b800cd') { throw 'Unexpected helper parent' }
          if (git status --porcelain) { throw 'Dirty checkout' }
      - name: Apply product-only candidate repairs in worktree
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('music_app/static/css/runtime/non-album-and-player.css')
          s = p.read_text(encoding='utf-8')
          old = """.utility-loop-shell {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            grid-template-rows: 22px 44px;"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, old.replace('22px 44px', '22px 32px'))

          old = """.utility-loop-main {
            grid-row: 1 / 3;
            position: relative;
            display: grid;
            grid-template-rows: 22px 44px;
            row-gap: 4px;
            min-width: 0;
            height: 70px;"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, old.replace('22px 44px', '22px 32px').replace('height: 70px', 'height: 58px'))

          old = """  height: 44px;
            min-height: 44px;
            min-width: 0;
          }
          .utility-loop-timeline {"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, old.replace('height: 44px', 'height: 32px').replace('min-height: 44px', 'min-height: 32px'))
          p.write_text(s, encoding='utf-8')

          p = Path('music_app/static/css/button-component.css')
          s = p.read_text(encoding='utf-8')
          marker = """.action-button--bare:not(.trigger-anchor-open):not(.global-player *):hover:not(:disabled):not([aria-disabled='true']),
          :root[data-action-button-outlines='off'] .action-button:not(.trigger-anchor-open):not(.global-player *):not(.action-button--destructive):hover:not(:disabled):not([aria-disabled='true']) {
            border-color: transparent;
            background: color-mix(in srgb, var(--appearance-item-action-hover-background, var(--appearance-hover, #293a50)) 45%, transparent);
          }"""
          assert s.count(marker) == 1, s.count(marker)
          stronger = """
          :root .action-button.action-button--bare:not(.trigger-anchor-open):not(.global-player *):hover:not(:disabled):not([aria-disabled='true']),
          :root[data-action-button-outlines='off'] .action-button:not(.trigger-anchor-open):not(.global-player *):not(.action-button--destructive):hover:not(:disabled):not([aria-disabled='true']) {
            border-color: transparent;
            background: color-mix(in srgb, var(--appearance-item-action-hover-background, var(--appearance-hover, #293a50)) 45%, transparent);
          }
          """
          p.write_text(s.replace(marker, marker + stronger), encoding='utf-8')

          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','diff','--',
            'music_app/static/css/runtime/non-album-and-player.css',
            'music_app/static/css/button-component.css'], check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Node dependencies
        run: npm ci
      - name: Run saved-loop JavaScript contract
        run: node --test tests/js/runtime/utility-list-builders.test.js
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Run focused component contracts
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: npx playwright test -c playwright.component.config.js tests/components/buttonInteractionOutline.spec.js tests/components/searchInput.spec.js tests/components/triggerAnchorSurface.spec.js
