name: Capabilities Release Diagnostics

on:
  push:
    branches: [2026-09-25-capabilities-audit]
    paths: [.github/workflows/capabilities-release-diagnostics.yml]

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-25-capabilities-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify source parent
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "66755c7bafb10320081c681dbd95a846c4f9e625"
          test -z "$(git status --porcelain)"
      - name: Print focused source excerpts
        shell: python
        run: |
          from pathlib import Path
          targets = [
              ("tests/js/runtime/utility-list-builders.test.js", ["saved loop layout keeps edit timestamps", "reserve the same timestamp-row height"]),
              ("music_app/static/css/runtime/non-album-and-player.css", [".utility-loop-shell", ".utility-loop-player", ".utility-loop-timeline-wrap", "grid-template-rows: 22px 44px"]),
              ("tests/components/buttonInteractionOutline.spec.js", ["non-green player surfaces derive computed action hover colors", "samples[0].background"]),
              ("music_app/static/css/button-component.css", [".action-button:hover", ".ui-button:hover", ".ui-button--quiet:hover"]),
              ("music_app/static/css/appearance-backgrounds.css", ["--appearance-item-action-hover-background", ".artist-family-panel__artist:hover"]),
              ("tests/components/searchInput.spec.js", ["Settings filter dropdown right edge joins its anchor button"]),
              ("tests/components/triggerAnchorSurface.spec.js", ["a dropdown extending both sides has mirrored left and right joins"]),
              ("music_app/static/css/runtime/trigger-anchor.css", [".trigger-anchor-surface::after", ".trigger-anchor-open::after"]),
              ("music_app/static/js/runtime/player-loop-playback.js", ["data-loop-action-owner", "loopActionOwner"]),
              ("music_app/static/js/runtime/utility-loop-playback.js", ["data-loop-action-owner", "loopActionOwner"]),
              ("music_app/static/js/runtime/utility-list-builders.js", ["data-loop-action-owner", "loopActionOwner"]),
              ("tests/e2e/actions/galleryActions.js", ["scrollToAlbumUnderHeading"]),
              ("tests/e2e/actions/navigationPanelActions.js", ["setArtistTreeFolded", "selectSidebarArtistAt", "clickAllArtists"]),
              ("music_app/static/js/runtime/navigation-tree.js", ["data-sidebar-all-artists", "folded", "expanded"]),
              ("tests/e2e/phase7/poms/capabilityBoundaryPage.js", ["forbidden"]),
              ("tests/e2e/phase7/actions/capabilityBoundaryActions.js", ["ui.forbidden", "page.goto('/admin/members')"]),
          ]
          for raw, needles in targets:
              path = Path(raw)
              print(f"\n===== {raw} =====")
              if not path.exists():
                  print("MISSING")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              emitted=set()
              for needle in needles:
                  matches=[i for i,line in enumerate(lines) if needle in line]
                  print(f"--- needle {needle!r}: {len(matches)} match(es)")
                  for i in matches[:8]:
                      lo=max(0,i-18); hi=min(len(lines),i+42)
                      key=(lo,hi)
                      if key in emitted: continue
                      emitted.add(key)
                      for n in range(lo,hi):
                          print(f"{n+1:05d}: {lines[n]}")
