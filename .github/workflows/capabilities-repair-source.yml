name: Capabilities Repair Evidence

on:
  push:
    branches: [2026-09-25-capabilities-audit]
    paths: [.github/workflows/capabilities-repair-source.yml]

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-25-capabilities-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      TARGET_BRANCH: 2026-09-25-capabilities-audit
    steps:
      - uses: actions/checkout@v4
      - name: Remove retrieved temporary source transport
        shell: bash
        run: |
          set -euo pipefail
          if test -d .agent-repair-source; then
            test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
            git rm -r -- .agent-repair-source
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(review): remove completed source transport'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - name: Read the completed CI failure inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for job in 109189962638 109189962584 109189962522 109189962653 109189962670 109189962685 109189962724 109189962747 109189962855 109189962913; do
            gh api --allow-escape-sequences "repos/idanilovqa/AlbumHaven/actions/jobs/$job/logs" > "$RUNNER_TEMP/failure-$job.log"
          done
          python - <<'PY'
          import os, pathlib, re
          jobs = [(109189962638, 'Portable JavaScript'), (109189962584, 'Windows JavaScript'), (109189962522, 'Components'), (109189962653, 'Administration'), (109189962670, 'Playback utilities'), (109189962685, 'Gallery search visual'), (109189962724, 'Metadata mutations'), (109189962747, 'Synthetic performance'), (109189962855, 'Scan performance'), (109189962913, 'Cover providers')]
          for job, name in jobs:
              p = pathlib.Path(os.environ['RUNNER_TEMP']) / f'failure-{job}.log'
              lines = [re.sub(r'\x1b\[[0-9;]*m', '', line) for line in p.read_text(encoding='utf-8', errors='replace').splitlines()]
              lines = [re.sub(r'^\d{4}-\d\d-\d\dT[0-9:.]+Z\s?', '', line) for line in lines]
              print(f'\n=== Job {job}: {name}; original source 3a8d6784806acf14c898414815fcb11ec167f58f ===')
              starts = [i for i, line in enumerate(lines) if re.search(r'\bnot ok \d+\b', line) or re.match(r'^\s*\d+\)\s+.*(?:\.spec\.js|\u203a)', line)]
              for start in starts:
                  end = start + 1
                  while end < len(lines) and not re.search(r'# Subtest:|^\s*\d+\)\s+|^\s*\d+ (?:failed|passed)|^\s*attachment #|^\s*\.\.\.\s*$', lines[end]):
                      end += 1
                  block = lines[max(0, start - 1):end]
                  if len(block) > 75:
                      print('\n'.join(block[:45] + ['[Long assertion body omitted; original job retains complete evidence.]'] + block[-20:]))
                  else:
                      print('\n'.join(block))
              print('--- Totals and runtime errors ---')
              for line in lines:
                  if re.search(r'# (?:tests|pass|fail|skipped) \d+\b|^\s*\d+ (?:failed|passed)|##\[error\]|hard-fail|^\s*(?:Error|TimeoutError):', line):
                      print(line[:2000])
          PY
