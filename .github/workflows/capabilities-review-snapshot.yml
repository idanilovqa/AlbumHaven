name: Capabilities Review Snapshot

on:
  push:
    branches: [2026-09-25-capabilities-audit]
    paths: [.github/workflows/capabilities-review-snapshot.yml]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: github.repository == 'idanilovqa/AlbumHaven'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed source without credentials or private submodules
        uses: actions/checkout@v5
        with:
          ref: 6cb2b6f492de9bc6e313f2d30e350631e75a955d
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Archive tracked source and comparison evidence
        shell: bash
        run: |
          set -euo pipefail
          head=6cb2b6f492de9bc6e313f2d30e350631e75a955d
          base=a5c23fc8963f9ecc531468a61653bf2d798e8c6d
          test "$(git rev-parse HEAD)" = "$head"
          merge_base=$(git merge-base "$base" "$head")
          out="$RUNNER_TEMP/capabilities-review-snapshot"
          mkdir -p "$out"
          git archive --format=tar.gz --output="$out/head.tar.gz" "$head"
          git archive --format=tar.gz --output="$out/base.tar.gz" "$base"
          git archive --format=tar.gz --output="$out/merge-base.tar.gz" "$merge_base"
          git diff --no-ext-diff --find-renames --unified=8 "$merge_base" "$head" > "$out/branch.diff"
          git diff --no-ext-diff --name-status "$merge_base" "$head" > "$out/changed-paths.tsv"
          git diff --no-ext-diff --numstat "$merge_base" "$head" > "$out/changed-lines.tsv"
          git log --format='%H %s' "$merge_base..$head" > "$out/commits.txt"
          git ls-tree -r "$head" > "$out/head-tree.txt"
          printf 'head=%s\nbase=%s\nmerge_base=%s\nci_run=%s\n' "$head" "$base" "$merge_base" 36441467561 > "$out/manifest.txt"
          (cd "$out" && sha256sum *.tar.gz branch.diff changed-paths.tsv changed-lines.tsv commits.txt head-tree.txt manifest.txt > SHA256SUMS)
      - name: Collect the completed failed run's full GitHub-masked logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/capabilities-review-snapshot"
          gh api repos/idanilovqa/AlbumHaven/actions/runs/36441467561/logs > "$out/ci-run-36441467561-logs.zip"
          gh api --paginate repos/idanilovqa/AlbumHaven/actions/runs/36441467561/jobs?per_page=100 > "$out/ci-jobs.json"
          (cd "$out" && sha256sum ci-run-36441467561-logs.zip ci-jobs.json >> SHA256SUMS)
      - name: Upload review-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-review-snapshot-6cb2b6f
          path: ${{ runner.temp }}/capabilities-review-snapshot/
          if-no-files-found: error
          retention-days: 1
