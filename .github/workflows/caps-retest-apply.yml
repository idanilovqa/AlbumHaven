name: Apply verified capabilities retest

on:
  push:
    branches: [2026-09-25-capabilities-audit]
    paths: [.github/workflows/caps-retest-apply.yml]

permissions:
  contents: write

concurrency:
  group: capabilities-retest-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-25-capabilities-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned source and apply exact tested bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          root = Path.cwd()
          base = '6cea0a07830cf4f24235e63f4737f247ab9a082d'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          prior_changes = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert all(name.startswith('.github/caps-retest-transfer/') or name == '.github/workflows/caps-retest-apply.yml' for name in prior_changes), 'Application changed since the pinned baseline'
          records = []
          for source in sorted(Path('.github/caps-retest-transfer').glob('*.json')):
              data = json.loads(source.read_text())
              assert data['base'] == base
              records.extend(data['files'])
          assert len(records) == 49 and len({r['path'] for r in records}) == 49
          signature = hashlib.sha256(json.dumps(sorted((r['path'], r['before'], r['after']) for r in records), separators=(',', ':')).encode()).hexdigest()
          assert signature == 'ba6a5fa1e4dcc681d28e56707caeefb7c3809cb397740cee11b0b33dc8eee498', 'Transfer inventory mismatch'
          prepared = []
          for record in records:
              name = record['path']
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('music_app/', 'tests/')) or name == 'requirements.txt'
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              if record['before'] is None:
                  assert not path.exists(), name
                  original = b''
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == record['before'], 'Source hash mismatch: ' + name
              lines = original.decode('utf-8').splitlines(keepends=True)
              previous = 0
              for edit in record['edits']:
                  start, end = edit['start'], edit['end']
                  assert type(start) is int and type(end) is int
                  assert previous <= start <= end <= len(lines)
                  assert isinstance(edit['text'], str)
                  previous = end
              for edit in reversed(record['edits']):
                  lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == record['after'], 'Result hash mismatch: ' + name
              prepared.append((path, result))
          for path, result in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          Path('/tmp/caps-retest-expected.json').write_text(json.dumps(records))
          print('All 49 source files matched their pinned input and tested output hashes.')
          PY
      - name: Install current branch requirements
        run: python -m pip install -r requirements.txt
      - name: Rebuild and syntax-check the production browser bundle
        run: |
          node scripts/build-runtime-bundle.cjs
          node --check music_app/static/js/runtime-bundle.js
      - name: Focused Python regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/py/test_capability_ui.py tests/py/test_capability_demo_ui_regressions.py tests/py/test_capability_assignment_templates.py tests/py/test_capabilities_retest.py
      - name: Focused JavaScript regression tests
        run: node --test tests/js/runtime/account-menu.test.js tests/js/runtime/admin-members.test.js tests/js/runtime/admin-capability-assignment.test.js tests/js/runtime/capability-ui.test.js tests/js/runtime/capability-navigation-regressions.test.js tests/js/runtime/player-loop-playback.test.js
      - name: Commit verified application files without changing another branch
        shell: bash
        env:
          TARGET_BRANCH: 2026-09-25-capabilities-audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          records = json.loads(Path('/tmp/caps-retest-expected.json').read_text())
          for record in records:
              assert hashlib.sha256(Path(record['path']).read_bytes()).hexdigest() == record['after'], record['path']
          subprocess.run(['git', 'add', '--', *(r['path'] for r in records), 'music_app/static/js/runtime-bundle.js'], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.github/caps-retest-transfer'], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          allowed = {r['path'] for r in records} | {'music_app/static/js/runtime-bundle.js'}
          assert all(name in allowed or name.startswith('.github/caps-retest-transfer/') for name in staged)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capabilities): repair settings access and modernize Admin editing'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD
