name: Publish completed PR 3 Python repair

on:
  push:
    branches: [2026-09-18-pr3-python-batch]
    paths:
      - .chat-editor/python-followup.patch
      - .github/workflows/chat-editor-apply-python-batch.yml

permissions:
  contents: write

concurrency:
  group: pr3-python-batch-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 3af8d1ce8c7c42fea6a783ad667ece9587b43f80
      TARGET_BRANCH: 2026-09-08-settings-refactor
      PATCH_SHA256: 393f698070a1c7aee533882ee6ac6553053f1543a91bc903f0d924cf8dfa8bf8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify completed patch and unchanged PR head
        shell: bash
        run: |
          set -euo pipefail
          head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$head" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          patch = Path('.chat-editor/python-followup.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256'], 'Patch digest mismatch'
          Path(os.environ['RUNNER_TEMP'], 'python-followup.patch').write_bytes(patch)
          print('Verified complete request-app identity patch, bytes:', len(patch))
          PY
          git switch --detach "$EXPECTED_HEAD"
          git apply --check --whitespace=error-all "$RUNNER_TEMP/python-followup.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/python-followup.patch"
      - name: Validate and stage only the completed repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          files = ['tests/py/test_api_wave_a_asgi_routes.py']
          for name in files:
              ast.parse(Path(name).read_text(encoding='utf-8'), filename=name)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert staged == files, staged
          PY
      - name: Publish the verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: assert library-settings configuration against the request app'
          head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$head" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Repair commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Authoritative native PR Python CI is still required.' >> "$GITHUB_STEP_SUMMARY"
