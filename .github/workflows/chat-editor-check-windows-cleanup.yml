name: Verify Windows pytest cleanup repair
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths:
      - .github/workflows/chat-editor-check-windows-cleanup.yml
      - .chat-editor/e2e-run199-candidates/cleanup.patch
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Apply only the cleanup candidate to the exact PR head
        run: |
          Copy-Item .chat-editor/e2e-run199-candidates/cleanup.patch "$env:RUNNER_TEMP/cleanup.patch"
          git switch --detach 2ba1b63cd2b17a7d0d8e7ccea25a47cd22b80e8c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check --whitespace=error-all "$env:RUNNER_TEMP/cleanup.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --whitespace=error-all "$env:RUNNER_TEMP/cleanup.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pip install -r requirements.txt
      - name: Verify lifecycle and concurrency under native Windows filesystem semantics
        run: |
          # This focused hosted exception investigates the Windows-only cleanup failure.
          # No PR changes, full-suite result, timeout increase or test retry policy is implied.
          1..3 | ForEach-Object {
            python -m pytest -q tests/py/test_pytest_harness_config.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check
