name: Chat Editor CI Repair
on:
  push:
    branches: [2026-09-08-settings-refactor]
    paths: [.chat-editor/ci-repair.py]
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Apply repairs
        run: python .chat-editor/ci-repair.py
      - name: Focused JavaScript
        run: node --test --test-concurrency=1 tests/js/search-toolbar-anchor-geometry.test.js tests/js/track-modal-actions.test.js
      - name: Focused Python compatibility
        run: python -m pytest -q tests/py/test_listen_history.py tests/py/test_lastfm_retry.py
      - name: Publish repair
        run: |
          git diff --check
          git add tests/e2e/poms/searchToolbar.js tests/e2e/actions/trackModalActions.js music_app/services/listen_history.py
          git rm .chat-editor/ci-repair.py .github/workflows/chat-editor-ci-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair CI helper compatibility'
          git push origin HEAD:2026-09-08-settings-refactor
