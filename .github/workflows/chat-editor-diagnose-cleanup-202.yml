name: Diagnose PR 3 Windows cleanup
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths: [.github/workflows/chat-editor-diagnose-cleanup-202.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve diagnostic helper and check out exact current PR head
        run: |
          cp .chat-editor/diagnose-cleanup.py "$RUNNER_TEMP/diagnose-cleanup.py"
          git switch --detach ff81ffd4e846fa6606054b9d3b30dadffa4a6e18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture exact probe identities and cleanup outcomes
        run: python "$RUNNER_TEMP/diagnose-cleanup.py"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-cleanup-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup-diagnostics
          if-no-files-found: error
          retention-days: 14
