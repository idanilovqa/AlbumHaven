name: Diagnose PR 3 Windows cleanup
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths: [.github/workflows/chat-editor-diagnose-cleanup-202.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve diagnostic helper and check out exact current PR head
        run: |
          cp .chat-editor/diagnose-cleanup.py "$RUNNER_TEMP/diagnose-cleanup.py"
          git switch --detach ff81ffd4e846fa6606054b9d3b30dadffa4a6e18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Archive exact tracked text to the diagnostic branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,urllib.request,urllib.error
          from pathlib import Path
          head='ff81ffd4e846fa6606054b9d3b30dadffa4a6e18'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          names=subprocess.check_output(['git','ls-tree','-r','--name-only',head],text=True).splitlines()
          ext={'.py','.js','.cjs','.mjs','.css','.html','.json','.md','.txt','.ini','.yml','.yaml','.toml','.sql','.ps1'}
          names=[n for n in names if Path(n).suffix in ext and not n.startswith(('.codex-restart/','.chat-editor/','docs/design-mockups/'))]
          # Feed paths through stdin to avoid the Windows process argument-length limit.
          raw=subprocess.check_output(['git','archive','--format=tar',head])
          import io,tarfile
          trimmed=io.BytesIO()
          selected=set(names)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as source,tarfile.open(fileobj=trimmed,mode='w:') as target:
              for member in source:
                  if member.isfile() and member.name in selected:
                      target.addfile(member,source.extractfile(member))
          archive=gzip.compress(trimmed.getvalue(),mtime=0)
          filename='.chat-editor/current-ff81ffd4-source.tar.gz'
          branch='2026-09-18-pr3-e2e-batch'
          url='https://api.github.com/repos/idanilovqa/AlbumHaven/contents/'+filename
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'AlbumHaven-owned-diagnostic'}
          payload={'message':'checkpoint: preserve exact ff81ffd4 source for the authorized repair','branch':branch,'content':base64.b64encode(archive).decode()}
          try:
              previous=json.load(urllib.request.urlopen(urllib.request.Request(url+'?ref='+branch,headers=headers)))
              payload['sha']=previous['sha']
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
          result=json.load(urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method='PUT')))
          print('Source archive head:',head,'bytes:',len(archive),'sha256:',hashlib.sha256(archive).hexdigest())
          print('Diagnostic branch archive blob:',result['content']['sha'])
          PY
      - name: Capture bounded diagnostic repetitions and exact cleanup errors
        run: python "$RUNNER_TEMP/diagnose-cleanup.py"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-cleanup-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup-diagnostics
          if-no-files-found: error
          retention-days: 14
