name: Prepare PR 3 diagnostic dependencies
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths: [.github/workflows/chat-editor-e2e-environment.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build minimal public diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/offline-e2e-minimal"
          mkdir -p "$dest/wheels" "$RUNNER_TEMP/pg-source"
          cd "$RUNNER_TEMP/pg-source"
          curl --fail --retry 2 -O https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2
          curl --fail --retry 2 -O https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2.sha256
          sha256sum --check postgresql-17.6.tar.bz2.sha256
          tar -xjf postgresql-17.6.tar.bz2
          cd postgresql-17.6
          ./configure --prefix=/mnt/data/offline-pg --without-icu --without-readline --without-zlib --without-lz4 --without-zstd --without-ssl --without-gssapi --disable-nls
          make -j4 > "$RUNNER_TEMP/pg-build.log" 2>&1
          make DESTDIR="$dest" install > "$RUNNER_TEMP/pg-install.log" 2>&1
          make -C contrib/pg_trgm -j4 >> "$RUNNER_TEMP/pg-build.log" 2>&1
          make -C contrib/pg_trgm DESTDIR="$dest" install >> "$RUNNER_TEMP/pg-install.log" 2>&1
          find "$dest/mnt/data/offline-pg" -type f -executable -exec strip --strip-unneeded {} \; || true
          python -m pip download --only-binary=:all: --dest "$dest/wheels" psycopg ytmusicapi zstandard aiosmtplib 'watchdog>=4.0,<7'
          cd "$GITHUB_WORKSPACE"
          tar -czf "$RUNNER_TEMP/minimal-dependencies.tar.gz" -C "$dest" .
          mkdir -p .chat-editor/offline-e2e/minimal
          split -b 900000 -d -a 3 "$RUNNER_TEMP/minimal-dependencies.tar.gz" .chat-editor/offline-e2e/minimal/part-
          sha256sum "$RUNNER_TEMP/minimal-dependencies.tar.gz" | cut -d' ' -f1 > .chat-editor/offline-e2e/minimal/sha256.txt
          du -h "$RUNNER_TEMP/minimal-dependencies.tar.gz"
          ls -l .chat-editor/offline-e2e/minimal/
      - name: Retain only the small public runtime package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch -- .chat-editor/offline-e2e/dependencies.tar.gz .chat-editor/offline-e2e/SHA256SUMS
          git add -f -- .chat-editor/offline-e2e/minimal
          git commit -m 'ci: retain minimal public diagnostic runtime in retrievable parts'
          git pull --rebase origin 2026-09-18-pr3-e2e-batch
          git push origin HEAD:refs/heads/2026-09-18-pr3-e2e-batch
