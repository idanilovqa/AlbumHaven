name: Chat Editor E2E Ownership Repair
on:
  push:
    branches: [2026-09-08-settings-refactor]
    paths: [.chat-editor/e2e-ownership-repair.py]
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: python .chat-editor/e2e-ownership-repair.py
      - name: Validate shard ownership
        run: node scripts/ci/validate-functional-shards.cjs --list
      - name: Publish
        run: |
          git diff --check
          git add tests/e2e/specs/appearanceControls.spec.js tests/e2e/specs/settingsRefactorShell.spec.js tests/e2e/specs/settingsIntegrations.functional.spec.js tests/e2e/specs/loops.functional.spec.js
          git rm .chat-editor/e2e-ownership-repair.py .github/workflows/chat-editor-e2e-ownership-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: restore native settings E2E ownership tags'
          git push origin HEAD:2026-09-08-settings-refactor
