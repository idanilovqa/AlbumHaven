name: Chat Editor Foundation Repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults: {run: {shell: pwsh}}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: requirements.txt}
      - run: |
          npm ci
          python -m pip install -r requirements.txt
      - run: python .chat-editor/foundation-repair.py
      - name: Focused JavaScript
        run: node --test --test-concurrency=1 tests/js/search-toolbar-anchor-geometry.test.js tests/js/track-modal-actions.test.js
      - name: Focused Python
        run: python -m pytest -q tests/py/test_api_read_asgi_routes.py tests/py/test_api_wave_a_asgi_routes.py tests/py/test_api_wave_b_asgi_routes.py tests/py/test_log_history_route_scope.py tests/py/test_listen_history.py tests/py/test_lastfm_retry.py
      - name: Publish
        run: |
          git diff --check
          git add tests/e2e/poms/searchToolbar.js tests/e2e/actions/trackModalActions.js music_app/services/listen_history.py tests/py/test_api_read_asgi_routes.py tests/py/test_api_wave_a_asgi_routes.py tests/py/test_api_wave_b_asgi_routes.py tests/py/test_log_history_route_scope.py
          git rm .chat-editor/foundation-repair.py .github/workflows/chat-editor-foundation-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align scoped foundation contracts'
          git push origin HEAD:2026-09-08-settings-refactor
