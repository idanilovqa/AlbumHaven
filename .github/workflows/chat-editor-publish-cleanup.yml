name: Verify and publish pytest cleanup correction
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths: [.github/workflows/chat-editor-publish-cleanup.yml]
permissions:
  contents: write
concurrency:
  group: pr3-e2e-complete-batch-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: 454b6b6645789014c197d4b4e53b6d14b64258c3
      TARGET_BRANCH: 2026-09-08-settings-refactor
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify and apply the locally tested correction
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          patch=Path('.chat-editor/run199-backoff.patch').read_text(encoding='utf-8').encode('utf-8')
          assert len(patch)==4269
          assert hashlib.sha256(patch).hexdigest()=='4086bfc659b571273c3e719f175326df9c374bf7031943a82be0ee386d847d9d'
          files={}
          for block in patch.decode('utf-8').split('diff --git ')[1:]:
              lines=block.splitlines();left,right=lines[0].split(' b/',1)
              assert left=='a/'+right and right.startswith(('tests/py/','docs/'))
              match=re.fullmatch(r'index ([0-9a-f]{40})\.\.([0-9a-f]{40}) 100644',lines[1])
              assert match and right not in files
              files[right]=match.group(2)
          assert len(files)==3
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'cleanup.patch').write_bytes(patch)
          (tmp/'cleanup-files.json').write_text(json.dumps(files),encoding='utf-8')
          PY
          git switch --detach "$EXPECTED_HEAD"
          git apply --check --whitespace=error-all "$RUNNER_TEMP/cleanup.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/cleanup.patch"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify focused Windows harness including concurrent real processes
        run: |
          set -euo pipefail
          python -m pytest -q tests/py/test_pytest_harness_config.py --tb=short
      - name: Publish only exact verified files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          files=json.loads(Path(os.environ['RUNNER_TEMP'],'cleanup-files.json').read_text(encoding='utf-8'))
          for name,digest in files.items():
              actual=subprocess.check_output(['git','hash-object','--',name],text=True).strip()
              assert actual==digest,(name,actual,digest)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(staged)==sorted(files)
          PY
          git config user.name 'idanilovqa'
          git config user.email '39825960+idanilovqa@users.noreply.github.com'
          git commit -m 'test: revalidate temporary-root ownership before every cleanup attempt'
          test "$(git ls-remote --exit-code origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Published $(git rev-parse HEAD); full native PR CI remains required." >> "$GITHUB_STEP_SUMMARY"
