name: Diagnose Windows pytest cleanup
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths: [.github/workflows/chat-editor-pytest-cleanup-probe.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ff81ffd4e846fa6606054b9d3b30dadffa4a6e18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Instrument cleanup return reasons and file state
        run: |
          @'
          from pathlib import Path
          p=Path('tests/py/conftest.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def _remove_owned_generated_pytest_root(')
          end=s.index('\ndef _cleanup_stale_generated_pytest_roots()',start)
          block=s[start:end]
          lines=block.splitlines()
          for i,line in enumerate(lines):
              if line.strip()=='return False':
                  indent=line[:len(line)-len(line.lstrip())]
                  lines[i]=indent+f"print('CLEANUP REFUSED line {i}:', path.name, 'entries:', [v.name for v in path.iterdir()] if path.is_dir() else 'absent', file=sys.stderr, flush=True)\n"+line
          block='\n'.join(lines)+'\n'
          block=block.replace('except OSError:\n            if not path.exists():', "except OSError as exc:\n            print('CLEANUP OS ERROR:', path.name, repr(exc), file=sys.stderr, flush=True)\n            if not path.exists():")
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          q=Path('tests/py/test_pytest_harness_config.py')
          t=q.read_text(encoding='utf-8')
          t=t.replace('assert process.returncode == 0, stdout + stderr', "print('CHILD:', stdout, stderr, flush=True)\n        assert process.returncode == 0, stdout + stderr")
          t=t.replace('assert all(not root.exists() for root in roots)', "assert all(not root.exists() for root in roots), {str(root): [str(p.relative_to(root)) for p in root.rglob('*')] for root in roots if root.exists()}")
          q.write_text(t,encoding='utf-8')
          '@ | python -
      - name: Run bounded independent concurrent probes
        run: |
          for ($i=0; $i -lt 12; $i++) {
            Write-Output "ROUND $i"
            python -m pytest -q -s --tb=short tests/py/test_pytest_harness_config.py -k two_concurrent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
