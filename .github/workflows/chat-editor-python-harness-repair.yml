name: Chat Editor Python Harness Repair
on:
  push:
    branches: [2026-09-08-settings-refactor]
    paths:
      - .chat-editor/python-harness-repair.py
      - .github/workflows/chat-editor-python-harness-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python .chat-editor/python-harness-repair.py
      - name: Focused app factory import contracts
        run: python -m pytest -q tests/py/test_app_factory.py -k "retained_dependency_manifests or active_python_surfaces or asgi_factory_imports"
      - name: Publish
        run: |
          git diff --check
          git add tests/py/test_app_factory.py
          git rm .chat-editor/python-harness-repair.py .github/workflows/chat-editor-python-harness-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore app factory test harness dependencies'
          git push origin HEAD:2026-09-08-settings-refactor
