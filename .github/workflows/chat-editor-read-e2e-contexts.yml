name: Read retained E2E failure contexts
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths: [.github/workflows/chat-editor-read-e2e-contexts.yml]
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: functional-debug-playback-utilities-1
          run-id: 35408558207
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/e2e-contexts
      - name: Preserve only sanitized textual failure context
        shell: python
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/e2e-contexts
        run: |
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          documents = []
          for path in sorted(root.rglob('*')):
              if path.name not in ('error-context.md', 'step-transcript.txt'):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              text = re.sub(r'[A-Za-z]:[\\/][^\n<>"\']+', '[fixture-path]', text)
              text = re.sub(r'(?i)(?:password|session_key|api_key|api_sig|csrf_token|authorization)\s*[:=]\s*[^\s,;]+', '[redacted]', text)
              documents.append({'name': str(path.relative_to(root)), 'text': text})
          if not documents:
              raise RuntimeError('No retained textual browser contexts found')
          target = Path('.chat-editor/e2e-current/browser-contexts.json')
          target.write_text(json.dumps({'run':35408558207,'head':'4e4d93dfcb3fb11bc43e2fd2c2e4381cd7d91091','documents':documents}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('Recovered contexts:', len(documents))
      - name: Checkpoint evidence on the diagnostic branch only
        shell: bash
        run: |
          set -euo pipefail
          git add .chat-editor/e2e-current/browser-contexts.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: preserve sanitized browser failure context from run 192'
          git push origin HEAD:2026-09-18-pr3-e2e-batch
