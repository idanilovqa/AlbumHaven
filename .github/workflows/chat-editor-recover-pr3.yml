name: Recover verified PR3 repair batch
on:
  push:
    branches: [2026-09-18-pr3-e2e-batch]
    paths:
      - .github/workflows/chat-editor-recover-pr3.yml
      - .chat-editor/recover-pr3.py
      - .chat-editor/recover-pr3-manifest.json
      - .chat-editor/recover-pr3-note.md
permissions:
  contents: write
concurrency:
  group: pr3-recovery-publication-20260919
  cancel-in-progress: false
jobs:
  verify_publish:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: work
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout reviewed transport
        uses: actions/checkout@v5
        with:
          path: transport
          fetch-depth: 0
      - name: Checkout exact application head
        uses: actions/checkout@v5
        with:
          path: work
          ref: ff81ffd4e846fa6606054b9d3b30dadffa4a6e18
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and patch identities, apply the complete batch
        run: python ../transport/.chat-editor/recover-pr3.py apply
      - name: Install exact Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up pinned native Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '151.0.7922.138'
      - name: Verify changed Node contracts and direct neighbors
        id: node
        continue-on-error: true
        run: python ../transport/.chat-editor/recover-pr3.py node
      - name: Verify all native Windows cleanup contracts
        id: python
        continue-on-error: true
        run: python ../transport/.chat-editor/recover-pr3.py python
      - name: Verify pinned Chrome player components without refreshing snapshots
        id: components
        continue-on-error: true
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: python ../transport/.chat-editor/recover-pr3.py components
      - name: Require all verification and publish only reviewed files
        env:
          NODE_RESULT: ${{ steps.node.outcome }}
          PYTHON_RESULT: ${{ steps.python.outcome }}
          COMPONENT_RESULT: ${{ steps.components.outcome }}
        run: python ../transport/.chat-editor/recover-pr3.py publish
      - name: Retain focused verification and exact repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr3-recovery-evidence/
            work/test-results/playwright-artifacts/components/
          if-no-files-found: warn
          retention-days: 14
