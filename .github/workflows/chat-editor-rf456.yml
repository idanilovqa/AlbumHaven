name: Chat Editor RF4-RF6 Builder
on:
  push:
    branches: [2026-09-08-settings-refactor]
    paths:
      - .chat-editor/rf456.py
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Provision focused Postgres
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 -Mode Provision -ExpectedMajorVersion 17 -Pgbin $env:PGBIN -HostName 127.0.0.1 -DatabaseSuffix "rf456_${{ github.run_id }}_${{ github.run_attempt }}" -StatePath "${{ runner.temp }}\rf456.state.json" -AppPrivilegeMode Inherited -SkipFixtureLoad
          "ALBUM_HAVEN_POSTGRES_CONTRACT_DATABASE_URL=$env:DATABASE_APP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prove RF4 fails before the patch
        run: |
          $env:PGPASSWORD=$null
          python -m pytest -q tests/py/test_settings_measured_retry_account.py -k test_retry_limit_applies_after_connected_account_selection
          if ($LASTEXITCODE -eq 0) { throw 'RF4 unexpectedly passed before repair' }
          exit 0
      - name: Apply RF4-RF6 and regenerate tracked runtime
        run: |
          python .chat-editor/rf456.py
          node scripts/build-runtime-bundle.cjs
      - name: Focused JavaScript verification
        run: |
          node --test --test-concurrency=1 tests/js/runtime/bootstrap-utility-event-handlers.test.js tests/js/runtime/app-loader-bundle.test.js
      - name: Focused Python verification
        run: |
          $env:PGPASSWORD=$null
          python -m pytest -q tests/py/test_lastfm_retry.py tests/py/test_settings_measured_retry_account.py
      - name: Commit tested repair and remove temporary builder
        run: |
          git diff --check
          git add music_app/services/lastfm_retry.py music_app/services/listen_history.py music_app/services/listen_history_postgres.py music_app/static/js/runtime/bootstrap-utility-event-handlers.js music_app/static/js/runtime-bundle.js tests/py/test_lastfm_retry.py
          git rm .chat-editor/rf456.py .github/workflows/chat-editor-rf456.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address RF4-RF6 review findings'
          git push origin HEAD:2026-09-08-settings-refactor
      - name: Teardown focused Postgres
        if: always()
        run: |
          $state='${{ runner.temp }}\rf456.state.json'
          if (Test-Path $state) { .\scripts\ci\bootstrap-windows-postgres.ps1 -Mode Teardown -ExpectedMajorVersion 17 -Pgbin $env:PGBIN -HostName 127.0.0.1 -DatabaseSuffix "rf456_${{ github.run_id }}_${{ github.run_attempt }}" -StatePath $state }
