name: Chat Editor Runtime Repair
on:
  push:
    branches: [2026-09-08-settings-refactor]
    paths: [.chat-editor/runtime-repair.py]
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .chat-editor/runtime-repair.py
      - run: node scripts/build-runtime-bundle.cjs
      - name: Focused JavaScript
        run: node --test --test-concurrency=1 tests/js/runtime/settings-refactor-shell.test.js tests/js/runtime/tag-editor-and-optimistic-updates.test.js tests/js/runtime/app-loader-bundle.test.js
      - name: Publish
        run: |
          git diff --check
          git add music_app/static/js/runtime/tag-editor-and-optimistic-updates.js music_app/static/js/runtime/utility-list-builders.js music_app/static/js/runtime-bundle.js tests/js/runtime/settings-refactor-shell.test.js
          git rm .chat-editor/runtime-repair.py .github/workflows/chat-editor-runtime-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore settings runtime contracts'
          git push origin HEAD:2026-09-08-settings-refactor
