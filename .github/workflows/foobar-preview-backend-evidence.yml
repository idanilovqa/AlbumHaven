            --input-dir "$RUNNER_TEMP/foobar-preview-inputs"

      - name: Retain reconcile proof without masking any failure
        id: upload
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: preview-v1-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-reconcile
          path: ${{ runner.temp }}/foobar-preview-output
          if-no-files-found: error
          overwrite: false
          retention-days: 14
