name: Mobile Local Reproduction Tools
on:
  push:
    branches: [2026-09-29-mobile-ci-repair-evidence]
    paths: [.github/workflows/mobile-ci-local-tools.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 234d4f5c579be29b3f19dcd72afb7719c13d4ed4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect public binaries only, never a database or account state
        run: |
          docker pull postgres:17
          mkdir -p reproduction-tools/pg
          docker run --rm --entrypoint tar postgres:17 -chf - /usr/lib/postgresql/17 /usr/share/postgresql/17 | tar -xf - -C reproduction-tools/pg
          rm -rf reproduction-tools/pg/usr/lib/postgresql/17/lib/bitcode
          mv node_modules reproduction-tools/
          tar -C reproduction-tools -cJf reproduction-tools.tar.xz .
      - name: Expose verified binary parts to the authenticated editor
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const bytes = fs.readFileSync('reproduction-tools.tar.xz');
            const tree = [], parts = [];
            for (let offset = 0, index = 0; offset < bytes.length; offset += 800000, index++) {
              const name = `tools-${String(index).padStart(3, '0')}.bin`;
              const data = bytes.subarray(offset, offset + 800000);
              const blob = await github.rest.git.createBlob({...context.repo, encoding: 'base64', content: data.toString('base64')});
              parts.push({name, sha256: crypto.createHash('sha256').update(data).digest('hex')});
              tree.push({path: name, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const manifest = {source_commit: '234d4f5c579be29b3f19dcd72afb7719c13d4ed4', sha256: crypto.createHash('sha256').update(bytes).digest('hex'), parts};
            const blob = await github.rest.git.createBlob({...context.repo, encoding: 'utf-8', content: JSON.stringify(manifest)});
            tree.push({path: 'tools-manifest.json', mode: '100644', type: 'blob', sha: blob.data.sha});
            const t = await github.rest.git.createTree({...context.repo, tree});
            const c = await github.rest.git.createCommit({...context.repo, message: 'Public tooling for owner-authorized isolated failure reproduction', tree: t.data.sha, parents: []});
            console.log('REPRODUCTION_TOOLS ' + JSON.stringify({commit: c.data.sha, ...manifest}));
