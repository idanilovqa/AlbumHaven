name: Mobile CI Repair Evidence
on:
  push:
    branches: [2026-09-29-mobile-ci-repair-evidence]
    paths: [.github/workflows/mobile-ci-repair-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned tracked source and review delta
        shell: python
        run: |
          import gzip, hashlib, json, pathlib, subprocess
          source = '234d4f5c579be29b3f19dcd72afb7719c13d4ed4'
          base = subprocess.check_output(['git', 'merge-base', source, 'origin/main'], text=True).strip()
          output = pathlib.Path('repair-evidence')
          output.mkdir()
          archives = {
              'source': gzip.compress(subprocess.check_output(['git', 'archive', '--format=tar', source]), mtime=0),
              'review-diff': gzip.compress(subprocess.check_output(['git', 'diff', '--no-ext-diff', '--binary', base, source]), mtime=0),
          }
          manifest = {'source_commit': source, 'base_commit': base, 'archives': {}}
          for kind, data in archives.items():
              parts = []
              for number, start in enumerate(range(0, len(data), 800000)):
                  name = f'{kind}-{number:03d}.bin'
                  part = data[start:start + 800000]
                  (output / name).write_bytes(part)
                  parts.append({'name': name, 'sha256': hashlib.sha256(part).hexdigest(), 'size': len(part)})
              manifest['archives'][kind] = {'parts': parts, 'sha256': hashlib.sha256(data).hexdigest()}
          (output / 'source-tree.txt').write_bytes(subprocess.check_output(['git', 'ls-tree', '-r', source]))
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2))
      - name: Preserve source evidence without altering application branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tree = [];
            for (const name of fs.readdirSync('repair-evidence').sort()) {
              const blob = await github.rest.git.createBlob({...context.repo, content: fs.readFileSync(`repair-evidence/${name}`).toString('base64'), encoding: 'base64'});
              tree.push({path: name, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const result = await github.rest.git.createTree({...context.repo, tree});
            const commit = await github.rest.git.createCommit({...context.repo, message: 'Pinned public source evidence for owner-authorized mobile repair', tree: result.data.sha, parents: []});
            console.log('REPAIR_SOURCE_EVIDENCE ' + JSON.stringify({commit: commit.data.sha, ...JSON.parse(fs.readFileSync('repair-evidence/manifest.json', 'utf8'))}));
