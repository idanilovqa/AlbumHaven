name: Encrypted mobile fixture reproduction
on:
  push:
    branches: [chatgpt/mobile-fixture-session-20260930]
    paths: [.github/workflows/mobile-fixture-reproduction.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: idanilovqa/album-haven-test-data
          ref: b24265ffa15241f156d0197e7167e929dd9c1f4b
          token: ${{ secrets.ALBUM_HAVEN_FIXTURES_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public encryption dependency
        run: python -m pip install cryptography
      - name: Encrypt the exact fixture checkout for the temporary repair environment
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          expected = 'b24265ffa15241f156d0197e7167e929dd9c1f4b'
          actual = subprocess.check_output(['git', '-C', 'private-source', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise RuntimeError('Fixture checkout is not the requested immutable version')
          public_pem = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApppZ4xes+c7wxvViknOU
          7wi5z4PbcfLM1g8xuQD9vcQNNwF8bmAZZ4BhMMJfeEyntuIzQWzknmHxgPZTS7Iu
          PLrVaabTTSqUE2aSO6PGsXz6ECQkX+QPfyVj0qx3kvDtz+f3R5PyxJ4AkdcA8ETp
          FhKMPI5I7+kKEI5I5dS2t8/52aYiaTe8rXdoqnCXNC4hyMaWQ436OUWQXOp0G9Uz
          WXRy8OnmubA14ZzIm/YI6xEsYSMHhA43w+/pNliELS2SOR4BAQsPGBjnXaqwtWEw
          AQgfjoj5uy68AdW2Tb9f2187Rjj0xLp5lwZjZCNZOM8rC/Kk9cBo7VEm1mM1RiOw
          8GXiW7j/iPBKVGicjCsvUo/OT6hC80cGBxaQh9fi656Xk10nkWgwF1oGI25Rxejp
          Y4LLvrVs9l21GWTi2+Q8v0tFUVAItASISc9bL5fu3svPj8qUAB6SErsQjRhLwbt7
          UGmoe2ZWom8r1clpf2hjlWZ99j2nUh34MRxdnmKfVKe1AgMBAAE=
          -----END PUBLIC KEY-----'''
          public_key = serialization.load_pem_public_key(public_pem)
          data = subprocess.check_output(['git', '-C', 'private-source', 'archive', '--format=tar', 'HEAD'])
          key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          aad = ('AlbumHaven fixture reproduction ' + expected).encode()
          encrypted = AESGCM(key).encrypt(nonce, data, aad)
          wrapped = public_key.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          out = pathlib.Path('encrypted-export')
          out.mkdir()
          (out / 'fixture-source.enc').write_bytes(encrypted)
          (out / 'manifest.json').write_text(json.dumps({
              'source_commit': expected, 'algorithm': 'AES-256-GCM+RSA-OAEP-SHA256',
              'nonce': base64.b64encode(nonce).decode(), 'wrapped_key': base64.b64encode(wrapped).decode(),
              'plaintext_sha256': hashlib.sha256(data).hexdigest(),
              'ciphertext_sha256': hashlib.sha256(encrypted).hexdigest()
          }, indent=2))
      - name: Retain ciphertext only; never publish private fixture plaintext
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-fixture-source-${{ github.sha }}
          path: encrypted-export/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
