          function playwright(C, evidence, phase, extra, executed) {
            const args = [path.join('node_modules', '@playwright', 'test', 'cli.js'), 'test', '--config=playwright.component.config.js', 'tests/components/triggerAnchorSurface.spec.js', '--grep', C.grep, '--reporter=json', ...extra];
