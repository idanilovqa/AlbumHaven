            for (const [name, digest] of Object.entries(C.inputs)) {
              if (allowUpdatedGoldens && goldens.has(name)) continue;
              const resolved = path.resolve(name);
              requireThat(resolved.startsWith(process.cwd() + path.sep) && fs.lstatSync(name).isFile() && !fs.lstatSync(name).isSymbolicLink(), `Invalid source path: ${name}`);
              requireThat(sha256(fs.readFileSync(name)) === digest, `Pinned source/test/golden hash mismatch: ${name}`);
            }
          }
          function materializePinnedInputs(C) {
            // Checkout may retain CRLF files despite checkout-index's temporary EOL flags.
            // Copy only authenticated bytes from the pinned Git objects, never transform pixels.
            const prepared = [];
            for (const [name, digest] of Object.entries(C.inputs)) {
              const resolved = path.resolve(name);
              requireThat(resolved.startsWith(process.cwd() + path.sep) && fs.lstatSync(name).isFile() && !fs.lstatSync(name).isSymbolicLink(), `Invalid pinned input: ${name}`);
              const bytes = run('git', ['show', `${C.base}:${name}`]);
              requireThat(sha256(bytes) === digest, `Pinned Git object differs from reviewed input: ${name}`);
              prepared.push([name, bytes]);
            }
            for (const [name, bytes] of prepared) fs.writeFileSync(name, bytes);
          }
          function checkoutDiagnostics(C, evidence, status, dirtyPaths) {
            const optionalGit = (...args) => { try { return git(...args); } catch { return '<unset or unavailable>'; } };
            const dirty = dirtyPaths;
            const records = dirty.map(name => {
              const result = { path: name, stage: optionalGit('ls-files', '--stage', '--', name), attributes: optionalGit('check-attr', '-a', '--', name) };
              try {
                const raw = fs.readFileSync(name), index = run('git', ['show', `:${name}`]), pinned = run('git', ['show', `${C.base}:${name}`]);
                result.rawSha256 = sha256(raw); result.indexSha256 = sha256(index); result.pinnedSha256 = sha256(pinned);
                result.rawBlob = crypto.createHash('sha1').update(Buffer.from(`blob ${raw.length}\0`)).update(raw).digest('hex');
                result.indexBlob = optionalGit('rev-parse', `:${name}`); result.pinnedBlob = optionalGit('rev-parse', `${C.base}:${name}`);
                result.gitCleanedBlob = optionalGit('hash-object', `--path=${name}`, name);
                result.rawCRLF = raw.toString('latin1').split('\r\n').length - 1;
                result.indexCRLF = index.toString('latin1').split('\r\n').length - 1;
              } catch (error) { result.error = String(error.message); }
              return result;
            });
            const config = Object.fromEntries(['core.autocrlf','core.eol','core.filemode','core.attributesfile'].map(key => [key, optionalGit('config','--show-origin','--get',key)]));
            const report = { status, dirtyTracked: records, config, attributes: optionalGit('show', `${C.base}:.gitattributes`) };
            fs.writeFileSync(path.join(evidence, 'checkout-diagnostics.json'), JSON.stringify(report, null, 2));
