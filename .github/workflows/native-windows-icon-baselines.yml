            // and ignored pixels are grayscale. Require exact agreement with reported count.
            for (let y = 0; y < mask.height; ++y) for (let x = 0; x < mask.width; ++x) {
              const i = (y * mask.width + x) * 4;
              if (mask.data[i] === 255 && mask.data[i+1] === 0 && mask.data[i+2] === 0 && mask.data[i+3] === 255) {
