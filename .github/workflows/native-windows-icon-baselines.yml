            requireThat(specs.length === 3 && specs.map(s => s.title).sort().join('\n') === [...C.titles].sort().join('\n'), 'Selected component titles differ from the exact three cases');
            for (const spec of specs) {
              requireThat(spec.file.replaceAll('\\', '/') === 'triggerAnchorSurface.spec.js' && spec.tests.length === 1, 'Unexpected component file or project');
              const test = spec.tests[0];
              requireThat(test.expectedStatus === 'passed' && test.timeout === 30000 && test.annotations.length === 0, 'Test status, timeout or annotations changed');
              if (executed) requireThat(test.status === 'expected' && test.results.length === 1 && test.results[0].status === 'passed' && test.results[0].retry === 0, 'Selected test did not pass once with unchanged guards');
