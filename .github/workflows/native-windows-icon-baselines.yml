            requireThat(git('write-tree') === C.tree, 'Index tree differs from pinned candidate before stat refresh');
            run('git', ['diff', '--cached', '--exit-code', '--no-ext-diff', C.base, '--']);
            run('git', ['diff', '--exit-code', '--no-ext-diff', '--']);
            verifyInputs(C);
            // Refresh only stat metadata; do not stage, renormalize or alter file contents.
            run('git', ['update-index', '--refresh']);
            requireThat(git('write-tree') === C.tree, 'Stat refresh changed the pinned index tree');
            requireThat(!git('status', '--porcelain'), 'Pinned source is not clean');
          }
          function requirePinnedEol(stage) {
            requireThat(git('config', '--get', 'core.autocrlf') === 'false' && git('config', '--get', 'core.eol') === 'lf', `Pinned Git EOL runtime configuration missing after ${stage}`);
            console.log(`PINNED_GIT_EOL ${stage}: autocrlf=false eol=lf`);
          }
