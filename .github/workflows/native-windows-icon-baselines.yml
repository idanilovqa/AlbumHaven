            requireThat(process.platform === 'win32' && Number(process.versions.node.split('.')[0]) === 22, 'Genuine native Windows with Node 22 is required');
            requireThat(process.env.GITHUB_REPOSITORY === C.repository && process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF === `refs/heads/${C.transfer}`, 'Unexpected workflow origin');
            requirePinnedEol('checkout');
            const start = process.env.GITHUB_SHA;
            requireThat(git('rev-parse', 'HEAD') === start && git('show', '-s', '--format=%P', start) === C.helperParent, 'Unexpected helper commit ancestry');
            const delta = git('diff', '--name-status', C.helperParent, start);
            requireThat(delta === `A\t${C.workflow}` || delta === `M\t${C.workflow}`, 'Helper changed more than its workflow');
            requireThat(!git('status', '--porcelain'), 'Helper checkout is not clean');
            requireThat(remoteHead(C) === C.base, 'Target moved before native generation');
            run('git', ['fetch', '--no-tags', 'origin', C.base]);
            requirePinnedEol('fetch');
            run('git', ['checkout', '--detach', C.base]);
            requirePinnedEol('detached-source');
            materializePinnedInputs(C);
            verifyInputs(C);
            refreshPinnedIndex(C, evidence);
            fs.mkdirSync(path.join(evidence, 'old'), { recursive: true });
            for (const s of C.snapshots) fs.copyFileSync(s.file, path.join(evidence, 'old', path.basename(s.file)));
            fs.writeFileSync(path.join(evidence, 'candidate.json'), JSON.stringify({ candidate: C.base, tree: C.tree, sourceHashes: C.inputs, mode: C.mode, titles: C.titles }, null, 2));
            console.log(`PINNED_NATIVE_SOURCE ${C.base} (${Object.keys(C.inputs).length} source/test/golden hashes)`);
          }
          function selectedSpecs(report) {
            const found = [];
            const visit = suite => { for (const spec of suite.specs || []) found.push(spec); for (const child of suite.suites || []) visit(child); };
