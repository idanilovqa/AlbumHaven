name: Native Windows icon baseline publish

on:
  push:
    branches: [2026-09-30-mobile-windows-icons]
    paths: [.github/workflows/native-windows-icon-baselines.yml]

permissions:
  contents: read
concurrency:
  group: native-windows-icons-2026-09-30-mobile-windows-icons
  cancel-in-progress: false

jobs:
  native-icons:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-30-mobile-windows-icons' && github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact repaired source and preserve native originals
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = Join-Path $env:RUNNER_TEMP 'windows-icon-baseline-driver.cjs'
          $config = Join-Path $env:RUNNER_TEMP 'windows-icon-baseline-config.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-icon-evidence'
          @'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');

          function requireThat(ok, message) { if (!ok) throw new Error(message); }
          function sha256(bytes) { return crypto.createHash('sha256').update(bytes).digest('hex'); }
          function run(command, args, options = {}) {
            return cp.execFileSync(command, args, { cwd: process.cwd(), windowsHide: true, stdio: 'pipe', maxBuffer: 64 * 1024 * 1024, ...options });
          }
          function git(...args) { return String(run('git', args)).trim(); }
          function remoteHead(C) {
            const rows = git('ls-remote', '--exit-code', 'origin', `refs/heads/${C.target}`).split(/\r?\n/);
            requireThat(rows.length === 1, 'Target ref did not resolve uniquely');
            const [sha, ref] = rows[0].split(/\s+/);
            requireThat(ref === `refs/heads/${C.target}`, 'Unexpected target ref');
            return sha;
          }
          function validateConfiguration(C) {
            requireThat(C.repository === 'idanilovqa/AlbumHaven' && C.target === '2026-09-25-mobile-layout', 'Unexpected repository or target');
            for (const key of ['base', 'tree', 'helperParent']) requireThat(/^[a-f0-9]{40}$/.test(C[key]), `Source freeze required: ${key}`);
            requireThat(C.transfer !== C.target && /^[a-zA-Z0-9][a-zA-Z0-9._/-]+$/.test(C.transfer) && !C.transfer.includes('..'), 'Invalid helper branch');
            requireThat(C.mode === 'capture' || C.mode === 'publish', 'Invalid workflow mode');
            requireThat(C.snapshots.length === 3 && new Set(C.snapshots.map(s => s.file)).size === 3, 'Exactly three snapshot paths required');
            requireThat(C.titles.length === 3 && new Set(C.titles).size === 3, 'Exactly three titles required');
            if (C.mode === 'capture') requireThat(C.accepted === null, 'Capture must not carry publication approval');
            if (C.mode === 'publish') {
              requireThat(C.accepted?.candidate === C.base, 'Accepted native images do not match this candidate');
              requireThat(Object.keys(C.accepted.snapshots || {}).sort().join('\n') === C.snapshots.map(s => s.file).sort().join('\n'), 'Accepted native image set mismatch');
              for (const s of C.snapshots) {
                const a = C.accepted.snapshots[s.file];
                requireThat(/^[a-f0-9]{64}$/.test(a.sha256) && /^[a-f0-9]{64}$/.test(a.rgbaSha256), 'Missing exact reviewed native hashes');
                requireThat(a.oldSha256 === s.oldSha256, 'Accepted old image does not match pinned golden');
