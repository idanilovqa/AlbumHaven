            const core = path.dirname(require.resolve('playwright-core', { paths: [process.cwd()] }));
            const { PNG } = require(path.join(core, 'lib', 'utilsBundle.js'));
            requireThat(typeof PNG?.sync?.read === 'function', 'Pinned Playwright PNG decoder unavailable');
            requireThat(require(path.join(core, 'package.json')).version === '1.61.1', 'Unexpected Playwright comparator version');
            const compare = require(path.join(core, 'lib', 'coreBundle.js')).utils.getComparator('image/png');
            const result = { candidate: C.base, tree: C.tree, mode: C.mode, result: 'PIXEL_GUARDS_PASSED', requiresNativeImageReview: C.mode === 'capture', snapshots: {} };
            for (const dir of ['new', 'diff', 'canonical-diff']) fs.mkdirSync(path.join(evidence, dir), { recursive: true });
            // Preserve all generated native pixels and diagnostic diffs even if a guard fails.
            const decoded = C.snapshots.map(s => {
              const beforeBytes = fs.readFileSync(path.join(evidence, 'old', path.basename(s.file)));
              const afterBytes = fs.readFileSync(s.file);
              fs.writeFileSync(path.join(evidence, 'new', path.basename(s.file)), afterBytes);
              const before = PNG.sync.read(beforeBytes), after = PNG.sync.read(afterBytes);
