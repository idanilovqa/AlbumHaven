          '@ | Set-Content -LiteralPath $config -Encoding utf8NoBOM
          & node $driver prepare $config $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up the repository-pinned native Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '151.0.7922.138'
      - name: Install pinned repository Node dependencies
        run: npm ci
      - name: Verify native foundation versions
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'windows-icon-evidence/foundation-versions.json'
          & node scripts/ci/write-foundation-version-manifest.cjs --profile=component "--output=$output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate exact selected goldens, enforce pixel guards, and rerun unchanged tests
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $driver = Join-Path $env:RUNNER_TEMP 'windows-icon-baseline-driver.cjs'
          $config = Join-Path $env:RUNNER_TEMP 'windows-icon-baseline-config.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-icon-evidence'
          & node $driver execute $config $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native images, diffs, selected results, and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-icons-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-icon-evidence
            test-results/playwright-artifacts/components/native-icon-*
          if-no-files-found: error
          retention-days: 14
      - name: Retain only exact accepted native publication bytes
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-publishable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-icon-publishable
          if-no-files-found: error
          retention-days: 7

  publish-accepted:
    needs: native-icons
    if: ${{ needs.native-icons.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 67f3578215c39841f276d1f8b8bb86c9fc351242
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-publishable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-windows-accepted
      - name: Verify accepted bytes and publish only those PNGs
        shell: python
        run: |
