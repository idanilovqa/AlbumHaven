name: New Feature Backend Evidence (supplemental)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: new-feature-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Initial attempt always holds. Root explicitly reruns after fresh native
# completion. This bounded snapshot never grants review, merge or release.
jobs:
  admission:
    name: Supplemental Native Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Observe one bounded native admission snapshot
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          COMPANION_RUN: ${{ github.run_id }}
          COMPANION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir "$RUNNER_TEMP/new-feature-admission"
          set +e
          python scripts/ci/admit-new-feature-evidence.py \
            --event "${{ github.event_path }}" --attempt "${{ github.run_attempt }}" \
            --output "$RUNNER_TEMP/new-feature-admission/admission.json"
          admission_status=$?
          set -e
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "new-feature-admission"
          raw = (directory / "admission.json").read_bytes()
          record = json.loads(raw)
          assert record["trigger"]["repository"] == "idanilovqa/AlbumHaven"
          assert record["trigger"]["head_sha"] == os.environ["EXPECTED_HEAD"]
          context = {
              "schema_version": 1, "repository": "idanilovqa/AlbumHaven",
              "head_sha": os.environ["EXPECTED_HEAD"],
              "run_id": int(os.environ["COMPANION_RUN"]),
              "attempt": int(os.environ["COMPANION_ATTEMPT"]),
              "admission_sha256": hashlib.sha256(raw).hexdigest(),
          }
          with (directory / "admission-context.json").open("x", encoding="utf-8") as stream:
              json.dump(context, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          exit "$admission_status"

      - name: Retain exact admission and context even on hold
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: new-feature-admission-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/new-feature-admission/admission.json
            ${{ runner.temp }}/new-feature-admission/admission-context.json
          if-no-files-found: error
          retention-days: 14

  sample:
    name: Sample Backend Evidence (supplemental)
    needs: admission
    if: ${{ !cancelled() && needs.admission.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == '2026-10-03-album-tops' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          # Synthetic disposable-service value, not a user secret.
          POSTGRES_PASSWORD: album-haven-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download this exact admission attempt
        uses: actions/download-artifact@v4
        with:
          name: new-feature-admission-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new-feature-admission

      - name: Validate admission before dependency or bootstrap work
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          COMPANION_RUN: ${{ github.run_id }}
          COMPANION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "new-feature-admission"
          raw = (directory / "admission.json").read_bytes()
          record = json.loads(raw)
          context = json.loads((directory / "admission-context.json").read_bytes())
          assert context["schema_version"] == 1
          assert context["repository"] == "idanilovqa/AlbumHaven"
          assert context["head_sha"] == os.environ["EXPECTED_HEAD"]
          assert type(context["run_id"]) is int and context["run_id"] == int(os.environ["COMPANION_RUN"])
          assert type(context["attempt"]) is int and context["attempt"] == int(os.environ["COMPANION_ATTEMPT"])
          assert context["admission_sha256"] == hashlib.sha256(raw).hexdigest()
          assert record["decision"] == "admit"
          assert record["authority"] == "supplemental-only"
          assert record["coverage"] == "unproven" and record["reason_codes"] == []
          assert record["trigger"]["head_sha"] == record["current"]["head_sha"] == os.environ["EXPECTED_HEAD"]
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install existing Python requirements
        run: python -m pip install -r requirements.txt

      - name: Provision disposable synthetic PostgreSQL
        env:
          CI_POSTGRES_ADMIN_PASSWORD: album-haven-disposable-ci-only
        run: python scripts/ci/bootstrap-linux-tops-postgres.py --suffix "tops_${{ github.run_id }}_${{ github.run_attempt }}"

      - name: Record complete frozen Sample baseline selection
        run: |
          # BEGIN SAMPLE SELECTORS
          printf '%s\n' \
            'tests/py/sample_playlist_origin_integration_budget_test.py' \
            'tests/py/sample_playlist_origin_integration_locking_test.py' \
            'tests/py/test_sample_playlist.py' \
            'tests/py/test_sample_playlist_native_live.py' \
            'tests/py/test_sample_playlist_native_routes.py' \
            'tests/py/test_sample_playlist_origin_integrity.py' \
            'tests/py/test_sample_playlist_origin_migration.py' \
            'tests/py/test_sample_playlist_origin_projections.py' \
            'tests/py/test_sample_playlist_origin_routes.py' \
            'tests/py/test_sample_playlist_origins_live.py' \
            'tests/py/test_sample_playlist_receipt_boundaries.py' \
            'tests/py/test_sample_playlist_receipt_concurrency.py' \
            'tests/py/test_sample_playlist_receipt_integrity.py' \
            'tests/py/test_sample_playlist_receipt_random_scalar_integrity.py' \
            'tests/py/test_sample_playlist_receipts_live.py' \
            'tests/py/test_sample_playlist_remote_origin.py' \
            'tests/py/test_sample_playlist_save.py' \
            'tests/py/test_sample_playlist_save_concurrency.py' \
            'tests/py/test_sample_playlist_save_migration.py' \
            'tests/py/test_sample_playlist_source_extension_live.py' \
            'tests/py/test_sample_playlist_source_facts.py' \
            'tests/py/test_sample_playlist_sources_live.py' \
            'tests/py/test_sample_playlist_top_origins.py' \
            'tests/py/test_musicbrainz_artist_evidence.py' \
            'tests/py/test_sample_country_acquisition_live.py' \
            'tests/py/test_sample_country_concurrency_live.py' \
            'tests/py/test_sample_country_digest_vectors.py' \
            'tests/py/test_sample_country_disconnect.py' \
            'tests/py/test_sample_facet_bounds_live.py' \
            'tests/py/test_sample_facet_codec.py' \
            'tests/py/test_sample_facet_evaluator.py' \
            'tests/py/test_sample_facet_origin_admission_live.py' \
            'tests/py/test_sample_facet_projection_live.py' \
            'tests/py/test_sample_facet_receipts_live.py' \
            'tests/py/test_sample_facet_routes.py' > "$RUNNER_TEMP/sample-selection.txt"
          # END SAMPLE SELECTORS

      - name: Collect and execute complete Sample evidence
        run: |
          python scripts/ci/new_feature_evidence.py run --lane sample \
            --selection "$RUNNER_TEMP/sample-selection.txt" \
            --evidence-dir "$RUNNER_TEMP/new-feature-sample/evidence" \
            --admission "$RUNNER_TEMP/new-feature-admission/admission.json" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"

      - name: Retain Sample evidence without rewriting its outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: new-feature-sample-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/new-feature-sample
            ${{ runner.temp }}/sample-selection.txt
            ${{ runner.temp }}/new-feature-admission
          if-no-files-found: error
          retention-days: 14

  foobar:
    name: Foobar Backend Evidence (supplemental)
    needs: [admission, sample]
    if: ${{ !cancelled() && needs.admission.result == 'success' && needs.sample.result != 'cancelled' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == '2026-10-03-album-tops' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download this exact admission attempt
        uses: actions/download-artifact@v4
        with:
          name: new-feature-admission-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new-feature-admission

      - name: Validate admission before dependency or test work
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          COMPANION_RUN: ${{ github.run_id }}
          COMPANION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "new-feature-admission"
          raw = (directory / "admission.json").read_bytes()
          record = json.loads(raw)
          context = json.loads((directory / "admission-context.json").read_bytes())
          assert context["schema_version"] == 1
          assert context["repository"] == "idanilovqa/AlbumHaven"
          assert context["head_sha"] == os.environ["EXPECTED_HEAD"]
          assert type(context["run_id"]) is int and context["run_id"] == int(os.environ["COMPANION_RUN"])
          assert type(context["attempt"]) is int and context["attempt"] == int(os.environ["COMPANION_ATTEMPT"])
          assert context["admission_sha256"] == hashlib.sha256(raw).hexdigest()
          assert record["decision"] == "admit"
          assert record["authority"] == "supplemental-only"
          assert record["coverage"] == "unproven" and record["reason_codes"] == []
          assert record["trigger"]["head_sha"] == record["current"]["head_sha"] == os.environ["EXPECTED_HEAD"]
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install existing Python requirements
        run: python -m pip install -r requirements.txt

      - name: Record complete fixed CI-helper selection
        run: |
          # BEGIN CI_HELPER SELECTORS
          printf '%s\n' \
            'tests/py/test_new_feature_ci_contract.py' \
            'tests/py/test_new_feature_evidence.py' > "$RUNNER_TEMP/ci-helper-selection.txt"
          # END CI_HELPER SELECTORS

      - name: Validate CI helpers in their isolated complete phase
        id: ci_helper
        run: |
          python scripts/ci/new_feature_evidence.py run --lane ci-helper \
            --selection "$RUNNER_TEMP/ci-helper-selection.txt" \
            --evidence-dir "${{ runner.temp }}/new-feature-foobar/ci-helper" \
            --admission "$RUNNER_TEMP/new-feature-admission/admission.json" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"

      - name: Record complete frozen Foobar selection
        run: |
          # BEGIN FOOBAR SELECTORS
          printf '%s\n' \
            'tests/py/test_foobar_snapshot_parser.py' \
            'tests/py/test_foobar_snapshot_parser_resources.py' > "$RUNNER_TEMP/foobar-selection.txt"
          # END FOOBAR SELECTORS

      - name: Collect and execute complete isolated Foobar evidence
        id: foobar_phase
        if: ${{ success() && steps.ci_helper.outcome == 'success' }}
        run: |
          python scripts/ci/new_feature_evidence.py run --lane foobar \
            --selection "$RUNNER_TEMP/foobar-selection.txt" \
            --evidence-dir "${{ runner.temp }}/new-feature-foobar/evidence" \
            --admission "$RUNNER_TEMP/new-feature-admission/admission.json" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"

      - name: Retain truthful phase outcomes and conditional Sample acceptance
        if: ${{ always() }}
        env:
          HELPER_OUTCOME: ${{ steps.ci_helper.outcome }}
          FOOBAR_OUTCOME: ${{ steps.foobar_phase.outcome }}
          SAMPLE_OUTCOME: ${{ needs.sample.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          COMPANION_RUN: ${{ github.run_id }}
          COMPANION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "new-feature-foobar"
          directory.mkdir(exist_ok=True)
          helper = os.environ["HELPER_OUTCOME"]
          parser = os.environ["FOOBAR_OUTCOME"]
          summary = {
              "schema_version": 1, "authority": "supplemental-only",
              "head_sha": os.environ["EXPECTED_HEAD"],
              "run_id": int(os.environ["COMPANION_RUN"]),
              "attempt": int(os.environ["COMPANION_ATTEMPT"]),
              "ci_helper_step_outcome": helper,
              "foobar_step_outcome": parser,
              "foobar_phase": "unrun/unproven" if helper != "success" or parser == "skipped" else parser,
              "sample_local_job_outcome": os.environ["SAMPLE_OUTCOME"],
              "sample_final_acceptance": (
                  "diagnostic/unvalidated until root matches successful ci-helper evidence "
                  "for the exact head/run/attempt and actual helper-source hashes; "
                  "an actual Sample failure remains failure"
              ),
              "evidence_rule": (
                  "Step outcomes and this summary are not node-execution proof. "
                  "Require each lane's own complete identity, collection, phase reports, "
                  "process records, JUnit, logs and reconciliation; never synthesize unrun Foobar nodes."
              ),
          }
          with (directory / "phase-outcomes.json").open("x", encoding="utf-8") as stream:
              json.dump(summary, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Retain Foobar evidence without masking failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: new-feature-foobar-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/new-feature-foobar
            ${{ runner.temp }}/ci-helper-selection.txt
            ${{ runner.temp }}/foobar-selection.txt
            ${{ runner.temp }}/new-feature-admission
          if-no-files-found: error
          retention-days: 14
