name: PR Gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read

env:
  ALBUM_HAVEN_EXPECTED_FFMPEG_VERSION: 7.1-essentials_build-www.gyan.dev

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_js:
    name: JavaScript Tests (Portable)
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.pipeline_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up pinned Chrome for version evidence
        id: setup_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Write portable foundation version manifest
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_chrome.outputs.chrome-path }}
        run: node scripts/ci/write-foundation-version-manifest.cjs --profile=component --output=${{ runner.temp }}/foundation-version-manifest-portable.json

      - name: Run JavaScript tests
        env:
          PLAYWRIGHT_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: npm run test:js:all

      - name: Upload portable foundation version manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-portable-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-version-manifest-portable.json
          if-no-files-found: error
          retention-days: 14

  test_components:
    name: Component Tests (Pinned Chrome)
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.pipeline_mode == 'full' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pinned Chrome for Testing
        id: setup_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate component inventory
        run: node scripts/ci/validate-foundation-gates.cjs --list

      - name: Write component foundation version manifest
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_chrome.outputs.chrome-path }}
        run: node scripts/ci/write-foundation-version-manifest.cjs --profile=component --output=${{ runner.temp }}/foundation-version-manifest-component.json

      - name: Run component tests
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_chrome.outputs.chrome-path }}
        run: npm run test:component

      - name: Upload component foundation version manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-component-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-version-manifest-component.json
          if-no-files-found: error
          retention-days: 14

  test_node_windows:
    name: JavaScript Tests (Windows Contract)
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.pipeline_mode == 'full' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pinned Windows Node Chrome for Testing
        id: setup_windows_node_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Provision isolated PostgreSQL for Windows Node tests
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "jsw_${{ github.run_id }}_${{ github.run_attempt }}" `
            -StatePath "${{ runner.temp }}\album-haven-node-windows-postgres.state.json" `
            -AppPrivilegeMode Inherited `
            -SkipFixtureLoad

      - name: Write Windows Node foundation version manifest
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_windows_node_chrome.outputs.chrome-path }}
        run: |
          $env:PGPASSWORD = $null
          node scripts/ci/write-foundation-version-manifest.cjs --profile=windows --output=${{ runner.temp }}\foundation-version-manifest-node-windows.json

      - name: Run Windows JavaScript tests
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_windows_node_chrome.outputs.chrome-path }}
        run: |
          $env:PGPASSWORD = $null
          $env:PLAYWRIGHT_PYTHON = Join-Path $env:pythonLocation "python.exe"
          npm run test:js:all

      - name: Teardown isolated PostgreSQL for Windows Node tests
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-node-windows-postgres.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "jsw_${{ github.run_id }}_${{ github.run_attempt }}" `
              -StatePath $statePath
          }

      - name: Upload Windows Node foundation version manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-node-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}\foundation-version-manifest-node-windows.json
          if-no-files-found: error
          retention-days: 14

  test_python:
    name: Python Tests
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.pipeline_mode == 'full' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pinned Python Chrome for Testing
        id: setup_python_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Provision isolated PostgreSQL for Python tests
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "py_${{ github.run_id }}_${{ github.run_attempt }}" `
            -StatePath "${{ runner.temp }}\album-haven-python-postgres.state.json" `
            -AppPrivilegeMode Inherited `
            -SkipFixtureLoad

      - name: Write Python foundation version manifest
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_python_chrome.outputs.chrome-path }}
        run: |
          $env:PGPASSWORD = $null
          node scripts/ci/write-foundation-version-manifest.cjs --profile=windows --output=${{ runner.temp }}\foundation-version-manifest-python-windows.json

      - name: Export isolated Python database contracts
        run: |
          "ALBUM_HAVEN_SCAN_PERFORMANCE_SETUP_DATABASE_URL=$env:DATABASE_MIGRATOR_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_SCAN_PERFORMANCE_DATABASE_URL=$env:DATABASE_APP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_POSTGRES_CONTRACT_DATABASE_URL=$env:DATABASE_APP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect Python test inventory
        run: |
          python -m pytest --collect-only -q 2>&1 | Tee-Object -FilePath "${{ runner.temp }}\pytest-collection.txt"
          $collectionExitCode = $LASTEXITCODE
          if ($collectionExitCode -ne 0) {
            throw "pytest collection failed with exit code $collectionExitCode."
          }

      - name: Validate Python test inventory
        run: node scripts/ci/validate-foundation-gates.cjs --pytest-collection=${{ runner.temp }}\pytest-collection.txt

      - name: Run Python tests
        run: |
          $env:PGPASSWORD = $null
          python -m pytest -q --junitxml="${{ runner.temp }}\pytest-results.xml" -vv --durations=20 -o faulthandler_timeout=60

      - name: Validate Python skip policy
        if: ${{ !cancelled() }}
        run: node scripts/ci/validate-foundation-gates.cjs --pytest-junit=${{ runner.temp }}\pytest-results.xml --allowed-skips=tests/ci/pytest-allowed-skips.json

      - name: Teardown isolated PostgreSQL for Python tests
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-python-postgres.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "py_${{ github.run_id }}_${{ github.run_attempt }}" `
              -StatePath $statePath
          }

      - name: Upload Python foundation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-python-windows-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\foundation-version-manifest-python-windows.json
            ${{ runner.temp }}\pytest-collection.txt
            ${{ runner.temp }}\pytest-results.xml
          if-no-files-found: error
          retention-days: 14

  e2e_production_parity:
    name: "E2E: Production Parity"
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.pipeline_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Reject E2E production-path drift
        run: npm run check:e2e-production-parity

  e2e_phase7_auth:
    name: "E2E: Phase 7 Auth Lifecycle"
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.run_phase7_auth == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pinned Chrome
        id: setup_phase7_auth_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Provision isolated PostgreSQL
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "p7a_${{ github.run_id }}_${{ github.run_attempt }}" `
            -StatePath "${{ runner.temp }}\album-haven-phase7-auth.state.json" `
            -AppPrivilegeMode Inherited `
            -SkipFixtureLoad

      - name: Run Phase 7 auth lifecycle suite
        env:
          PLAYWRIGHT_BROWSER: chrome
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_phase7_auth_chrome.outputs.chrome-path }}
          FOCUSED_STAGE: ${{ needs.review_scope.outputs.focused_stage }}
          FOCUSED_EXACT_CASES_JSON: ${{ needs.review_scope.outputs.focused_exact_cases_json }}
        run: |
          $env:PGPASSWORD = $null
          $env:PLAYWRIGHT_PYTHON = Join-Path $env:pythonLocation "python.exe"
          if ($env:FOCUSED_STAGE -eq "exact") {
            $caseIds = @($env:FOCUSED_EXACT_CASES_JSON | ConvertFrom-Json)
            if ($caseIds.Count -gt 0) {
              $casePattern = ($caseIds | ForEach-Object { [regex]::Escape([string]$_) }) -join "|"
              npm run test:e2e:phase7:auth -- --grep $casePattern
              exit $LASTEXITCODE
            }
          }
          npm run test:e2e:phase7:auth

      - name: Teardown isolated PostgreSQL
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-phase7-auth.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "p7a_${{ github.run_id }}_${{ github.run_attempt }}" `
              -StatePath $statePath
          }

      - name: Upload Phase 7 auth diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase7-auth-debug-${{ github.run_attempt }}
          path: test-results/playwright-artifacts/phase7-auth
          if-no-files-found: warn
          retention-days: 7

  e2e_phase7_admin:
    name: "E2E: Phase 7 Admin Management"
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.run_phase7_admin == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pinned Chrome
        id: setup_phase7_admin_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Provision isolated PostgreSQL
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "p7m_${{ github.run_id }}_${{ github.run_attempt }}" `
            -StatePath "${{ runner.temp }}\album-haven-phase7-admin.state.json" `
            -AppPrivilegeMode Inherited `
            -SkipFixtureLoad

      - name: Run Phase 7 admin-management suite
        env:
          PLAYWRIGHT_BROWSER: chrome
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_phase7_admin_chrome.outputs.chrome-path }}
          FOCUSED_STAGE: ${{ needs.review_scope.outputs.focused_stage }}
          FOCUSED_EXACT_CASES_JSON: ${{ needs.review_scope.outputs.focused_exact_cases_json }}
        run: |
          $env:PGPASSWORD = $null
          $env:PLAYWRIGHT_PYTHON = Join-Path $env:pythonLocation "python.exe"
          if ($env:FOCUSED_STAGE -eq "exact") {
            $caseIds = @($env:FOCUSED_EXACT_CASES_JSON | ConvertFrom-Json)
            if ($caseIds.Count -gt 0) {
              $casePattern = ($caseIds | ForEach-Object { [regex]::Escape([string]$_) }) -join "|"
              npm run test:e2e:phase7:admin -- --grep $casePattern
              exit $LASTEXITCODE
            }
          }
          npm run test:e2e:phase7:admin

      - name: Teardown isolated PostgreSQL
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-phase7-admin.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "p7m_${{ github.run_id }}_${{ github.run_attempt }}" `
              -StatePath $statePath
          }

      - name: Upload Phase 7 admin diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase7-admin-debug-${{ github.run_attempt }}
          path: test-results/playwright-artifacts/phase7-admin
          if-no-files-found: warn
          retention-days: 7

  e2e_functional:
    name: "E2E: ${{ matrix.shard }}"
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.run_functional == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.review_scope.outputs.functional_shards_json) }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted fixture downloader
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ci
          persist-credentials: false

      - name: Fetch functional fixture
        env:
          ALBUM_HAVEN_FIXTURES_TOKEN: ${{ secrets.ALBUM_HAVEN_FIXTURES_TOKEN }}
        run: |
          & ".trusted-ci\scripts\ci\fetch-test-fixtures.ps1" `
            -Release fixtures-v1.0.22 `
            -Profile functional-core `
            -ManifestSha256 f9f357744464acec5b6bfa2f3b7dc69476d1c6df497ab3318399756cd5b9aa75

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve functional shard configuration
        id: shard
        run: node scripts/ci/resolve-ci-shard.cjs functional ${{ matrix.shard }}

      - name: Set up pinned functional Chrome for Testing
        id: setup_functional_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Prepare writable functional fixture
        run: |
          $sourceRoot = [IO.Path]::GetFullPath($env:ALBUM_HAVEN_FIXTURE_ROOT)
          $workRoot = [IO.Path]::GetFullPath((Join-Path "${{ runner.temp }}" "album-haven-e2e-functional-fixtures-${{ matrix.shard }}"))
          $sharedRoot = Join-Path $workRoot "shared"
          $runnerTemp = [IO.Path]::GetFullPath("${{ runner.temp }}")
          $relativeWork = [IO.Path]::GetRelativePath($runnerTemp, $workRoot)
          if ([string]::IsNullOrWhiteSpace($relativeWork) -or $relativeWork.StartsWith("..") -or [IO.Path]::IsPathRooted($relativeWork)) {
            throw "Functional fixture work root must be a non-root child of RUNNER_TEMP."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot "manifest.json") -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $sourceRoot "database") -PathType Container) -or
              -not (Test-Path -LiteralPath (Join-Path $sourceRoot "media") -PathType Container)) {
            throw "Downloaded functional fixture is incomplete."
          }
          if (Test-Path -LiteralPath $workRoot) {
            throw "Functional fixture work root must not already exist."
          }
          New-Item -ItemType Directory -Path $workRoot | Out-Null
          Copy-Item -LiteralPath $sourceRoot -Destination $sharedRoot -Recurse
          if (-not (Test-Path -LiteralPath (Join-Path $sharedRoot "manifest.json") -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $sharedRoot "database") -PathType Container) -or
              -not (Test-Path -LiteralPath (Join-Path $sharedRoot "media") -PathType Container)) {
            throw "Writable functional fixture copy is incomplete."
          }
          "ALBUM_HAVEN_FUNCTIONAL_FIXTURE_WORK_ROOT=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_FUNCTIONAL_SOURCE_FIXTURE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_FIXTURE_ROOT=$sharedRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_MEDIA_ROOT=$(Join-Path $sharedRoot 'media')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Provision functional PostgreSQL and load fixture
        run: |
          if (-not (Test-Path -LiteralPath ".\scripts\ci\load-fixture-profile.py" -PathType Leaf)) {
            throw "scripts/ci/load-fixture-profile.py is required."
          }
          $env:PLAYWRIGHT_PROVIDER_PORT = ([int]"${{ steps.shard.outputs.port_base }}" + 2).ToString()
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "f_${{ github.run_id }}_${{ github.run_attempt }}_${{ strategy.job-index }}" `
            -StatePath "${{ runner.temp }}\album-haven-functional-${{ matrix.shard }}.state.json"

      - name: Write functional foundation version manifest
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_functional_chrome.outputs.chrome-path }}
        run: |
          $env:PGPASSWORD = $null
          node scripts/ci/write-foundation-version-manifest.cjs --profile=windows --output=${{ runner.temp }}\foundation-version-manifest-functional-${{ matrix.shard }}.json

      - name: Validate functional shard ownership
        run: node scripts/ci/validate-functional-shards.cjs --list

      - name: Run functional shard
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_functional_chrome.outputs.chrome-path }}
          FOCUSED_CASES_JSON: ${{ needs.review_scope.outputs.focused_exact_cases_json }}
          FOCUSED_AREAS_JSON: ${{ needs.review_scope.outputs.focused_areas_json }}
        run: |
          $env:PGPASSWORD = $null
          $env:PLAYWRIGHT_PYTHON = Join-Path $env:pythonLocation "python.exe"
          $env:ALBUM_HAVEN_FUNCTIONAL_PORT_BASE = "${{ steps.shard.outputs.port_base }}"
          $env:ALBUM_HAVEN_FUNCTIONAL_OUTPUT_ROOT = Join-Path "${{ runner.temp }}" "${{ steps.shard.outputs.output_dir }}"
          $env:ALBUM_HAVEN_FUNCTIONAL_BLOB_ROOT = Join-Path "${{ runner.temp }}" "functional-blobs-${{ matrix.shard }}"
          $arguments = @("--run-shard=${{ matrix.shard }}")
          if ("${{ needs.review_scope.outputs.pipeline_mode }}" -eq "focused-e2e") {
            if ("${{ needs.review_scope.outputs.focused_stage }}" -eq "exact") {
              @($env:FOCUSED_CASES_JSON | ConvertFrom-Json) | ForEach-Object { $arguments += "--run-case=$_" }
            } else {
              @($env:FOCUSED_AREAS_JSON | ConvertFrom-Json) | ForEach-Object { $arguments += "--run-area=$_" }
            }
          }
          node scripts/ci/validate-functional-shards.cjs @arguments

      - name: Teardown functional PostgreSQL
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-functional-${{ matrix.shard }}.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "f_${{ github.run_id }}_${{ github.run_attempt }}_${{ strategy.job-index }}" `
              -StatePath "${{ runner.temp }}\album-haven-functional-${{ matrix.shard }}.state.json"
          }

      - name: Upload functional foundation version manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-functional-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\foundation-version-manifest-functional-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload functional blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shard.outputs.blob_name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\functional-blobs-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload functional debug
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-debug-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\${{ steps.shard.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 7

  e2e_performance_ci:
    name: "E2E Performance: ${{ matrix.shard }}"
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() && needs.review_prerequisites.result == 'success' && needs.review_scope.result == 'success' && needs.review_scope.outputs.skip_tests != 'true' && needs.review_scope.outputs.run_performance == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.review_scope.outputs.performance_shards_json) }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted fixture downloader
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ci
          persist-credentials: false

      - name: Fetch immutable performance fixture
        env:
          ALBUM_HAVEN_FIXTURES_TOKEN: ${{ secrets.ALBUM_HAVEN_FIXTURES_TOKEN }}
        run: |
          & ".trusted-ci\scripts\ci\fetch-test-fixtures.ps1" `
            -Release fixtures-v1.0.22 `
            -Profile ${{ matrix.shard == 'utility-problematic-files' && 'utility-problematic-files' || 'synthetic-large-library' }} `
            -ManifestSha256 f9f357744464acec5b6bfa2f3b7dc69476d1c6df497ab3318399756cd5b9aa75

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve performance shard configuration
        id: shard
        env:
          FOCUSED_PERFORMANCE_TARGETS_JSON: ${{ needs.review_scope.outputs.focused_performance_targets_json }}
          FOCUSED_STAGE: ${{ needs.review_scope.outputs.focused_stage }}
        run: node scripts/ci/resolve-ci-shard.cjs performance ${{ matrix.shard }}

      - name: Initialize performance shard result evidence
        if: ${{ always() }}
        run: |
          foreach ($target in "${{ steps.shard.outputs.targets }}".Split(',')) {
            $targetRoot = Join-Path "test-results\playwright-performance-targets" $target
            New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
            @{
              target = $target
              shard = "${{ matrix.shard }}"
              fixtureProfile = "${{ steps.shard.outputs.fixture_profile }}"
              fixtureMode = "${{ steps.shard.outputs.fixture_mode }}"
              blocking = $false
              runAttempt = "${{ github.run_attempt }}"
              conclusion = "initialized"
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $targetRoot "ci-job.json") -Encoding utf8
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pinned performance Chrome for Testing
        id: setup_performance_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Validate performance matrix ownership
        run: node scripts/ci/validate-performance-matrix.cjs --list

      - name: Prepare generated performance profile
        if: ${{ steps.shard.outputs.fixture_mode == 'generated-isolated' }}
        run: |
          $releasedRoot = [IO.Path]::GetFullPath($env:ALBUM_HAVEN_FIXTURE_ROOT)
          $approvedCoverRoot = Join-Path $releasedRoot "media\covers\approved"
          if (-not (Test-Path -LiteralPath $approvedCoverRoot -PathType Container)) {
            throw "Generated performance targets require the verified released approved-cover seed."
          }
          "ALBUM_HAVEN_APPROVED_COVER_ROOT=$approvedCoverRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_FIXTURE_ROOT= " | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_MEDIA_ROOT= " | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_FIXTURE_PROFILE=${{ steps.shard.outputs.fixture_profile }}" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run sequential isolated performance shard
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_performance_chrome.outputs.chrome-path }}
        run: |
          $env:PGPASSWORD = $null
          $env:PLAYWRIGHT_PYTHON = Join-Path $env:pythonLocation "python.exe"
          .\scripts\ci\run-performance-shard.ps1 `
            -Targets "${{ steps.shard.outputs.targets }}" `
            -FixtureProfile "${{ steps.shard.outputs.fixture_profile }}" `
            -FixtureMode "${{ steps.shard.outputs.fixture_mode }}" `
            -BasePort "${{ steps.shard.outputs.base_port }}" `
            -DatabaseSuffixBase "p_${{ github.run_id }}_${{ github.run_attempt }}_${{ strategy.job-index }}" `
            -ShardName "${{ matrix.shard }}" `
            -Browser chrome `
            -PerformanceContract ci

      - name: Upload performance foundation 1 foundation-versions-performance-${{ steps.shard.outputs.target1 }}
        if: ${{ always() && steps.shard.outputs.target1 != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-performance-${{ steps.shard.outputs.target1 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\album-haven-performance-foundations\foundation-version-manifest-performance-${{ steps.shard.outputs.target1 }}.json
          if-no-files-found: error
