      skip_reviews: ${{ steps.classify.outputs.skip_reviews }}
      skip_tests: ${{ steps.classify.outputs.skip_tests }}
      pipeline_mode: ${{ steps.classify.outputs.pipeline_mode }}
      focused_stage: ${{ steps.classify.outputs.focused_stage }}
      focused_exact_cases_json: ${{ steps.classify.outputs.focused_exact_cases_json }}
      focused_areas_json: ${{ steps.classify.outputs.focused_areas_json }}
      focused_performance_targets_json: ${{ steps.classify.outputs.focused_performance_targets_json }}
      focused_run_cases_json: ${{ steps.classify.outputs.focused_run_cases_json }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      functional_change: ${{ steps.classify.outputs.functional_change }}
      functional_lines: ${{ steps.classify.outputs.functional_lines }}
      binary_functional_change: ${{ steps.classify.outputs.binary_functional_change }}
      functional_shards_json: ${{ steps.classify.outputs.functional_shards_json }}
      performance_shards_json: ${{ steps.classify.outputs.performance_shards_json }}
      run_functional: ${{ steps.classify.outputs.run_functional }}
      run_performance: ${{ steps.classify.outputs.run_performance }}
      run_phase7_auth: ${{ steps.classify.outputs.run_phase7_auth }}
      run_phase7_admin: ${{ steps.classify.outputs.run_phase7_admin }}
      selected_families_json: ${{ steps.classify.outputs.selected_families_json }}
    steps:
      - name: Find last successfully reviewed head
        id: baseline
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            for (const comment of comments.reverse()) {
              if (comment.user?.login !== 'github-actions[bot]') continue;
              const match = comment.body?.match(/<!-- album-haven-reviewed-head:([0-9a-f]{40}) -->/i);
              if (!match) continue;
              const candidate = match[1].toLowerCase();
              const commentUpdatedAt = Date.parse(comment.updated_at);
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: candidate,
                event: 'pull_request',
                status: 'completed',
                per_page: 100,
              });
              const authenticated = runs.some((run) => {
                const startedAt = Date.parse(run.run_started_at || run.created_at);
                const completedAt = Date.parse(run.updated_at);
                return run.name === context.workflow
                  && run.conclusion === 'success'
                  && run.pull_requests?.some((pr) => pr.number === context.payload.pull_request.number)
                  && startedAt <= commentUpdatedAt
                  && commentUpdatedAt <= completedAt;
              });
              if (authenticated) return candidate;
            }
            return '';

      - name: Checkout pull request history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Classify PR review scope
        id: classify
        env:
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LAST_REVIEWED_SHA: ${{ steps.baseline.outputs.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/classify-pr-review-scope.cjs

      - name: Record owner-requested review waiver
        if: ${{ steps.classify.outputs.skip_reviews == 'true' }}
        uses: actions/github-script@v7
        env:
          SKIP_TESTS: ${{ steps.classify.outputs.skip_tests }}
          PIPELINE_MODE: ${{ steps.classify.outputs.pipeline_mode }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const waiver = {
              schemaVersion: 1,
              repository: process.env.GITHUB_REPOSITORY,
              pullRequestNumber: context.payload.pull_request.number,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              headSha: context.payload.pull_request.head.sha,
              label: 'skip_reviews', review_waived: true, mode: 'none',
              pipelineMode: process.env.PIPELINE_MODE,
              skipTests: process.env.SKIP_TESTS === 'true',
              ...(context.payload.pull_request.number === 1 ? {
                snapshotSha: '4167a9072d5ef013de2f2b193fb09ea77657e37a',
                reviewBaseSha: 'e0845f83552e1b0043cf435dcb82d5b959e31a05',
              } : {}),
            };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'waiver.json'), JSON.stringify(waiver));
            await core.summary.addHeading('AI reviews skipped by request')
              .addRaw('The skip_reviews label waives AI reviews. This run does not establish review coverage. All test gates remain mandatory for merge and release.').write();

      - name: Preserve review waiver evidence
        if: ${{ steps.classify.outputs.skip_reviews == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr1-review-waiver-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waiver.json
          if-no-files-found: error
          retention-days: 14

  pr_agent_review:
    name: PR Agent Review
    needs:
      - review_scope
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && needs.review_scope.result == 'success' && needs.review_scope.outputs.pipeline_mode == 'full' && needs.review_scope.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Require OpenAI credential for PR Agent review
        shell: bash
        env:
          PR_AGENT_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${PR_AGENT_OPENAI_API_KEY:-}" ]]; then
            echo "::error::PR Agent Review requires the OPENAI_API_KEY Actions secret. Publishing is blocked until the credential is configured."
            exit 1
          fi

      - name: Checkout review guard
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js for review guard
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare private PR Agent usage capture
        shell: bash
        run: |
          install -d -m 700 .tmp/private-review-usage
          install -m 600 /dev/null .tmp/private-review-usage/pr-agent.jsonl
          install -m 600 /dev/null .tmp/private-review-usage/pr-agent.jsonl.status.json

      - name: PR Agent action step
        id: pr_agent
        uses: the-pr-agent/pr-agent@7267ae1f7b855e7d4a3a34918d9b6c5683db3c12
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: /github/workspace/scripts/ci/review-usage-python:/app
          ALBUM_HAVEN_REVIEW_USAGE_FILE: /github/workspace/.tmp/private-review-usage/pr-agent.jsonl
          config.log_level: "INFO"
          config.output_run_details: "false"
          config.output_run_cost: "false"
          github_action_config.auto_review: "${{ github.event.action != 'synchronize' }}"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "labeled", "unlabeled"]'
          github_action_config.handle_push_trigger: "${{ github.event.action == 'synchronize' }}"
          github_action_config.push_trigger_ignore_bot_commits: "false"
          github_action_config.push_trigger_ignore_merge_commits: "false"
          github_action_config.push_commands: ${{ needs.review_scope.outputs.mode == 'incremental' && '["/review -i"]' || '["/review"]' }}
          github_action_config.enable_output: "true"

      - name: Encrypt private PR Agent usage
        if: ${{ always() && steps.pr_agent.outcome != '' && steps.pr_agent.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_ACTION_OUTCOME: ${{ steps.pr_agent.outcome }}
        run: node scripts/ci/seal-review-usage.cjs --reviewer pr-agent --input .tmp/private-review-usage/pr-agent.jsonl --public-key .github/review-usage-public-key.pem --output .tmp/private-review-usage/pr-agent.enc.json

      - name: Retain encrypted PR Agent usage
        if: ${{ always() && steps.pr_agent.outcome != '' && steps.pr_agent.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-review-usage-pr-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/private-review-usage/pr-agent.enc.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Require PR Agent review output
        env:
          PR_AGENT_REVIEW_OUTPUT: ${{ steps.pr_agent.outputs.review }}
        run: node scripts/require-pr-agent-review-output.cjs

  codex_review_plan:
    name: Codex Review Plan
    needs:
      - review_scope
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && needs.review_scope.result == 'success' && needs.review_scope.outputs.pipeline_mode == 'full' && needs.review_scope.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      manifest_digest: ${{ steps.plan.outputs.manifest_digest }}
    env:
      BASE_SHA: ${{ needs.review_scope.outputs.base_sha }}
      HEAD_SHA: ${{ needs.review_scope.outputs.head_sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REVIEW_MODE: ${{ needs.review_scope.outputs.mode }}
      REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEW_CODEX_VERSION: "0.153.4"
      REVIEW_ACTION_VERSION: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review coverage
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan complete Codex review
        id: plan
        run: node scripts/ci/plan-codex-review.cjs --output-dir .tmp/codex-review

      - name: Verify generated runtime parity before review
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { buildRuntimeBundle, outputPath } = require('./scripts/build-runtime-bundle.cjs');
          const normalize = value => value.replace(/\r\n/g, '\n');
          assert.equal(normalize(fs.readFileSync(outputPath, 'utf8')), normalize(buildRuntimeBundle()), 'Generated runtime bundle differs from its source modules');
          NODE

      - name: Retain expected private usage units
        uses: actions/upload-artifact@v4
        with:
          name: private-review-usage-units-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/codex-review/usage-units.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Retain exact review plan
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/codex-review/
          include-hidden-files: true
          if-no-files-found: error

  codex_review_batches:
    name: Codex Review ${{ matrix.id }}
    needs:
      - review_scope
      - codex_review_plan
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && needs.review_scope.result == 'success' && needs.review_scope.outputs.pipeline_mode == 'full' && needs.review_scope.outputs.mode != 'none' && needs.codex_review_plan.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.codex_review_plan.outputs.matrix_json || '{"include":[{"id":"unavailable","codex_args":"[]"}]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ needs.review_scope.outputs.base_sha }}
      HEAD_SHA: ${{ needs.review_scope.outputs.head_sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REVIEW_MODE: ${{ needs.review_scope.outputs.mode }}
      REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEW_CODEX_VERSION: "0.153.4"
      REVIEW_ACTION_VERSION: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review coverage
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download exact review plan
        uses: actions/download-artifact@v4
        with:
          name: codex-review-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/codex-review

      - name: Verify batch inputs against the event
        env:
          REVIEW_UNIT_ID: ${{ matrix.id }}
          REVIEW_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}
        run: node scripts/ci/validate-codex-review-batches.cjs preflight --plan-dir .tmp/codex-review --unit "$REVIEW_UNIT_ID" --manifest-digest "$REVIEW_MANIFEST_DIGEST"

      - name: Require OpenAI credential for Codex review
        shell: bash
        env:
          CODEX_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${CODEX_OPENAI_API_KEY:-}" ]]; then
            echo "::error::Codex PR Review requires the OPENAI_API_KEY Actions secret. Publishing is blocked until the credential is configured."
            exit 1
          fi

      - name: Checkout pinned Codex action
        uses: actions/checkout@v5
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
          path: .tmp/codex-action
          fetch-depth: 1
          persist-credentials: false

      - name: Protect private Codex console output
        run: node scripts/ci/prepare-private-codex-action.cjs --action-dir .tmp/codex-action

      - name: Run Codex
        id: run_codex
        uses: ./.tmp/codex-action
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-version: "0.153.4"
          prompt-file: .tmp/codex-review/${{ matrix.id }}.prompt.md
          output-schema-file: .tmp/codex-review/${{ matrix.id }}.schema.json
          codex-args: ${{ matrix.codex_args }}
          output-file: .tmp/codex-result.json
          codex-home: ${{ runner.temp }}/album-haven-codex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_UNIT_ID: ${{ matrix.id }}
          REVIEW_USAGE_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}

      - name: Encrypt private Codex diagnostics
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_UNIT_ID: ${{ matrix.id }}
          REVIEW_USAGE_ACTION_OUTCOME: ${{ steps.run_codex.outcome }}
          REVIEW_USAGE_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}
        run: |
          mkdir -p .tmp/private-review-diagnostics
          node scripts/ci/private-codex-diagnostic.cjs seal --runner-temp "$RUNNER_TEMP" --public-key .github/review-usage-public-key.pem --output .tmp/private-review-diagnostics/codex.enc.json

      - name: Retain encrypted Codex diagnostics
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-review-diagnostic-codex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .tmp/private-review-diagnostics/codex.enc.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Collect private Codex usage
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_CODEX_HOME: ${{ runner.temp }}/album-haven-codex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: node scripts/ci/collect-codex-review-usage.cjs --codex-home "$REVIEW_USAGE_CODEX_HOME" --output .tmp/private-review-usage/codex.json

      - name: Encrypt private Codex usage
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_ACTION_OUTCOME: ${{ steps.run_codex.outcome }}
          REVIEW_USAGE_UNIT_ID: ${{ matrix.id }}
          REVIEW_USAGE_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}
        run: node scripts/ci/seal-review-usage.cjs --reviewer codex --input .tmp/private-review-usage/codex.json --public-key .github/review-usage-public-key.pem --output .tmp/private-review-usage/codex.enc.json

      - name: Retain encrypted Codex usage
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-review-usage-codex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .tmp/private-review-usage/codex.enc.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Validate complete batch result
        env:
          REVIEW_UNIT_ID: ${{ matrix.id }}
        run: |
          node scripts/ci/validate-codex-review-batches.cjs batch --plan-dir .tmp/codex-review --unit "$REVIEW_UNIT_ID" --input .tmp/codex-result.json
          mkdir -p .tmp/codex-validated
          cp .tmp/codex-result.json ".tmp/codex-validated/$REVIEW_UNIT_ID.json"

      - name: Retain validated batch result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .tmp/codex-validated/${{ matrix.id }}.json
          include-hidden-files: true
          if-no-files-found: error

  codex_review:
    name: Codex PR Review
    needs:
      - review_scope
      - codex_review_plan
      - codex_review_batches
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && needs.review_scope.result == 'success' && needs.review_scope.outputs.pipeline_mode == 'full' && needs.review_scope.outputs.mode != 'none' && needs.codex_review_plan.result == 'success' && needs.codex_review_batches.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BASE_SHA: ${{ needs.review_scope.outputs.base_sha }}
      HEAD_SHA: ${{ needs.review_scope.outputs.head_sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REVIEW_MODE: ${{ needs.review_scope.outputs.mode }}
      REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEW_CODEX_VERSION: "0.153.4"
      REVIEW_ACTION_VERSION: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
    steps:
      - name: Require OpenAI credential for Codex review
        shell: bash
        env:
          CODEX_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${CODEX_OPENAI_API_KEY:-}" ]]; then
            echo "::error::Codex PR Review requires the OPENAI_API_KEY Actions secret. Publishing is blocked until the credential is configured."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review coverage
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download exact review plan
        uses: actions/download-artifact@v4
        with:
          name: codex-review-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/codex-review

      - name: Download every validated batch
        uses: actions/download-artifact@v4
        with:
          pattern: codex-review-result-${{ github.run_id }}-${{ github.run_attempt }}-batch-*
          path: .tmp/codex-results
          merge-multiple: true

      - name: Prepare complete integration review
        env:
          REVIEW_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}
        run: |
          node scripts/ci/validate-codex-review-batches.cjs preflight --plan-dir .tmp/codex-review --unit integration --manifest-digest "$REVIEW_MANIFEST_DIGEST"
          node scripts/ci/validate-codex-review-batches.cjs prepare --plan-dir .tmp/codex-review --results-dir .tmp/codex-results --output-dir .tmp/codex-integration

      - name: Checkout pinned Codex action
        uses: actions/checkout@v5
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
          path: .tmp/codex-action
          fetch-depth: 1
          persist-credentials: false

      - name: Protect private Codex console output
        run: node scripts/ci/prepare-private-codex-action.cjs --action-dir .tmp/codex-action

      - name: Run Codex
        id: run_codex
        uses: ./.tmp/codex-action
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-version: "0.153.4"
          prompt-file: .tmp/codex-integration/prompt.md
          output-schema-file: .tmp/codex-integration/schema.json
          output-file: .tmp/codex-integration/result.json
          codex-home: ${{ runner.temp }}/album-haven-codex-${{ github.run_id }}-${{ github.run_attempt }}-integration
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_UNIT_ID: integration
          REVIEW_USAGE_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}

      - name: Encrypt private Codex diagnostics
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_UNIT_ID: integration
          REVIEW_USAGE_ACTION_OUTCOME: ${{ steps.run_codex.outcome }}
          REVIEW_USAGE_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}
        run: |
          mkdir -p .tmp/private-review-diagnostics
          node scripts/ci/private-codex-diagnostic.cjs seal --runner-temp "$RUNNER_TEMP" --public-key .github/review-usage-public-key.pem --output .tmp/private-review-diagnostics/codex.enc.json

      - name: Retain encrypted Codex diagnostics
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-review-diagnostic-codex-${{ github.run_id }}-${{ github.run_attempt }}-integration
          path: .tmp/private-review-diagnostics/codex.enc.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Collect private Codex usage
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_CODEX_HOME: ${{ runner.temp }}/album-haven-codex-${{ github.run_id }}-${{ github.run_attempt }}-integration
        run: node scripts/ci/collect-codex-review-usage.cjs --codex-home "$REVIEW_USAGE_CODEX_HOME" --output .tmp/private-review-usage/codex.json

      - name: Encrypt private Codex usage
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        env:
          REVIEW_USAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_USAGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_USAGE_ACTION_OUTCOME: ${{ steps.run_codex.outcome }}
          REVIEW_USAGE_UNIT_ID: integration
          REVIEW_USAGE_MANIFEST_DIGEST: ${{ needs.codex_review_plan.outputs.manifest_digest }}
        run: node scripts/ci/seal-review-usage.cjs --reviewer codex --input .tmp/private-review-usage/codex.json --public-key .github/review-usage-public-key.pem --output .tmp/private-review-usage/codex.enc.json

      - name: Retain encrypted Codex usage
        if: ${{ always() && steps.run_codex.outcome != '' && steps.run_codex.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-review-usage-codex-${{ github.run_id }}-${{ github.run_attempt }}-integration
          path: .tmp/private-review-usage/codex.enc.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Validate complete integration result
        run: |
          node scripts/ci/validate-codex-review-batches.cjs batch --plan-dir .tmp/codex-review --unit integration --input .tmp/codex-integration/result.json
          cp .tmp/codex-integration/result.json .tmp/codex-integration/integration.json

      - name: Retain validated integration result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-result-${{ github.run_id }}-${{ github.run_attempt }}-integration
          path: .tmp/codex-integration/integration.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Derive combined Codex review verdict
        id: combined_verdict
        run: node scripts/ci/validate-codex-review-batches.cjs final --plan-dir .tmp/codex-review --results-dir .tmp/codex-results --integration .tmp/codex-integration/result.json --output codex-output.md

      - name: Require Codex review output file
        if: ${{ !cancelled() && steps.combined_verdict.outcome != '' && steps.combined_verdict.outcome != 'skipped' }}
        shell: bash
        run: test -s codex-output.md

      - name: Upload Codex review output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-output
          path: codex-output.md
          if-no-files-found: error

      - name: Post Codex feedback
        if: ${{ !cancelled() && steps.combined_verdict.outcome != '' && steps.combined_verdict.outcome != 'skipped' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const report = fs.readFileSync('codex-output.md', 'utf8').trim();
            const reportUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = Buffer.byteLength(report, 'utf8') <= 60000 ? report : [
              '# Codex PR Review', '',
              'The complete combined report exceeds the comment size limit. Every finding is retained in the codex-review-output artifact.',
              `[Read the full review artifact](${reportUrl})`, '',
              report.split(/\r?\n/).at(-1),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Enforce Codex review verdict
        if: ${{ !cancelled() && steps.combined_verdict.outcome != '' && steps.combined_verdict.outcome != 'skipped' }}
        run: node scripts/ci/validate-codex-review-verdict.cjs codex-output.md

  review_prerequisites:
    name: Review Prerequisites
    needs:
      - review_scope
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require every applicable reviewer to succeed
        shell: pwsh
        env:
          REVIEW_CONTEXT: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'trusted' || 'fork' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PIPELINE_MODE: ${{ needs.review_scope.outputs.pipeline_mode }}
          REVIEW_MODE: ${{ needs.review_scope.outputs.mode }}
          REVIEW_SCOPE_RESULT: ${{ needs.review_scope.result }}
          PR_AGENT_RESULT: ${{ needs.pr_agent_review.result }}
          CODEX_RESULT: ${{ needs.codex_review.result }}
        run: |
          $reviewPrerequisitesInput = @{
            mode = $env:REVIEW_CONTEXT
            isDraft = $env:IS_DRAFT | ConvertFrom-Json
            pipelineMode = $env:PIPELINE_MODE
            reviewMode = $env:REVIEW_MODE
            jobResults = @{
              review_scope = $env:REVIEW_SCOPE_RESULT
              pr_agent_review = $env:PR_AGENT_RESULT
              codex_review = $env:CODEX_RESULT
            }
          }
          $inputPath = Join-Path "${{ runner.temp }}" "review-prerequisites-input.json"
          $reviewPrerequisitesInput | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $inputPath -Encoding utf8
          node scripts/ci/validate-cloud-verification-gate.cjs $inputPath --review-prerequisites

  focused_e2e_gate:
    name: Focused E2E Verification
    needs:
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
      - test_js
      - test_components
      - test_node_windows
      - test_python
      - e2e_production_parity
      - e2e_phase7_auth
      - e2e_phase7_admin
      - e2e_functional
      - e2e_performance_ci
    if: ${{ !cancelled() && needs.review_scope.result == 'success' && needs.review_scope.outputs.pipeline_mode == 'focused-e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout focused pull request
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate focused E2E conclusion
        shell: pwsh
        env:
          SELECTED_FAMILIES_JSON: ${{ needs.review_scope.outputs.selected_families_json }}
          REVIEW_SCOPE_RESULT: ${{ needs.review_scope.result }}
          REVIEW_PREREQUISITES_RESULT: ${{ needs.review_prerequisites.result }}
          PR_AGENT_RESULT: ${{ needs.pr_agent_review.result }}
          CODEX_RESULT: ${{ needs.codex_review.result }}
          TEST_JS_RESULT: ${{ needs.test_js.result }}
          TEST_COMPONENTS_RESULT: ${{ needs.test_components.result }}
          WINDOWS_RESULT: ${{ needs.test_node_windows.result }}
          PYTHON_RESULT: ${{ needs.test_python.result }}
          PRODUCTION_PARITY_RESULT: ${{ needs.e2e_production_parity.result }}
          PHASE7_AUTH_RESULT: ${{ needs.e2e_phase7_auth.result }}
          PHASE7_ADMIN_RESULT: ${{ needs.e2e_phase7_admin.result }}
          FUNCTIONAL_RESULT: ${{ needs.e2e_functional.result }}
          PERFORMANCE_RESULT: ${{ needs.e2e_performance_ci.result }}
          FOCUSED_STAGE: ${{ needs.review_scope.outputs.focused_stage }}
        run: |
          $input = @{
            selectedFamilies = @($env:SELECTED_FAMILIES_JSON | ConvertFrom-Json)
            jobResults = @{
              review_scope = $env:REVIEW_SCOPE_RESULT
              review_prerequisites = $env:REVIEW_PREREQUISITES_RESULT
              pr_agent_review = $env:PR_AGENT_RESULT
              codex_review = $env:CODEX_RESULT
              test_js = $env:TEST_JS_RESULT
              test_components = $env:TEST_COMPONENTS_RESULT
              test_node_windows = $env:WINDOWS_RESULT
              test_python = $env:PYTHON_RESULT
              e2e_production_parity = $env:PRODUCTION_PARITY_RESULT
              e2e_phase7_auth = $env:PHASE7_AUTH_RESULT
              e2e_phase7_admin = $env:PHASE7_ADMIN_RESULT
              e2e_functional = $env:FUNCTIONAL_RESULT
              e2e_performance_ci = $env:PERFORMANCE_RESULT
            }
          }
          $inputPath = Join-Path "${{ runner.temp }}" "focused-e2e-gate-input.json"
          $input | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $inputPath -Encoding utf8
          node scripts/ci/validate-focused-e2e-gate.cjs $inputPath
          "## Focused E2E Verification`n$env:FOCUSED_STAGE hosted E2E selection passed. This run is non-authoritative. An authenticated release operator must verify this run belongs to the current PR head before advancing the next stage through a pull-request label event." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  cloud_verification_gate:
    name: Cloud Verification Gate
    needs:
      - test_js
      - test_components
      - test_node_windows
      - test_python
      - e2e_production_parity
      - e2e_phase7_auth
      - e2e_phase7_admin
      - e2e_functional
      - e2e_performance_ci
      - review_scope
      - review_prerequisites
      - pr_agent_review
      - codex_review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Non-authoritative fork conclusion
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        env:
          TEST_JS_RESULT: ${{ needs.test_js.result }}
          TEST_COMPONENTS_RESULT: ${{ needs.test_components.result }}
          PRODUCTION_PARITY_RESULT: ${{ needs.e2e_production_parity.result }}
          PHASE7_AUTH_RESULT: ${{ needs.e2e_phase7_auth.result }}
          PHASE7_ADMIN_RESULT: ${{ needs.e2e_phase7_admin.result }}
          WINDOWS_RESULT: ${{ needs.test_node_windows.result }}
          PYTHON_RESULT: ${{ needs.test_python.result }}
          FUNCTIONAL_RESULT: ${{ needs.e2e_functional.result }}
          PERFORMANCE_RESULT: ${{ needs.e2e_performance_ci.result }}
          REVIEW_SCOPE_RESULT: ${{ needs.review_scope.result }}
          REVIEW_PREREQUISITES_RESULT: ${{ needs.review_prerequisites.result }}
          REVIEW_MODE: ${{ needs.review_scope.outputs.mode }}
          PR_AGENT_RESULT: ${{ needs.pr_agent_review.result }}
          CODEX_RESULT: ${{ needs.codex_review.result }}
          PIPELINE_MODE: ${{ needs.review_scope.outputs.pipeline_mode }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          test "$TEST_JS_RESULT" = success
          test "$TEST_COMPONENTS_RESULT" = success
          test "$PRODUCTION_PARITY_RESULT" = success
          test "$REVIEW_SCOPE_RESULT" = success
          test "$REVIEW_PREREQUISITES_RESULT" = success
          case "$REVIEW_MODE" in none|incremental|full) ;; *) exit 1 ;; esac
          for result in "$WINDOWS_RESULT" "$PYTHON_RESULT" "$PHASE7_AUTH_RESULT" "$PHASE7_ADMIN_RESULT" "$FUNCTIONAL_RESULT" "$PERFORMANCE_RESULT" "$PR_AGENT_RESULT" "$CODEX_RESULT"; do
            test "$result" = skipped
          done
          {
            echo "## Cloud Verification Gate"
            echo "Non-authoritative fork conclusion: portable checks passed; trusted fixture, Windows, E2E, and review jobs did not run. This check is intentionally non-green. A maintainer must move or retrigger the pull request head in the trusted same-repository context."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Cloud Verification Gate is non-authoritative for forks. A maintainer must move or retrigger the pull request head in the trusted same-repository context."
          exit 1

      - name: Checkout trusted pull request
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Validate trusted cloud conclusion
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        env:
          TEST_JS_RESULT: ${{ needs.test_js.result }}
          TEST_COMPONENTS_RESULT: ${{ needs.test_components.result }}
          WINDOWS_RESULT: ${{ needs.test_node_windows.result }}
          PYTHON_RESULT: ${{ needs.test_python.result }}
          PRODUCTION_PARITY_RESULT: ${{ needs.e2e_production_parity.result }}
          PHASE7_AUTH_RESULT: ${{ needs.e2e_phase7_auth.result }}
          PHASE7_ADMIN_RESULT: ${{ needs.e2e_phase7_admin.result }}
          FUNCTIONAL_RESULT: ${{ needs.e2e_functional.result }}
          PERFORMANCE_RESULT: ${{ needs.e2e_performance_ci.result }}
          REVIEW_SCOPE_RESULT: ${{ needs.review_scope.result }}
          REVIEW_PREREQUISITES_RESULT: ${{ needs.review_prerequisites.result }}
          REVIEW_MODE: ${{ needs.review_scope.outputs.mode }}
          PR_AGENT_RESULT: ${{ needs.pr_agent_review.result }}
          CODEX_RESULT: ${{ needs.codex_review.result }}
          PIPELINE_MODE: ${{ needs.review_scope.outputs.pipeline_mode }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          $input = @{
            mode = "trusted"
            isDraft = $env:IS_DRAFT | ConvertFrom-Json
            pipelineMode = $env:PIPELINE_MODE
            reviewMode = $env:REVIEW_MODE
            jobResults = @{
              test_js = $env:TEST_JS_RESULT
              test_components = $env:TEST_COMPONENTS_RESULT
              test_node_windows = $env:WINDOWS_RESULT
              test_python = $env:PYTHON_RESULT
              e2e_production_parity = $env:PRODUCTION_PARITY_RESULT
              e2e_phase7_auth = $env:PHASE7_AUTH_RESULT
              e2e_phase7_admin = $env:PHASE7_ADMIN_RESULT
              e2e_functional = $env:FUNCTIONAL_RESULT
              e2e_performance_ci = $env:PERFORMANCE_RESULT
              review_scope = $env:REVIEW_SCOPE_RESULT
              review_prerequisites = $env:REVIEW_PREREQUISITES_RESULT
              pr_agent_review = $env:PR_AGENT_RESULT
              codex_review = $env:CODEX_RESULT
            }
          }
          $inputPath = Join-Path "${{ runner.temp }}" "cloud-verification-gate-input.json"
          $input | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $inputPath -Encoding utf8
          node scripts/ci/validate-cloud-verification-gate.cjs $inputPath
          "## Cloud Verification Gate`nAuthoritative same-repository conclusion: success." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Record successfully reviewed head
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.review_scope.outputs.skip_reviews != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const markerPattern = /<!-- album-haven-reviewed-head:([0-9a-f]{40}) -->/i;
            const body = `<!-- album-haven-reviewed-head:${context.payload.pull_request.head.sha} -->\nThe applicable automated reviews and full CI passed for this commit. See each review for its inspection scope and omissions; this baseline is not proof that every file was examined.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && markerPattern.test(comment.body || '')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
