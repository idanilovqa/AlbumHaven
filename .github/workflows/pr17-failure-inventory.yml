name: PR17 source parts
on:
  push:
    branches: [chatgpt/pr17-failure-inventory-20260929]
    paths: [.github/workflows/pr17-failure-inventory.yml]
permissions:
  contents: write
jobs:
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='idanilovqa', repo='AlbumHaven', branch='chatgpt/pr17-failure-inventory-20260929';
            const response=await github.rest.repos.getContent({owner,repo,ref:branch,path:'.ci/pr17-public-source.b64',mediaType:{format:'raw'}});
            const content=response.data;
            if(typeof content!=='string'||!/^[A-Za-z0-9+/=]+$/.test(content)) throw new Error('Expected original base64 snapshot bytes');
            const crypto=require('crypto');
            const parts=[];
            for(let start=0;start<content.length;start+=900000) {
              const part=content.slice(start,start+900000);
              const path='.ci/pr17-source-'+String(parts.length+1).padStart(2,'0')+'.b64';
              await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path,message:'ci: retain connector-sized pinned public source part',content:Buffer.from(part).toString('base64')});
              parts.push({path,bytes:part.length,sha256:crypto.createHash('sha256').update(part).digest('hex')});
            }
            const index=JSON.stringify({head:'5d98f6e6260e689905e92574e727193df64915ea',bytes:content.length,sha256:crypto.createHash('sha256').update(content).digest('hex'),parts},null,2);
            await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path:'.ci/pr17-source-index.json',message:'ci: record pinned source snapshot checksums',content:Buffer.from(index).toString('base64')});
            console.log(index);
