name: PR17 repair evidence
on:
  push:
    branches: [chatgpt/pr17-failure-inventory-20260929]
    paths: [.github/workflows/pr17-failure-inventory.yml]
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d98f6e6260e689905e92574e727193df64915ea
          persist-credentials: false
      - name: Package committed public text sources
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert head == '5d98f6e6260e689905e92574e727193df64915ea'
          files = []
          for row in subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\0'):
              if not row: continue
              meta, name = row.split(b'\t', 1)
              mode, kind, sha = meta.decode().split()
              name = name.decode()
              if kind != 'blob' or mode != '100644': continue
              if not (name.startswith(('music_app/','tests/','scripts/','docs/','.agents/')) or '/' not in name): continue
              raw = subprocess.check_output(['git','cat-file','blob',sha])
              try: raw.decode('utf-8')
              except UnicodeDecodeError: continue
              if b'\0' in raw: continue
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
              files.append({'path':name,'sha':sha,'base64':base64.b64encode(raw).decode()})
          payload = json.dumps({'head':head,'files':files}, separators=(',',':')).encode()
          encoded = base64.b64encode(gzip.compress(payload)).decode()
          pathlib.Path('/tmp/pr17-public-source.b64').write_text(encoded)
          print('PINNED_SOURCE', head, 'FILES', len(files), 'BYTES', len(encoded))
          PY
      - name: Publish source snapshot and compact failure contexts on helper branch only
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner='idanilovqa', repo='AlbumHaven', branch='chatgpt/pr17-failure-inventory-20260929';
            const expected='5d98f6e6260e689905e92574e727193df64915ea';
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:17})).data;
            if(pr.head.sha!==expected) throw new Error('PR head changed');
            const details = ['PR head '+expected+'\nMerge '+pr.merge_commit_sha];
            for(const job_id of [109465371565,109465370627,109465371659,109465371212,109465371691,109465371736,109465371569]) {
              const job=(await github.rest.actions.getJobForWorkflowRun({owner,repo,job_id})).data;
              details.push('\nJOB '+job_id+' '+job.name+' '+job.status+' '+job.conclusion);
              if(job.status!=='completed') continue;
              const res=await github.rest.actions.downloadJobLogsForWorkflowRun({owner,repo,job_id});
              const raw=typeof res.data==='string'?res.data:Buffer.from(res.data).toString('utf8');
              const lines=raw.replace(/\u001b\[[0-9;]*m/g,'').split(/\r?\n/).map(x=>x.replace(/^\d{4}-\d\d-\d\dT\S+\s/,''));
              const seen=new Set();
              for(let i=0;i<lines.length;i++) {
                if(!/^\s*\d+\)\s+\[/.test(lines[i])) continue;
                const title=lines[i].trim();
                if(seen.has(title)) continue;
                seen.add(title);
                let end=i+1;
                while(end<Math.min(i+100,lines.length) && !/attachment #|Error Context:/.test(lines[end])) end++;
                details.push(lines.slice(i,end).join('\n'));
              }
            }
            for(const [path,content] of [
              ['.ci/pr17-public-source.b64',fs.readFileSync('/tmp/pr17-public-source.b64','utf8')],
              ['.ci/pr17-failure-contexts.txt',details.join('\n')]
            ]) {
              let sha;
              try { sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha; }
              catch(e) { if(e.status!==404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path,sha,message:'ci: retain pinned PR17 repair evidence on helper branch',content:Buffer.from(content).toString('base64')});
              console.log('CAPTURED '+path+' '+Buffer.byteLength(content));
            }
