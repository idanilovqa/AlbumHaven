name: PR19 bounded diagnostics
on:
  push:
    branches: [2026-09-29-pr19-diagnostics]
    paths: [.github/workflows/pr19-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 234d4f5c579be29b3f19dcd72afb7719c13d4ed4
          persist-credentials: false
          fetch-depth: 1
      - name: Package exact tracked source
        shell: python
        run: |
          import hashlib, io, json, lzma, pathlib, subprocess, tarfile
          root = pathlib.Path('.')
          out = pathlib.Path('/tmp/pr19-diagnostics'); out.mkdir()
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          manifest = {'head': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'files': {}, 'parts': []}
          data = io.BytesIO()
          with tarfile.open(fileobj=data, mode='w') as archive:
              for name in names:
                  if not name: continue
                  p = root / name
                  if not p.is_file(): continue
                  value = p.read_bytes()
                  manifest['files'][name] = hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
                  archive.add(p, arcname=name, recursive=False)
          packed = lzma.compress(data.getvalue())
          manifest['sha256'] = hashlib.sha256(packed).hexdigest()
          for index, offset in enumerate(range(0, len(packed), 700000)):
              name = f'pr19-source-{index:02d}.bin'
              (out / name).write_bytes(packed[offset:offset+700000])
              manifest['parts'].append(name)
          (out / 'source-manifest.json').write_text(json.dumps(manifest))
      - name: Collect bounded failure messages and detached source snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = '/tmp/pr19-diagnostics';
            const run = 36523829343;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:run, per_page:100});
            const inventory = [];
            for (const job of jobs) {
              const entry = {id:job.id, name:job.name, status:job.status, conclusion:job.conclusion, failures:[]};
              if (job.conclusion === 'failure') {
                try {
                  const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {...context.repo, job_id:job.id});
                  const log = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
                  const lines = log.split('\n').map(line => line.replace(/^\d{4}-\d\d-\d\dT\S+\s*/, '').replace(/\x1b\[[0-9;]*m/g, ''));
                  const safe = line => line.replace(/[A-Za-z]:\\[^\s'"<>]*/g, '<runner-path>').replace(/\/home\/runner\/work\/AlbumHaven\/AlbumHaven\//g, '').slice(0,600);
                  for (let i=0;i<lines.length;i++) {
                    const line=lines[i];
                    if (/^not ok \d|^FAILED tests\/|^ERROR tests\/|^\s*\d+\) \[|^\s*\d+\) tests\/|Error:|ReferenceError:|TypeError:|##\[error\]/.test(line)) {
                      entry.failures.push(lines.slice(Math.max(0,i-1), Math.min(lines.length,i+18)).map(safe));
                    }
                  }
                  entry.tail = lines.slice(-65).map(safe);
                } catch (error) { entry.error = String(error.message); }
              }
              inventory.push(entry);
            }
            fs.writeFileSync(out+'/failures.json', JSON.stringify({head:'234d4f5c579be29b3f19dcd72afb7719c13d4ed4',run,jobs:inventory},null,2));
            const tree=[];
            for (const name of fs.readdirSync(out)) {
              const blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(out+'/'+name).toString('base64'),encoding:'base64'});
              tree.push({path:name,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const t=await github.rest.git.createTree({...context.repo,tree});
            const commit=await github.rest.git.createCommit({...context.repo,tree:t.data.sha,parents:[],message:'Pinned PR19 diagnostic source snapshot'});
            console.log('DIAGNOSTIC_SNAPSHOT '+commit.data.sha);
            console.log(JSON.stringify(inventory.map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,messages:j.failures.length,error:j.error}))));
            console.log('SOURCE_PARTS '+JSON.stringify(fs.readdirSync(out)));
