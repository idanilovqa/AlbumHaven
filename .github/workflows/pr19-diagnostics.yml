name: PR19 bounded diagnostics
on:
  push:
    branches: [2026-09-29-pr19-diagnostics]
    paths: [.github/workflows/pr19-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 62346e8b258d2feee4388b297622d1c7c0adff68
          persist-credentials: false
          fetch-depth: 0
      - name: Package exact tracked source and review diff
        shell: python
        run: |
          import hashlib, io, json, lzma, pathlib, subprocess, tarfile
          root = pathlib.Path('.')
          out = pathlib.Path('/tmp/pr19-diagnostics'); out.mkdir()
          head = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          if head != '62346e8b258d2feee4388b297622d1c7c0adff68':
              raise RuntimeError('Unexpected source head')
          base = 'a5c23fc8963f9ecc531468a61653bf2d798e8c6d'
          entries = subprocess.check_output(['git','ls-files','--stage','-z']).decode().split('\0')
          manifest = {'head': head, 'base': base, 'files': {}, 'parts': []}
          data = io.BytesIO()
          with tarfile.open(fileobj=data, mode='w') as archive:
              for entry in entries:
                  if not entry: continue
                  metadata, name = entry.split('\t', 1)
                  mode, blob, stage = metadata.split()
                  if stage != '0' or mode not in ('100644', '100755'):
                      raise RuntimeError('Unexpected source entry: ' + name)
                  p = root / name
                  value = p.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
                  if actual != blob: raise RuntimeError('Source differs from pinned tree: ' + name)
                  manifest['files'][name] = {'blob': blob, 'mode': mode}
                  archive.add(p, arcname=name, recursive=False)
          packed = lzma.compress(data.getvalue())
          manifest['sha256'] = hashlib.sha256(packed).hexdigest()
          for index, offset in enumerate(range(0, len(packed), 700000)):
              name = f'pr19-source-{index:02d}.bin'
              (out / name).write_bytes(packed[offset:offset+700000])
              manifest['parts'].append(name)
          (out / 'source-manifest.json').write_text(json.dumps(manifest))
          (out / 'review.diff').write_bytes(subprocess.check_output(['git','diff','--no-ext-diff',base+'...'+head,'--','.',':(exclude)music_app/static/js/runtime-bundle.js']))
          (out / 'review-files.txt').write_bytes(subprocess.check_output(['git','diff','--no-ext-diff','--name-status',base+'...'+head]))
      - name: Retain review evidence and explicitly distinguish unfinished CI jobs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = '/tmp/pr19-diagnostics';
            const inventory = [], runs = [];
            for (const run of [36607258113, 36607251447]) {
              const result = await github.rest.actions.getWorkflowRun({...context.repo, run_id: run});
              if (result.data.head_sha !== '62346e8b258d2feee4388b297622d1c7c0adff68') throw new Error('Unexpected run head');
              runs.push({id:run,status:result.data.status,conclusion:result.data.conclusion});
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:run, per_page:100});
              for (const job of jobs) {
                const entry = {run, id:job.id, name:job.name, status:job.status, conclusion:job.conclusion, failures:[]};
                if (job.status === 'completed' && job.conclusion === 'failure') {
                  const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {...context.repo, job_id:job.id});
                  const log = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
                  const lines = log.split('\n').map(line => line.replace(/^\d{4}-\d\d-\d\dT\S+\s*/, '').replace(/\x1b\[[0-9;]*m/g, ''));
                  const safe = line => line.replace(/[A-Za-z]:\\[^\s'"<>]*/g, '<runner-path>').replace(/\/home\/runner\/work\/AlbumHaven\/AlbumHaven\//g, '').replace(/(postgres(?:ql)?:\/\/)[^\s'"<>]+/g,'$1<redacted>');
                  for (let i=0; i<lines.length; i++) {
                    if (/^not ok \d|^FAILED tests\/|^ERROR tests\/|^\s*\d+\) \[|^\s*\d+\) tests\/|^\s*Error:|^\s*ReferenceError:|^\s*TypeError:|##\[error\]/.test(lines[i])) {
                      entry.failures.push(lines.slice(Math.max(0,i-1), Math.min(lines.length,i+35)).map(safe));
                    }
                  }
                  entry.log_file = 'job-'+job.id+'.txt';
                  fs.writeFileSync(out+'/'+entry.log_file, lines.map(safe).join('\n'));
                }
                inventory.push(entry);
              }
            }
            fs.writeFileSync(out+'/failures.json', JSON.stringify({head:'62346e8b258d2feee4388b297622d1c7c0adff68',complete:runs.every(r=>r.status==='completed'),runs,jobs:inventory},null,2));
            const tree=[];
            for (const name of fs.readdirSync(out)) {
              const blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(out+'/'+name).toString('base64'),encoding:'base64'});
              tree.push({path:name,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const t=await github.rest.git.createTree({...context.repo,tree});
            const commit=await github.rest.git.createCommit({...context.repo,tree:t.data.sha,parents:[],message:'Pinned PR19 review source and observed CI evidence for 62346e8b'});
            console.log('DIAGNOSTIC_SNAPSHOT '+commit.data.sha);
            console.log(JSON.stringify({runs,jobs:inventory.map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,messages:j.failures.length}))}));
            console.log('SOURCE_PARTS '+JSON.stringify(fs.readdirSync(out)));
