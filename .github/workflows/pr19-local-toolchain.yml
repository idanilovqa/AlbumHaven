name: PR19 local reproduction toolchain
on:
  push:
    branches: [2026-09-29-pr19-diagnostics]
    paths: [.github/workflows/pr19-local-toolchain.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 234d4f5c579be29b3f19dcd72afb7719c13d4ed4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare exact Node dependencies and missing Python wheels
        run: |
          npm ci
          mkdir -p /tmp/pr19-toolchain/wheels
          python -m pip download --only-binary=:all: -d /tmp/pr19-toolchain/wheels 'psycopg[binary]' aiosmtplib zstandard
          mv node_modules /tmp/pr19-toolchain/node_modules
      - name: Package installed PostgreSQL executables and runtime libraries
        shell: python
        run: |
          import pathlib, shutil, subprocess
          out = pathlib.Path('/tmp/pr19-toolchain')
          installations = sorted(pathlib.Path('/usr/lib/postgresql').glob('*/bin/postgres'))
          if not installations:
              raise RuntimeError('No PostgreSQL installation available for isolated reproduction')
          source = installations[-1].parent.parent
          version = source.name
          shutil.copytree(source, out / 'postgres', symlinks=False)
          shutil.copytree(pathlib.Path('/usr/share/postgresql') / version, out / 'postgres' / 'share', symlinks=False)
          libs = out / 'postgres' / 'dependencies'; libs.mkdir()
          seen = set()
          pending = [p for p in (out / 'postgres').rglob('*') if p.is_file() and p.suffix != '.a']
          while pending:
              path = pending.pop()
              result = subprocess.run(['ldd', str(path)], capture_output=True, text=True)
              for line in result.stdout.splitlines():
                  bits = line.split('=>')
                  if len(bits) != 2: continue
                  name = bits[0].strip(); target = bits[1].strip().split()[0]
                  if not target.startswith('/') or name in seen: continue
                  seen.add(name)
                  if name.startswith(('libc.so', 'libm.so', 'libpthread.so', 'libdl.so', 'librt.so', 'libresolv.so')): continue
                  target = pathlib.Path(target)
                  if target.is_file():
                      shutil.copy2(target, libs / name); pending.append(libs / name)
          for p in (out / 'postgres').rglob('*.a'): p.unlink()
          print('PostgreSQL', version, 'runtime dependencies:', len(seen))
      - name: Compress local reproduction dependencies
        shell: python
        run: |
          import hashlib, json, lzma, pathlib, tarfile
          root = pathlib.Path('/tmp/pr19-toolchain')
          target = pathlib.Path('/tmp/pr19-toolchain.tar.xz')
          with tarfile.open(target, 'w:xz', preset=6) as archive:
              archive.add(root, arcname='toolchain')
          value = target.read_bytes()
          pathlib.Path('/tmp/pr19-toolchain-manifest.json').write_text(json.dumps({'sha256': hashlib.sha256(value).hexdigest(), 'size':len(value), 'source':'234d4f5c579be29b3f19dcd72afb7719c13d4ed4'}))
          print('Dependency archive bytes', len(value))
      - name: Expose dependency bytes through a detached connector-readable snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tree=[];
            for (const name of ['pr19-toolchain.tar.xz', 'pr19-toolchain-manifest.json']) {
              const blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync('/tmp/'+name).toString('base64'),encoding:'base64'});
              tree.push({path:name,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const t=await github.rest.git.createTree({...context.repo,tree});
            const commit=await github.rest.git.createCommit({...context.repo,tree:t.data.sha,parents:[],message:'Pinned PR19 local reproduction dependencies; no application data'});
            console.log('TOOLCHAIN_SNAPSHOT '+commit.data.sha);
