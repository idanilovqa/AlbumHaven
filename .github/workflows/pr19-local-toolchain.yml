name: PR19 local reproduction toolchain
on:
  push:
    branches: [2026-09-29-pr19-diagnostics]
    paths: [.github/workflows/pr19-local-toolchain.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 234d4f5c579be29b3f19dcd72afb7719c13d4ed4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare exact Node and Python dependencies
        run: |
          npm ci
          mkdir -p /tmp/pr19-toolchain/wheels /tmp/pr19-export
          python -m pip download --only-binary=:all: -d /tmp/pr19-toolchain/wheels 'psycopg[binary]' aiosmtplib zstandard
          mv node_modules /tmp/pr19-toolchain/node_modules
      - name: Package minimal PostgreSQL runtime and bounded dependency archives
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, subprocess, tarfile
          out = pathlib.Path('/tmp/pr19-toolchain'); exports = pathlib.Path('/tmp/pr19-export')
          installations = sorted(pathlib.Path('/usr/lib/postgresql').glob('*/bin/postgres'))
          if not installations: raise RuntimeError('PostgreSQL prerequisite absent')
          source = installations[-1].parent.parent; version = source.name
          pg = out / 'postgres'; (pg/'bin').mkdir(parents=True); (pg/'lib').mkdir()
          for name in ['postgres','initdb','pg_ctl','psql','createdb','pg_config','pg_isready','pg_dump','pg_restore']:
              shutil.copy2(source/'bin'/name, pg/'bin'/name)
          for p in (source/'lib').glob('*.so'):
              if 'llvm' not in p.name: shutil.copy2(p, pg/'lib'/p.name)
          shutil.copytree(pathlib.Path('/usr/share/postgresql')/version, pg/'share', symlinks=False)
          libs = pg/'dependencies'; libs.mkdir(); seen = set()
          pending = [p for p in (pg/'bin').iterdir()] + [p for p in (pg/'lib').iterdir()]
          while pending:
              p=pending.pop(); result=subprocess.run(['ldd',str(p)],capture_output=True,text=True)
              for line in result.stdout.splitlines():
                  bits=line.split('=>')
                  if len(bits)!=2: continue
                  name=bits[0].strip(); target=bits[1].strip().split()[0]
                  if not target.startswith('/') or name in seen: continue
                  seen.add(name)
                  if name.startswith(('libc.so','libm.so','libpthread.so','libdl.so','librt.so','libresolv.so','libLLVM')): continue
                  target=pathlib.Path(target)
                  if target.is_file(): shutil.copy2(target,libs/name); pending.append(libs/name)
          manifest={'source':'234d4f5c579be29b3f19dcd72afb7719c13d4ed4','archives':{}}
          for folder in ['node_modules','wheels','postgres']:
              archive=out/(folder+'.tar.xz')
              with tarfile.open(archive,'w:xz',preset=6) as tar: tar.add(out/folder,arcname=folder)
              value=archive.read_bytes(); parts=[]
              for i,start in enumerate(range(0,len(value),2000000)):
                  name=f'{folder}-{i:02d}.bin'; (exports/name).write_bytes(value[start:start+2000000]); parts.append(name)
              manifest['archives'][folder]={'sha256':hashlib.sha256(value).hexdigest(),'size':len(value),'parts':parts}
          (exports/'toolchain-manifest.json').write_text(json.dumps(manifest))
          print(json.dumps(manifest))
      - name: Expose detached connector-readable snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), out='/tmp/pr19-export', tree=[];
            for (const name of fs.readdirSync(out)) {
              let blob;
              try { blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(out+'/'+name).toString('base64'),encoding:'base64'}); }
              catch(error) { throw new Error('Dependency export failed: '+name+' HTTP '+error.status); }
              tree.push({path:name,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const t=await github.rest.git.createTree({...context.repo,tree});
            const c=await github.rest.git.createCommit({...context.repo,tree:t.data.sha,parents:[],message:'Pinned local test dependencies; no application data'});
            console.log('TOOLCHAIN_SNAPSHOT '+c.data.sha);
            console.log('FILES '+JSON.stringify(fs.readdirSync(out)));
