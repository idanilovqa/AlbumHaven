name: PR 3 Local Diagnostic Dependencies
on:
  push:
    branches: [2026-09-18-pr3-ci-diagnostics]
    paths: [.github/workflows/pr3-local-deps.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch dependencies for the isolated local source workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip download --only-binary=:all: --no-deps --dest /tmp/pr3-wheels aiosmtplib 'psycopg[binary]' psycopg-binary watchdog zstandard ytmusicapi 'fastapi==0.115.6' 'starlette==0.41.3' websockets
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, zipfile
          output = io.BytesIO()
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(pathlib.Path('node_modules').rglob('*')):
                  if p.is_file() and not p.is_symlink():
                      z.write(p, str(p))
              for p in sorted(pathlib.Path('/tmp/pr3-wheels').glob('*.whl')):
                  z.write(p, 'wheels/' + p.name)
          payload = output.getvalue()
          encoded = base64.b64encode(payload).decode('ascii')
          destination = pathlib.Path('.chat-editor/local-dependencies')
          destination.mkdir(parents=True, exist_ok=True)
          chunks = []
          for index, offset in enumerate(range(0, len(encoded), 950000), 1):
              name = f'deps-{index:02}.txt'
              content = encoded[offset:offset + 950000]
              (destination / name).write_text(content, encoding='ascii')
              chunks.append({'path': str(destination / name), 'characters': len(content)})
          manifest = {'source_revision': 'c2687083a71c8cef743e2ddf446929720095748d', 'zip_bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest(), 'chunks': chunks}
          (destination / 'dependencies-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Retain temporary dependencies on diagnostics branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/2026-09-18-pr3-ci-diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chat-editor/local-dependencies
          git commit -m 'ci: retain diagnostic dependency workspace'
          git push origin HEAD:refs/heads/2026-09-18-pr3-ci-diagnostics
