name: PR 3 Isolated Unit Dependencies
on:
  push:
    branches: [2026-09-18-pr3-ci-diagnostics]
    paths: [.github/workflows/pr3-unit-dependencies.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Python import dependencies in a temporary directory
        run: python -m pip install --no-deps --target "$RUNNER_TEMP/pr3-python-imports" psycopg==3.3.5 aiosmtplib==5.1.3 watchdog==6.0.0 ytmusicapi==1.12.3 fastapi==0.115.6 starlette==0.41.3
      - name: Package temporary dependencies for isolated verification
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, zipfile
          source = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr3-python-imports'
          output = io.BytesIO()
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(source.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts:
                      z.write(p,p.relative_to(source))
          raw=output.getvalue(); text=base64.b64encode(raw).decode('ascii')
          target=pathlib.Path('.chat-editor/unit-dependencies'); target.mkdir(parents=True,exist_ok=True)
          parts=[]
          for i,start in enumerate(range(0,len(text),800000),1):
              name=f'unit-deps-{i:02}.txt'; (target/name).write_text(text[start:start+800000]); parts.append(str(target/name))
          manifest={'sha256':hashlib.sha256(raw).hexdigest(),'zip_bytes':len(raw),'parts':parts}
          (target/'unit-dependencies.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Retain dependency transfer on diagnostics branch only
        run: |
          test "$GITHUB_REF" = refs/heads/2026-09-18-pr3-ci-diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chat-editor/unit-dependencies
          git commit -m 'ci: retain temporary Python verification imports'
          git push origin HEAD:refs/heads/2026-09-18-pr3-ci-diagnostics
