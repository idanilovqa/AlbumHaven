# One diagnostic invocation of the pinned full native Python job. Never an authoritative PR gate.
name: Pytest Root Cleanup Full Context Diagnostic
on:
  push:
    branches: [2026-09-30-capabilities-bundle-transfer]
    paths: [.github/workflows/pytest-root-cleanup-full-context-diagnostic.yml]
permissions:
  contents: read
env:
  ALBUM_HAVEN_EXPECTED_FFMPEG_VERSION: 7.1-essentials_build-www.gyan.dev
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
jobs:
  diagnose:
    name: Python Full Context Diagnostic (non-authoritative)
    if: ${{ !cancelled() && github.repository == 'idanilovqa/AlbumHaven' && github.event_name == 'push' && github.ref == 'refs/heads/2026-09-30-capabilities-bundle-transfer' && !github.event.deleted && github.run_attempt == 1 }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact helper push
        id: diagnostic_helper_checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify helper ancestry and sole added workflow
        id: diagnostic_helper_guard
        env:
          EVENT_HEAD: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Read-Git { $output = & git @args; if ($LASTEXITCODE -ne 0) { throw "Git guard failed" }; return $output }
          $parent = "3b6ba960579249f42e0c4c2bcace8395d39e4592"
          $workflow = ".github/workflows/pytest-root-cleanup-full-context-diagnostic.yml"
          if ($env:GITHUB_REPOSITORY -cne "idanilovqa/AlbumHaven") { throw "Unexpected repository" }
          if ($env:GITHUB_EVENT_NAME -cne "push") { throw "Unexpected event" }
          if ($env:GITHUB_REF -cne "refs/heads/2026-09-30-capabilities-bundle-transfer") { throw "Unexpected helper ref" }
          if ($env:GITHUB_RUN_ATTEMPT -cne "1") { throw "Diagnostic reruns are not authorized" }
          if ($env:EVENT_BEFORE -cne $parent -or $env:EVENT_FORCED -cne "false") { throw "Unexpected helper push ancestry" }
          if ($env:EVENT_HEAD -notmatch '^[0-9a-f]{40}$' -or $env:EVENT_HEAD -cne $env:GITHUB_SHA) { throw "Unexpected event head" }
          if ((Read-Git rev-parse HEAD).Trim() -cne $env:EVENT_HEAD) { throw "Unexpected helper head" }
          if ((Read-Git show -s --format=%P HEAD).Trim() -cne $parent) { throw "Unexpected helper parent" }
          $changes = @(Read-Git diff --name-status --no-renames $parent HEAD)
          if ($changes.Count -ne 1 -or $changes[0] -cne "A`t$workflow") { throw "Expected exactly one added diagnostic workflow" }
          if ((Read-Git remote get-url origin).Trim() -cnotmatch '^https://github\.com/idanilovqa/AlbumHaven(?:\.git)?$') { throw "Unexpected origin" }
          if (Read-Git status --porcelain) { throw "Dirty helper checkout" }
          $evidence = Join-Path $env:RUNNER_TEMP "pytest-root-cleanup-full-context"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $proof = [ordered]@{
            helper_head = $env:EVENT_HEAD
            helper_parent = $parent
            workflow = $workflow
            workflow_blob = (Read-Git rev-parse "HEAD:$workflow").Trim()
            workflow_sha256 = (Get-FileHash -LiteralPath $workflow -Algorithm SHA256).Hash.ToLowerInvariant()
            sole_delta = "A"
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $proof | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence "helper-proof.json") -Encoding utf8

      - name: Checkout
        id: native_00
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: f527210c650b52fef8213acdc633fcbd7e272e6d
          persist-credentials: false

      - name: Set up Node.js
        id: native_01
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        id: native_02
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Apply independently reviewed two-file logging overlay
        id: diagnostic_overlay
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          
          C = {'repository': 'idanilovqa/AlbumHaven', 'branch': '2026-09-30-capabilities-bundle-transfer', 'target': '2026-09-25-mobile-layout', 'helper_parent': '3b6ba960579249f42e0c4c2bcace8395d39e4592', 'workflow': '.github/workflows/pytest-root-cleanup-full-context-diagnostic.yml', 'source': 'f527210c650b52fef8213acdc633fcbd7e272e6d', 'tree': 'd0991e408265b2570405352e4b769ede2981f836', 'case': 'tests/py/test_pytest_harness_config.py::test_two_concurrent_default_pytest_processes_use_isolated_roots_and_cleanup_both', 'overlay': {'tests/py/conftest.py': {'bytes': 25633, 'old_sha256': '6dce8731c811441f6b09320273be724b4958a86aa30411cb4c8ba026dc0e6505', 'sha256': '6cf6a6228bccac1ad823dff1efd67b8fd6d6642a01fd5b714d5cebbef80f24ce', 'content_b64': ''}, 'tests/py/test_pytest_harness_config.py': {'bytes': 31889, 'old_sha256': '5aa7f84fc3e45d5e7ac7d06d48440d61c8ec80c2e567697214201ab87a338745', 'sha256': 'c3e9ce504cf6f3c5a0c946e53161b7de4588f9d26622986419a3c63a5e8753c8', 'content_b64': ''}}, 'context_files': {'package-lock.json': '36cb1055093afab1be56a99a35ddb816a3093c2202aed4c566522f1891dfcfdb', 'pytest.ini': '08db7d4f5778db8705816274bbfe179278530470a6bc3eb8d184e18a2cec8c67', 'requirements.txt': '018d1e446b65f3730ef877e68b23ecbe62b22273fb2bc3cc6a637458a37dbee7', 'scripts/ci/bootstrap-windows-postgres.ps1': '0d7adabb50c68836800b84a41c1d1e2e3797d5e974cdb80890ae0bd5337a09df', 'scripts/ci/validate-foundation-gates.cjs': '59b87a34555bc6d5a0c596d5d786961e11ee9011a2075cd7e9fa19ebca594d50', 'scripts/ci/write-foundation-version-manifest.cjs': 'ade90d99cefe926ec081e2dec903abf26add7a2e79918d2689dd8535a96330b5', 'tests/ci/pytest-allowed-skips.json': 'c81f6329dcc5a6f1b15846340f9b31e7e3b68efe389007cdd4ce2b0fc64c2ab2', '.github/workflows/pr-gates.yml': 'be9fa3c36fc7f0116a0fa7570a40347e6055287242fd32d8b391911087be6cf0'}, 'overlay_review_sha256': '16f6287fa4f60b9df1b0515ad84a8db38c68a3c3b0914155b6b929af8a6542d2', 'original_workflow_sha256': 'be9fa3c36fc7f0116a0fa7570a40347e6055287242fd32d8b391911087be6cf0', 'original_pytest_step_sha256': '07cae88c55ddf9a5bdf6ebb33c65ff5448f315c88544ee6e22b184290500e153', 'native_step_ids': ['native_00', 'native_01', 'native_02', 'native_03', 'native_04', 'setup_python_chrome', 'native_06', 'native_07', 'native_08', 'native_09', 'native_10', 'native_11', 'native_12', 'native_13', 'native_14', 'native_15', 'native_16', 'native_17', 'native_18']}
          root = Path.cwd().resolve()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'pytest-root-cleanup-full-context'
          evidence.mkdir(exist_ok=True)
          
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          
          def verify_source(*, overlaid):
              require(os.environ['GITHUB_REPOSITORY'] == C['repository'], 'Unexpected repository')
              require(os.environ['GITHUB_EVENT_NAME'] == 'push', 'Unexpected event')
              require(os.environ['GITHUB_REF'] == 'refs/heads/' + C['branch'], 'Unexpected helper ref')
              require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Diagnostic reruns are not authorized')
              require(platform.system() == 'Windows' and sys.version_info[:2] == (3, 11), 'Unexpected Python platform')
              require(git('rev-parse', 'HEAD') == C['source'], 'Unexpected source commit')
              require(git('rev-parse', 'HEAD^{tree}') == C['tree'], 'Unexpected source tree')
              require(git('config', '--get', 'core.autocrlf') == 'false', 'LF checkout guard missing')
              require(git('config', '--get', 'core.eol') == 'lf', 'LF checkout guard missing')
              require(git('ls-remote', 'origin', 'refs/heads/' + C['target']) == C['source'] + '\trefs/heads/' + C['target'], 'Target source branch moved')
              require(not git('diff', '--cached', '--name-only'), 'Source index changed')
              require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked source files')
              if overlaid:
                  require(git('diff', '--name-only').splitlines() == sorted(C['overlay']), 'Unexpected overlaid source changes')
              else:
                  require(not git('status', '--porcelain'), 'Source checkout is not clean')
              for name, sha in C['context_files'].items():
                  path = root / name
                  require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid context path')
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == sha, 'Original context bytes changed: ' + name)
              for name, pin in C['overlay'].items():
                  path = root / name
                  require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid overlay path')
                  expected = pin['sha256'] if overlaid else pin['old_sha256']
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'Overlay source hash mismatch: ' + name)
          
          verify_source(overlaid=False)
          decoded = {}
          for name, pin in C['overlay'].items():
              data = base64.b64decode(pin['content_b64'], validate=True)
              require(len(data) == pin['bytes'] and hashlib.sha256(data).hexdigest() == pin['sha256'], 'Diagnostic overlay payload mismatch')
              decoded[name] = data
          # Validate both old and new files before the first write; no partial overlay on bad input.
          for name, data in decoded.items():
              (root / name).write_bytes(data)
          verify_source(overlaid=True)
          provenance = {key: value for key, value in C.items() if key != 'overlay'}
          provenance['overlay'] = {name: {key: value for key, value in pin.items() if key != 'content_b64'} for name, pin in C['overlay'].items()}
          provenance['helper_head'] = os.environ['GITHUB_SHA']
          provenance['python'] = platform.python_version()
          provenance['platform'] = platform.platform()
          provenance['authoritative_ci_gate'] = False
          provenance['checkout_line_endings'] = 'Process-scoped core.autocrlf=false and core.eol=lf; no source normalization performed'
          (evidence / 'source-context.json').write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          print('PINNED_FULL_CONTEXT_OVERLAY_OK 2')

      - name: Install Node dependencies
        id: native_03
        run: npm ci

      - name: Install Python dependencies
        id: native_04
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pinned Python Chrome for Testing
        id: setup_python_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151.0.7922.138"

      - name: Provision isolated PostgreSQL for Python tests
        id: native_06
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "py_${{ github.run_id }}_${{ github.run_attempt }}" `
            -StatePath "${{ runner.temp }}\album-haven-python-postgres.state.json" `
            -AppPrivilegeMode Inherited `
            -SkipFixtureLoad

      - name: Capture destructive Python database contracts
        id: native_07
        run: |
          "PYTEST_DESTRUCTIVE_SETUP_DATABASE_URL=$env:DATABASE_MIGRATOR_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTEST_DESTRUCTIVE_DATABASE_URL=$env:DATABASE_APP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTEST_DESTRUCTIVE_PGPASSFILE=$env:PGPASSFILE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Provision pristine PostgreSQL for persistent Python contracts
        id: native_08
        run: |
          .\scripts\ci\bootstrap-windows-postgres.ps1 `
            -Mode Provision `
            -ExpectedMajorVersion 17 `
            -Pgbin $env:PGBIN `
            -HostName 127.0.0.1 `
            -DatabaseSuffix "py_contract_${{ github.run_id }}_${{ github.run_attempt }}" `
            -StatePath "${{ runner.temp }}\album-haven-python-contract-postgres.state.json" `
            -AppPrivilegeMode Inherited `
            -SkipFixtureLoad

      - name: Write Python foundation version manifest
        id: native_09
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: ${{ steps.setup_python_chrome.outputs.chrome-path }}
        run: |
          $env:PGPASSWORD = $null
          node scripts/ci/write-foundation-version-manifest.cjs --profile=windows --output=${{ runner.temp }}\foundation-version-manifest-python-windows.json

      - name: Export isolated Python database contracts
        id: native_10
        run: |
          $combinedPgpass = "${{ runner.temp }}\album-haven-python-combined.pgpass"
          $pgpassLines = @(
            (Get-Content -LiteralPath $env:PYTEST_DESTRUCTIVE_PGPASSFILE)
            (Get-Content -LiteralPath $env:PGPASSFILE)
          )
          [IO.File]::WriteAllLines($combinedPgpass, $pgpassLines, [Text.UTF8Encoding]::new($false))
          "PGPASSFILE=$combinedPgpass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_FAKE_E2E_SETUP_DATABASE_URL=$env:PYTEST_DESTRUCTIVE_SETUP_DATABASE_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_FAKE_E2E_DATABASE_URL=$env:PYTEST_DESTRUCTIVE_DATABASE_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_SCAN_PERFORMANCE_SETUP_DATABASE_URL=$env:PYTEST_DESTRUCTIVE_SETUP_DATABASE_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_SCAN_PERFORMANCE_DATABASE_URL=$env:PYTEST_DESTRUCTIVE_DATABASE_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALBUM_HAVEN_POSTGRES_CONTRACT_DATABASE_URL=$env:DATABASE_APP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect Python test inventory
        id: native_11
        run: |
          python -m pytest --collect-only -q 2>&1 | Tee-Object -FilePath "${{ runner.temp }}\pytest-collection.txt"
          $collectionExitCode = $LASTEXITCODE
          if ($collectionExitCode -ne 0) {
            throw "pytest collection failed with exit code $collectionExitCode."
          }

      - name: Validate Python test inventory
        id: native_12
        run: node scripts/ci/validate-foundation-gates.cjs --pytest-collection=${{ runner.temp }}\pytest-collection.txt

      - name: Verify full native prerequisites and expected cleanup case
        id: diagnostic_preflight
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          
          C = {'repository': 'idanilovqa/AlbumHaven', 'branch': '2026-09-30-capabilities-bundle-transfer', 'target': '2026-09-25-mobile-layout', 'helper_parent': '3b6ba960579249f42e0c4c2bcace8395d39e4592', 'workflow': '.github/workflows/pytest-root-cleanup-full-context-diagnostic.yml', 'source': 'f527210c650b52fef8213acdc633fcbd7e272e6d', 'tree': 'd0991e408265b2570405352e4b769ede2981f836', 'case': 'tests/py/test_pytest_harness_config.py::test_two_concurrent_default_pytest_processes_use_isolated_roots_and_cleanup_both', 'overlay': {'tests/py/conftest.py': {'bytes': 25633, 'old_sha256': '6dce8731c811441f6b09320273be724b4958a86aa30411cb4c8ba026dc0e6505', 'sha256': '6cf6a6228bccac1ad823dff1efd67b8fd6d6642a01fd5b714d5cebbef80f24ce'}, 'tests/py/test_pytest_harness_config.py': {'bytes': 31889, 'old_sha256': '5aa7f84fc3e45d5e7ac7d06d48440d61c8ec80c2e567697214201ab87a338745', 'sha256': 'c3e9ce504cf6f3c5a0c946e53161b7de4588f9d26622986419a3c63a5e8753c8'}}, 'context_files': {'package-lock.json': '36cb1055093afab1be56a99a35ddb816a3093c2202aed4c566522f1891dfcfdb', 'pytest.ini': '08db7d4f5778db8705816274bbfe179278530470a6bc3eb8d184e18a2cec8c67', 'requirements.txt': '018d1e446b65f3730ef877e68b23ecbe62b22273fb2bc3cc6a637458a37dbee7', 'scripts/ci/bootstrap-windows-postgres.ps1': '0d7adabb50c68836800b84a41c1d1e2e3797d5e974cdb80890ae0bd5337a09df', 'scripts/ci/validate-foundation-gates.cjs': '59b87a34555bc6d5a0c596d5d786961e11ee9011a2075cd7e9fa19ebca594d50', 'scripts/ci/write-foundation-version-manifest.cjs': 'ade90d99cefe926ec081e2dec903abf26add7a2e79918d2689dd8535a96330b5', 'tests/ci/pytest-allowed-skips.json': 'c81f6329dcc5a6f1b15846340f9b31e7e3b68efe389007cdd4ce2b0fc64c2ab2', '.github/workflows/pr-gates.yml': 'be9fa3c36fc7f0116a0fa7570a40347e6055287242fd32d8b391911087be6cf0'}, 'overlay_review_sha256': '16f6287fa4f60b9df1b0515ad84a8db38c68a3c3b0914155b6b929af8a6542d2', 'original_workflow_sha256': 'be9fa3c36fc7f0116a0fa7570a40347e6055287242fd32d8b391911087be6cf0', 'original_pytest_step_sha256': '07cae88c55ddf9a5bdf6ebb33c65ff5448f315c88544ee6e22b184290500e153', 'native_step_ids': ['native_00', 'native_01', 'native_02', 'native_03', 'native_04', 'setup_python_chrome', 'native_06', 'native_07', 'native_08', 'native_09', 'native_10', 'native_11', 'native_12', 'native_13', 'native_14', 'native_15', 'native_16', 'native_17', 'native_18']}
          root = Path.cwd().resolve()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'pytest-root-cleanup-full-context'
          evidence.mkdir(exist_ok=True)
          
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          
          def verify_source(*, overlaid):
              require(os.environ['GITHUB_REPOSITORY'] == C['repository'], 'Unexpected repository')
              require(os.environ['GITHUB_EVENT_NAME'] == 'push', 'Unexpected event')
              require(os.environ['GITHUB_REF'] == 'refs/heads/' + C['branch'], 'Unexpected helper ref')
              require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Diagnostic reruns are not authorized')
              require(platform.system() == 'Windows' and sys.version_info[:2] == (3, 11), 'Unexpected Python platform')
              require(git('rev-parse', 'HEAD') == C['source'], 'Unexpected source commit')
              require(git('rev-parse', 'HEAD^{tree}') == C['tree'], 'Unexpected source tree')
              require(git('config', '--get', 'core.autocrlf') == 'false', 'LF checkout guard missing')
              require(git('config', '--get', 'core.eol') == 'lf', 'LF checkout guard missing')
              require(git('ls-remote', 'origin', 'refs/heads/' + C['target']) == C['source'] + '\trefs/heads/' + C['target'], 'Target source branch moved')
              require(not git('diff', '--cached', '--name-only'), 'Source index changed')
              require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked source files')
              if overlaid:
                  require(git('diff', '--name-only').splitlines() == sorted(C['overlay']), 'Unexpected overlaid source changes')
              else:
                  require(not git('status', '--porcelain'), 'Source checkout is not clean')
              for name, sha in C['context_files'].items():
                  path = root / name
                  require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid context path')
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == sha, 'Original context bytes changed: ' + name)
              for name, pin in C['overlay'].items():
                  path = root / name
                  require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid overlay path')
                  expected = pin['sha256'] if overlaid else pin['old_sha256']
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'Overlay source hash mismatch: ' + name)
          
          verify_source(overlaid=True)
          collection = Path(os.environ['RUNNER_TEMP']) / 'pytest-collection.txt'
          manifest = Path(os.environ['RUNNER_TEMP']) / 'foundation-version-manifest-python-windows.json'
          required_env = [
              'ALBUM_HAVEN_FAKE_E2E_SETUP_DATABASE_URL', 'ALBUM_HAVEN_FAKE_E2E_DATABASE_URL',
              'ALBUM_HAVEN_SCAN_PERFORMANCE_SETUP_DATABASE_URL', 'ALBUM_HAVEN_SCAN_PERFORMANCE_DATABASE_URL',
              'ALBUM_HAVEN_POSTGRES_CONTRACT_DATABASE_URL', 'PGBIN', 'PGPASSFILE',
          ]
          presence = {name: bool(os.environ.get(name, '').strip()) for name in required_env}
          state_names = ['album-haven-python-postgres.state.json', 'album-haven-python-contract-postgres.state.json']
          states = {name: (Path(os.environ['RUNNER_TEMP']) / name).is_file() for name in state_names}
          pgpass_exists = bool(presence['PGPASSFILE'] and Path(os.environ['PGPASSFILE']).is_file())
          inventory = collection.read_text(encoding='utf-8-sig') if collection.is_file() else ''
          case_count = sum(line.strip() == C['case'] for line in inventory.splitlines())
          prerequisites = {
              'required_environment_present': presence,
              'isolated_database_states_present': states,
              'combined_credentials_file_present': pgpass_exists,
              'foundation_manifest_present': manifest.is_file(),
              'collection_present': collection.is_file(),
              'expected_cleanup_case_collection_count': case_count,
              'source_and_overlay_verified': True,
              'global_cleanup_diagnostics_enabled': os.environ.get('ALBUM_HAVEN_PYTEST_CLEANUP_DIAGNOSTICS') == '1',
          }
          (evidence / 'preflight.json').write_text(json.dumps(prerequisites, indent=2) + '\n', encoding='utf-8')
          require(case_count == 1, 'Expected cleanup case missing or duplicated in full inventory')
          require(all(presence.values()) and all(states.values()) and pgpass_exists and manifest.is_file(), 'Full-context prerequisite missing; see preflight.json booleans')
          require(not prerequisites['global_cleanup_diagnostics_enabled'], 'Unexpected global cleanup diagnostics; child probes alone opt in')
          print('FULL_CONTEXT_PREREQUISITES_OK')

      - name: Run Python tests
        id: native_13
        run: |
          $env:PGPASSWORD = $null
          python -m pytest -q --junitxml="${{ runner.temp }}\pytest-results.xml" -vv --durations=20 -o faulthandler_timeout=60

      - name: Validate Python skip policy
        id: native_14
        if: ${{ !cancelled() }}
        run: node scripts/ci/validate-foundation-gates.cjs --pytest-junit=${{ runner.temp }}\pytest-results.xml --allowed-skips=tests/ci/pytest-allowed-skips.json

      - name: Teardown pristine PostgreSQL for persistent Python contracts
        id: native_15
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-python-contract-postgres.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "py_contract_${{ github.run_id }}_${{ github.run_attempt }}" `
              -StatePath $statePath
          }

      - name: Teardown isolated PostgreSQL for Python tests
        id: native_16
        if: ${{ always() }}
        run: |
          $statePath = "${{ runner.temp }}\album-haven-python-postgres.state.json"
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            .\scripts\ci\bootstrap-windows-postgres.ps1 `
              -Mode Teardown `
              -ExpectedMajorVersion 17 `
              -Pgbin $env:PGBIN `
              -HostName 127.0.0.1 `
              -DatabaseSuffix "py_${{ github.run_id }}_${{ github.run_attempt }}" `
              -StatePath $statePath
          }

      - name: Remove combined Python test credentials
        id: native_17
        if: ${{ always() }}
        run: |
          $combinedPgpass = "${{ runner.temp }}\album-haven-python-combined.pgpass"
          if (Test-Path -LiteralPath $combinedPgpass -PathType Leaf) {
            Remove-Item -LiteralPath $combinedPgpass -Force
          }

      - name: Upload Python foundation evidence
        id: native_18
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-versions-python-windows-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\foundation-version-manifest-python-windows.json
            ${{ runner.temp }}\pytest-collection.txt
            ${{ runner.temp }}\pytest-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Summarize immutable diagnostic context and distinct outcomes
        id: diagnostic_summary
        if: ${{ always() }}
        env:
          NATIVE_STEPS_JSON: ${{ toJSON(steps) }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          
          C = {'repository': 'idanilovqa/AlbumHaven', 'branch': '2026-09-30-capabilities-bundle-transfer', 'target': '2026-09-25-mobile-layout', 'helper_parent': '3b6ba960579249f42e0c4c2bcace8395d39e4592', 'workflow': '.github/workflows/pytest-root-cleanup-full-context-diagnostic.yml', 'source': 'f527210c650b52fef8213acdc633fcbd7e272e6d', 'tree': 'd0991e408265b2570405352e4b769ede2981f836', 'case': 'tests/py/test_pytest_harness_config.py::test_two_concurrent_default_pytest_processes_use_isolated_roots_and_cleanup_both', 'overlay': {'tests/py/conftest.py': {'bytes': 25633, 'old_sha256': '6dce8731c811441f6b09320273be724b4958a86aa30411cb4c8ba026dc0e6505', 'sha256': '6cf6a6228bccac1ad823dff1efd67b8fd6d6642a01fd5b714d5cebbef80f24ce'}, 'tests/py/test_pytest_harness_config.py': {'bytes': 31889, 'old_sha256': '5aa7f84fc3e45d5e7ac7d06d48440d61c8ec80c2e567697214201ab87a338745', 'sha256': 'c3e9ce504cf6f3c5a0c946e53161b7de4588f9d26622986419a3c63a5e8753c8'}}, 'context_files': {'package-lock.json': '36cb1055093afab1be56a99a35ddb816a3093c2202aed4c566522f1891dfcfdb', 'pytest.ini': '08db7d4f5778db8705816274bbfe179278530470a6bc3eb8d184e18a2cec8c67', 'requirements.txt': '018d1e446b65f3730ef877e68b23ecbe62b22273fb2bc3cc6a637458a37dbee7', 'scripts/ci/bootstrap-windows-postgres.ps1': '0d7adabb50c68836800b84a41c1d1e2e3797d5e974cdb80890ae0bd5337a09df', 'scripts/ci/validate-foundation-gates.cjs': '59b87a34555bc6d5a0c596d5d786961e11ee9011a2075cd7e9fa19ebca594d50', 'scripts/ci/write-foundation-version-manifest.cjs': 'ade90d99cefe926ec081e2dec903abf26add7a2e79918d2689dd8535a96330b5', 'tests/ci/pytest-allowed-skips.json': 'c81f6329dcc5a6f1b15846340f9b31e7e3b68efe389007cdd4ce2b0fc64c2ab2', '.github/workflows/pr-gates.yml': 'be9fa3c36fc7f0116a0fa7570a40347e6055287242fd32d8b391911087be6cf0'}, 'overlay_review_sha256': '16f6287fa4f60b9df1b0515ad84a8db38c68a3c3b0914155b6b929af8a6542d2', 'original_workflow_sha256': 'be9fa3c36fc7f0116a0fa7570a40347e6055287242fd32d8b391911087be6cf0', 'original_pytest_step_sha256': '07cae88c55ddf9a5bdf6ebb33c65ff5448f315c88544ee6e22b184290500e153', 'native_step_ids': ['native_00', 'native_01', 'native_02', 'native_03', 'native_04', 'setup_python_chrome', 'native_06', 'native_07', 'native_08', 'native_09', 'native_10', 'native_11', 'native_12', 'native_13', 'native_14', 'native_15', 'native_16', 'native_17', 'native_18']}
          root = Path.cwd().resolve()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'pytest-root-cleanup-full-context'
          evidence.mkdir(exist_ok=True)
          
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          
          def verify_source(*, overlaid):
              require(os.environ['GITHUB_REPOSITORY'] == C['repository'], 'Unexpected repository')
              require(os.environ['GITHUB_EVENT_NAME'] == 'push', 'Unexpected event')
              require(os.environ['GITHUB_REF'] == 'refs/heads/' + C['branch'], 'Unexpected helper ref')
              require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Diagnostic reruns are not authorized')
              require(platform.system() == 'Windows' and sys.version_info[:2] == (3, 11), 'Unexpected Python platform')
              require(git('rev-parse', 'HEAD') == C['source'], 'Unexpected source commit')
              require(git('rev-parse', 'HEAD^{tree}') == C['tree'], 'Unexpected source tree')
              require(git('config', '--get', 'core.autocrlf') == 'false', 'LF checkout guard missing')
              require(git('config', '--get', 'core.eol') == 'lf', 'LF checkout guard missing')
              require(git('ls-remote', 'origin', 'refs/heads/' + C['target']) == C['source'] + '\trefs/heads/' + C['target'], 'Target source branch moved')
              require(not git('diff', '--cached', '--name-only'), 'Source index changed')
              require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked source files')
              if overlaid:
                  require(git('diff', '--name-only').splitlines() == sorted(C['overlay']), 'Unexpected overlaid source changes')
              else:
                  require(not git('status', '--porcelain'), 'Source checkout is not clean')
              for name, sha in C['context_files'].items():
                  path = root / name
                  require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid context path')
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == sha, 'Original context bytes changed: ' + name)
              for name, pin in C['overlay'].items():
                  path = root / name
                  require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid overlay path')
                  expected = pin['sha256'] if overlaid else pin['old_sha256']
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'Overlay source hash mismatch: ' + name)
          
          import xml.etree.ElementTree as ET
          
          step_data = json.loads(os.environ['NATIVE_STEPS_JSON'])
          outcomes = {name: {key: step_data.get(name, {}).get(key, 'missing') for key in ('outcome', 'conclusion')} for name in C['native_step_ids']}
          junit = Path(os.environ['RUNNER_TEMP']) / 'pytest-results.xml'
          parse_error = None
          cases = []
          if junit.is_file():
              try:
                  cases = list(ET.parse(junit).getroot().iter('testcase'))
              except ET.ParseError:
                  parse_error = 'malformed-junit'
          expected = [case for case in cases if case.get('name') == C['case'].split('::')[-1] and case.get('classname') == 'tests.py.test_pytest_harness_config']
          case_status = 'missing' if not expected else 'duplicated' if len(expected) != 1 else 'error' if expected[0].find('error') is not None else 'failed' if expected[0].find('failure') is not None else 'skipped' if expected[0].find('skipped') is not None else 'passed'
          source_problem = None
          try:
              verify_source(overlaid=True)
          except (RuntimeError, subprocess.CalledProcessError, OSError) as exc:
              source_problem = type(exc).__name__
          preflight_file = evidence / 'preflight.json'
          preflight = json.loads(preflight_file.read_text(encoding='utf-8')) if preflight_file.is_file() else None
          preflight_ok = step_data.get('diagnostic_preflight', {}).get('outcome') == 'success'
          native_success = all(value['outcome'] == 'success' for value in outcomes.values())
          run_status = outcomes['native_13']['outcome']
          if not preflight_ok:
              if preflight and preflight['expected_cleanup_case_collection_count'] != 1:
                  outcome = 'cleanup-case-missing-or-duplicated-in-inventory'
              elif preflight:
                  outcome = 'missing-or-invalid-native-prerequisite'
              else:
                  outcome = 'prerequisite-or-source-guard-failure'
          elif parse_error or not junit.is_file():
              outcome = 'missing-or-invalid-full-run-result'
          elif case_status in ('missing', 'duplicated', 'skipped', 'error'):
              outcome = 'cleanup-case-' + case_status
          elif case_status == 'failed':
              outcome = 'cleanup-case-failure-observed'
          elif source_problem:
              outcome = 'source-or-target-changed-during-diagnostic'
          elif run_status != 'success' or any(case.find('failure') is not None or case.find('error') is not None for case in cases):
              outcome = 'full-context-failure-outside-cleanup-case'
          elif not native_success:
              outcome = 'native-check-or-cleanup-failure'
          else:
              outcome = 'no-failure-observed-inconclusive'
          summary = {
              'source': C['source'], 'source_tree': C['tree'],
              'helper_head': os.environ['GITHUB_SHA'], 'helper_parent': C['helper_parent'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'outcome': outcome, 'expected_cleanup_case': C['case'], 'cleanup_case_status': case_status,
              'junit_present': junit.is_file(), 'junit_parse_problem': parse_error,
              'case_count': len(cases),
              'failure_count': sum(case.find('failure') is not None for case in cases),
              'error_count': sum(case.find('error') is not None for case in cases),
              'skip_count': sum(case.find('skipped') is not None for case in cases),
              'preflight': preflight, 'preflight_step_succeeded': preflight_ok,
              'native_step_outcomes': outcomes, 'final_source_verification_problem': source_problem,
              'full_pytest_invocations_requested': 1, 'original_job_timeout_minutes': 45,
              'original_pytest_step_sha256': C['original_pytest_step_sha256'],
              'authoritative_ci_gate': False, 'cleanup_fix_claimed': False,
              'all_pass_means': 'Inconclusive reproduction; the complete authoritative PR pipeline remains required',
              'cleanup_diagnostic_evidence': 'Original pytest-results.xml and native job log retain the unchanged failing assertion with child-only sanitized cleanup telemetry',
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print('ONE_RUN_FULL_PYTHON_CONTEXT_DIAGNOSTIC ' + json.dumps(summary))
          sys.exit(0 if outcome == 'no-failure-observed-inconclusive' else 1)

      - name: Retain diagnostic proof and outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-root-cleanup-full-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\pytest-root-cleanup-full-context\helper-proof.json
            ${{ runner.temp }}\pytest-root-cleanup-full-context\source-context.json
            ${{ runner.temp }}\pytest-root-cleanup-full-context\preflight.json
            ${{ runner.temp }}\pytest-root-cleanup-full-context\summary.json
          if-no-files-found: error
          retention-days: 14
