# Bounded reproduction only. This workflow never publishes source or replaces full CI.
name: Pytest Root Cleanup Native Diagnostic
on:
  push:
    branches: [2026-09-30-capabilities-bundle-transfer]
    paths: [.github/workflows/pytest-root-cleanup-native-diagnostic.yml]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
jobs:
  diagnose:
    if: ${{ github.repository == 'idanilovqa/AlbumHaven' && github.event_name == 'push' && github.ref == 'refs/heads/2026-09-30-capabilities-bundle-transfer' && !github.event.deleted }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact helper push
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify helper ancestry and sole workflow modification
        env:
          EVENT_HEAD: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Read-Git { $output = & git @args; if ($LASTEXITCODE -ne 0) { throw "Git guard failed" }; return $output }
          if ($env:GITHUB_RUN_ATTEMPT -ne "1") { throw "Diagnostic reruns are not authorized" }
          $parent = "001123fd8f1f07afd9e815544125f00424de87ac"
          if ($env:EVENT_BEFORE -ne $parent -or $env:EVENT_FORCED -ne "false") { throw "Unexpected helper push ancestry" }
          if ((Read-Git rev-parse HEAD).Trim() -ne $env:EVENT_HEAD) { throw "Unexpected helper head" }
          if ((Read-Git show -s --format=%P HEAD).Trim() -ne $parent) { throw "Unexpected helper parent" }
          $changes = @(Read-Git diff --name-status --no-renames $parent HEAD)
          if ($changes.Count -ne 1 -or $changes[0] -cne "M`t.github/workflows/pytest-root-cleanup-native-diagnostic.yml") { throw "Unexpected helper changes" }
          if ((Read-Git remote get-url origin).Trim() -notmatch '^https://github\.com/idanilovqa/AlbumHaven(?:\.git)?$') { throw "Unexpected repository" }
      - name: Checkout pinned failed source
        uses: actions/checkout@v5
        with:
          ref: f527210c650b52fef8213acdc633fcbd7e272e6d
          fetch-depth: 1
          persist-credentials: false
      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify source and apply only the reviewed diagnostic overlay
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess
          C = {"branch":"2026-09-30-capabilities-bundle-transfer","case":"tests/py/test_pytest_harness_config.py::test_two_concurrent_default_pytest_processes_use_isolated_roots_and_cleanup_both","helper_parent":"001123fd8f1f07afd9e815544125f00424de87ac","max_invocations":20,"overlay":{"tests/py/conftest.py":{"bytes":25633,"content_b64":"","old_sha256":"6dce8731c811441f6b09320273be724b4958a86aa30411cb4c8ba026dc0e6505","sha256":"6cf6a6228bccac1ad823dff1efd67b8fd6d6642a01fd5b714d5cebbef80f24ce"},"tests/py/test_pytest_harness_config.py":{"bytes":31889,"content_b64":"","old_sha256":"5aa7f84fc3e45d5e7ac7d06d48440d61c8ec80c2e567697214201ab87a338745","sha256":"c3e9ce504cf6f3c5a0c946e53161b7de4588f9d26622986419a3c63a5e8753c8"}},"repository":"idanilovqa/AlbumHaven","source":"f527210c650b52fef8213acdc633fcbd7e272e6d","target":"2026-09-25-mobile-layout","tree":"d0991e408265b2570405352e4b769ede2981f836","workflow":".github/workflows/pytest-root-cleanup-native-diagnostic.yml"}
          root = pathlib.Path.cwd().resolve()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pytest-root-cleanup-diagnostic'
          evidence.mkdir(exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          require(os.environ['GITHUB_REPOSITORY'] == C['repository'], 'Unexpected repository')
          require(os.environ['GITHUB_EVENT_NAME'] == 'push', 'Unexpected event')
          require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Diagnostic reruns are not authorized')
          require(os.environ['GITHUB_REF'] == 'refs/heads/' + C['branch'], 'Unexpected helper ref')
          require(git('rev-parse', 'HEAD') == C['source'], 'Unexpected source commit')
          require(git('rev-parse', 'HEAD^{tree}') == C['tree'], 'Unexpected source tree')
          require(not git('status', '--porcelain'), 'Source checkout is not clean')
          require(git('ls-remote', 'origin', 'refs/heads/' + C['target']) == C['source'] + '\trefs/heads/' + C['target'], 'Target moved before diagnostic')
          decoded = {}
          for name, pin in C['overlay'].items():
              path = root / name
              require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid overlay path')
              require(hashlib.sha256(path.read_bytes()).hexdigest() == pin['old_sha256'], 'Original source hash mismatch')
              data = base64.b64decode(pin['content_b64'], validate=True)
              require(len(data) == pin['bytes'] and hashlib.sha256(data).hexdigest() == pin['sha256'], 'Diagnostic overlay hash mismatch')
              decoded[name] = data
          for name, data in decoded.items():
              (root / name).write_bytes(data)
          require(git('diff', '--name-only').splitlines() == sorted(C['overlay']), 'Unexpected overlay changes')
          require(not git('diff', '--cached', '--name-only'), 'Overlay changed the index')
          require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked source files')
          provenance = {key: value for key, value in C.items() if key != 'overlay'}
          provenance['overlay'] = {name: {key: value for key, value in pin.items() if key != 'content_b64'} for name, pin in C['overlay'].items()}
          (evidence / 'source-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print('PINNED_DIAGNOSTIC_OVERLAY_OK 2')
      - name: Install original native Python requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run bounded fresh invocations and stop at first failure
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, subprocess, sys, xml.etree.ElementTree as ET
          C = {"branch":"2026-09-30-capabilities-bundle-transfer","case":"tests/py/test_pytest_harness_config.py::test_two_concurrent_default_pytest_processes_use_isolated_roots_and_cleanup_both","helper_parent":"001123fd8f1f07afd9e815544125f00424de87ac","max_invocations":20,"overlay":{"tests/py/conftest.py":{"bytes":25633,"old_sha256":"6dce8731c811441f6b09320273be724b4958a86aa30411cb4c8ba026dc0e6505","sha256":"6cf6a6228bccac1ad823dff1efd67b8fd6d6642a01fd5b714d5cebbef80f24ce"},"tests/py/test_pytest_harness_config.py":{"bytes":31889,"old_sha256":"5aa7f84fc3e45d5e7ac7d06d48440d61c8ec80c2e567697214201ab87a338745","sha256":"c3e9ce504cf6f3c5a0c946e53161b7de4588f9d26622986419a3c63a5e8753c8"}},"repository":"idanilovqa/AlbumHaven","source":"f527210c650b52fef8213acdc633fcbd7e272e6d","target":"2026-09-25-mobile-layout","tree":"d0991e408265b2570405352e4b769ede2981f836","workflow":".github/workflows/pytest-root-cleanup-native-diagnostic.yml"}
          root = pathlib.Path.cwd().resolve()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pytest-root-cleanup-diagnostic'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          def verify_source():
              require(git('rev-parse', 'HEAD') == C['source'], 'Source commit changed')
              require(git('write-tree') == C['tree'], 'Source index changed')
              require(git('diff', '--name-only').splitlines() == sorted(C['overlay']), 'Unexpected source changes')
              require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked source files')
              for name, pin in C['overlay'].items():
                  require(hashlib.sha256((root / name).read_bytes()).hexdigest() == pin['sha256'], 'Diagnostic source changed')
          require(platform.system() == 'Windows' and sys.version_info[:2] == (3, 11), 'Unexpected Python platform')
          require(C['max_invocations'] == 20, 'Unexpected diagnostic bound')
          require(git('ls-remote', 'origin', 'refs/heads/' + C['target']) == C['source'] + '\trefs/heads/' + C['target'], 'Target moved before diagnostic')
          versions = {'python': platform.python_version(), 'platform': platform.platform(), 'pytest': subprocess.check_output([sys.executable, '-m', 'pytest', '--version'], text=True).strip()}
          (evidence / 'versions.json').write_text(json.dumps(versions, indent=2) + '\n')
          records = []
          outcome = 'no-failure-observed-inconclusive'
          final_code = 0
          for number in range(1, C['max_invocations'] + 1):
              verify_source()
              junit = evidence / ('attempt-%02d.xml' % number)
              logfile = evidence / ('attempt-%02d.log' % number)
              command = [sys.executable, '-m', 'pytest', '-q', '-vv', '--tb=short', C['case'], '--junitxml=' + str(junit), '-o', 'faulthandler_timeout=60']
              env = os.environ.copy()
              env['ALBUM_HAVEN_PYTEST_CLEANUP_DIAGNOSTICS'] = '1'
              with logfile.open('w', encoding='utf-8') as output:
                  result = subprocess.run(command, cwd=root, env=env, stdout=output, stderr=subprocess.STDOUT)
              record = {'invocation': number, 'returncode': result.returncode, 'log': logfile.name, 'junit': junit.name}
              cases = list(ET.parse(junit).getroot().iter('testcase')) if junit.exists() else []
              valid = len(cases) == 1 and cases[0].get('name') == C['case'].split('::')[-1]
              valid = valid and cases[0].find('skipped') is None
              record['exact_case_recorded'] = valid
              record['failure_nodes'] = len(cases[0].findall('failure')) if valid else None
              record['error_nodes'] = len(cases[0].findall('error')) if valid else None
              records.append(record)
              if not valid:
                  outcome = 'invalid-or-prerequisite-result'
                  final_code = 1
                  break
              if result.returncode != 0 or record['failure_nodes'] or record['error_nodes']:
                  outcome = 'first-failure-observed'
                  final_code = 1
                  break
          verify_source()
          require(git('ls-remote', 'origin', 'refs/heads/' + C['target']) == C['source'] + '\trefs/heads/' + C['target'], 'Target moved during diagnostic')
          summary = {'source': C['source'], 'case': C['case'], 'max_invocations': 20, 'invocations': records, 'outcome': outcome, 'authoritative_ci_gate': False, 'acceptance_retry_policy_changed': False, 'child_timeout_seconds': 60, 'all_pass_means': 'inconclusive reproduction; full required CI remains mandatory'}
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('BOUNDED_WINDOWS_DIAGNOSTIC ' + json.dumps(summary))
          sys.exit(final_code)
      - name: Retain bounded diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-root-cleanup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-root-cleanup-diagnostic
          if-no-files-found: error
          retention-days: 7
