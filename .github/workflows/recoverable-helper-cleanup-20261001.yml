name: Recoverable bounded helper cleanup
on:
  push:
    branches: [2026-09-30-mobile-bundle-transfer]
    paths: [.github/workflows/recoverable-helper-cleanup-20261001.yml]
permissions: {}
concurrency:
  group: recoverable-helper-cleanup-20261001
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-30-mobile-bundle-transfer' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      proof_sha256: ${{ steps.check.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact event, final acceptance, protections and full histories
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          ZERO = "0" * 40
          class Rejected(RuntimeError):
              pass
          def require(condition, message):
              if not condition:
                  raise Rejected(message)
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode()
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def oid(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) is not None and value != ZERO
          def sha256(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value) is not None
          def refname(value, prefix):
              require(isinstance(value, str) and value.startswith(prefix), "ref namespace mismatch")
              require(re.fullmatch(r"[A-Za-z0-9._/-]+", value) is not None, "unsafe ref characters")
              require(not any(x in value for x in ("..", "//", "@{")) and not value.endswith(("/", ".", ".lock")), "unsafe ref")
              require(all(p and not p.startswith(".") and not p.endswith(".lock") for p in value.split("/")), "unsafe ref component")
              return value
          def timestamp(value):
              require(isinstance(value, str), "timestamp missing")
              result = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              require(result.tzinfo is not None, "timestamp must be timezone-aware")
              return result.timestamp()
          def ensure_fresh(binding, now=None):
              current = time.time() if now is None else now
              start, end = timestamp(binding["checkedAtUtc"]), timestamp(binding["validUntilUtc"])
              require(start <= current <= end and 0 < end - start <= 900, "binding is future/stale or exceeds 15-minute window")
              service_time = timestamp(binding["services"]["checkedAtUtc"])
              require(start - 60 <= service_time <= start and current - service_time <= 900, "external service receipt is stale")
          def validate_binding(scope, binding, now=None):
              require(binding["executionApproved"] is True, "execution gate is unresolved")
              require(binding["scopeSha256"] == digest(canonical(scope)), "reviewed scope identity changed")
              require(binding["repository"] == scope["repository"], "repository binding changed")
              require(binding["anchor"] == scope["anchor"] and binding["anchorDisposition"] == "retain-final-anchor", "anchor disposition changed")
              require(oid(binding["sourceParent"]) and oid(binding["mainCommit"]), "parent/main binding unresolved")
              expected = {r["branch"] for r in scope["candidates"]}
              require(set(binding["tips"]) == expected and all(oid(v) for v in binding["tips"].values()), "exact candidate tips unresolved or expanded")
              require(binding["sourceParent"] == binding["tips"][scope["anchor"]], "source parent differs from pre-workflow anchor tip")
              expected_moves = {r["branch"]: (r["observedTip"], binding["tips"][r["branch"]]) for r in scope["candidates"]
                                if r["observedTip"] != binding["tips"][r["branch"]]}
              observed_moves = {}
              for move in binding["explicitTipChanges"]:
                  require(move["branch"] not in observed_moves and move["reviewedByRoot"] is True and bool(move["reason"]), "tip change is not explicitly reviewed")
                  observed_moves[move["branch"]] = (move["priorObservedTip"], move["boundTip"])
              require(observed_moves == expected_moves, "moved tips must be explicitly reconciled; never silently adopt")
              acceptance = binding["releaseAcceptance"]
              require(acceptance["releaseAccepted"] is True and acceptance["deploymentsAccepted"] is True and oid(acceptance["releaseCommit"]), "final release/deployment acceptance missing")
              require(all(sha256(acceptance[k]) for k in ("releaseEvidenceSha256", "deploymentEvidenceSha256", "rootApprovalEvidenceSha256")), "acceptance evidence is unbound")
              services = binding["services"]
              require(services["complete"] is True and services["rootReviewed"] is True and sha256(services["receiptSha256"]), "complete reviewed service receipt missing")
              require(services["limitationAcknowledged"] is True, "external service observation boundary is not acknowledged")
              ensure_fresh(binding, now)
              for service in services["sources"]:
                  require(set(service) == {"id", "repository", "branch"} and all(isinstance(v, str) and v for v in service.values()), "invalid service source receipt")
              require(isinstance(binding["taggerEpoch"], int) and abs(binding["taggerEpoch"] - timestamp(binding["checkedAtUtc"])) < 60, "tagger epoch is not bound to fresh review")
              require(binding["archivePrefix"] == scope["archivePrefix"], "archive namespace changed")
              return archive_groups(scope, binding)
          def archive_groups(scope, binding):
              grouped = {}
              for candidate in scope["candidates"]:
                  branch = candidate["branch"]
                  if branch == scope["anchor"]:
                      continue
                  refname("refs/heads/" + branch, "refs/heads/")
                  grouped.setdefault(binding["tips"][branch], []).append(branch)
              groups = []
              for tip, branches in sorted(grouped.items(), key=lambda row: sorted(row[1])[0]):
                  branches.sort()
                  tag = scope["archivePrefix"] + branches[0] + "-" + tip[:12]
                  refname("refs/tags/" + tag, "refs/tags/")
                  groups.append({"tip": tip, "branches": branches, "tag": tag})
              return groups
          def git_environment(token=None):
              env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
              env.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null", GIT_TERMINAL_PROMPT="0", GIT_NO_REPLACE_OBJECTS="1")
              if token:
                  auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
                  env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + auth)
              return env
          def git(repo, *args, data=None, token=None, hooks=None):
              result = subprocess.run(["git", "-c", "core.hooksPath=" + (str(hooks) if hooks else "/dev/null"),
                                       "-c", "fetch.fsckObjects=true", "-c", "transfer.fsckObjects=true", "-C", str(repo), *args],
                                      input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=git_environment(token), check=False)
              require(result.returncode == 0, "Git " + args[0] + " failed; stop and inspect, never retry automatically")
              return result.stdout
          def fresh_bare(path):
              require(not path.exists(), "history repository is not fresh")
              path.mkdir()
              git(path, "init", "--bare", "--object-format=sha1", ".")
              return path
          def full_history(repo, commit):
              require(git(repo, "rev-parse", "--is-bare-repository").strip() == b"true", "history verifier needs a bare repository")
              require(git(repo, "rev-parse", "--is-shallow-repository").strip() == b"false", "shallow history rejected")
              require(not (repo / "objects/info/alternates").exists() and not (repo / "info/grafts").exists(), "external/grafted object authority rejected")
              config = git(repo, "config", "--list").decode().lower()
              require("promisor=" not in config and "partialclone=" not in config, "partial object history rejected")
              require(git(repo, "for-each-ref", "--format=%(refname)", "refs/replace").strip() == b"", "replacement objects rejected")
              require(git(repo, "cat-file", "-t", commit).strip() == b"commit", "archive target is not a commit")
              objects = git(repo, "rev-list", "--objects", "--no-object-names", "--missing=print", commit).decode().splitlines()
              require(objects and all(oid(value) for value in objects), "missing reachable objects")
              git(repo, "fsck", "--full", "--strict", "--no-reflogs", commit)
              return {"commit": commit, "objectCount": len(set(objects)), "objectSetSha256": digest(("\n".join(sorted(set(objects))) + "\n").encode()),
                      "commitCount": int(git(repo, "rev-list", "--count", commit).strip()), "nonShallow": True, "fsck": "passed"}
          def no_redirect_request(url, token):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                                                            "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "reviewed-recoverable-cleanup"})
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  require(response.status == 200, "GitHub read failed")
                  return json.load(response)
          def api_get(scope, suffix, token):
              # Every API operation is GET, only on this exact repository at the official API host.
              require(suffix.startswith("/") and ".." not in suffix, "invalid API route")
              return no_redirect_request("https://api.github.com/repos/" + scope["repository"] + suffix, token)
          def paged(scope, route, token):
              result = []
              separator = "&" if "?" in route else "?"
              for page in range(1, 101):
                  rows = api_get(scope, route + separator + "per_page=100&page=" + str(page), token)
                  require(isinstance(rows, list), "unrecognized paginated response")
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
              raise Rejected("pagination was not exhausted")
          def live_state(scope, token):
              branches = paged(scope, "/branches", token)
              pulls = paged(scope, "/pulls?state=open", token)
              branch_map = {}
              for branch in branches:
                  name = branch["name"]
                  require(name not in branch_map and type(branch["protected"]) is bool and oid(branch["commit"]["sha"]), "invalid/duplicate branch response")
                  branch_map[name] = {"sha": branch["commit"]["sha"], "protected": branch["protected"]}
              protected_by_pr = set()
              for pull in pulls:
                  require(pull.get("state") == "open", "open PR inventory changed shape")
                  for side in ("head", "base"):
                      item = pull[side]
                      require(item.get("repo") and isinstance(item.get("ref"), str), "unknown PR repository/ref")
                      if item["repo"]["full_name"] == scope["repository"]:
                          protected_by_pr.add(item["ref"])
              docs = {}
              for candidate in scope["candidates"]:
                  if candidate["kind"] == "merged-doc":
                      docs[candidate["branch"]] = api_get(scope, "/pulls/" + str(candidate["pr"]), token)
              return {"branches": branch_map, "openPrBranches": sorted(protected_by_pr), "docs": docs}
          def guard_state(scope, binding, state, trigger, deleted=()):
              validate_binding(scope, binding)
              require(oid(trigger), "trigger SHA missing")
              require(state["branches"].get("main", {}).get("sha") == binding["mainCommit"], "main moved since final review")
              for branch, expected in scope["immutableRetainedRefs"].items():
                  require(state["branches"].get(branch, {}).get("sha") == expected, "required retained review ref moved or disappeared")
              services = {s["branch"] for s in binding["services"]["sources"] if s["repository"] == scope["repository"]}
              pr_refs = set(state["openPrBranches"])
              deleted = set(deleted)
              allowed = {r["branch"] for r in scope["candidates"] if r["branch"] != scope["anchor"]}
              require(deleted <= allowed, "deleted set is outside exact cleanup scope")
              for candidate in scope["candidates"]:
                  branch = candidate["branch"]
                  if branch in deleted:
                      require(branch not in state["branches"], "deleted branch reappeared; stop")
                      continue
                  value = state["branches"].get(branch)
                  expected = trigger if branch == scope["anchor"] else binding["tips"][branch]
                  require(value and value["sha"] == expected, "candidate or actual trigger tip moved")
                  require(branch not in pr_refs and branch not in services and value["protected"] is False, "candidate is protected or used by a PR/service")
                  require(branch not in scope["retainedBranches"] or branch == scope["anchor"], "retained branch cannot be a deletion candidate")
                  if candidate["kind"] == "merged-doc":
                      pull = state["docs"][branch]
                      require(pull.get("merged") is True and pull.get("state") == "closed" and pull["base"]["ref"] == "main" and
                              pull["head"]["ref"] == branch and pull["head"]["sha"] == expected and
                              pull["head"]["repo"]["full_name"] == scope["repository"], "documentation PR provenance changed")
          def remote_map(repo, scope, refs, token=None):
              rows = git(repo, "ls-remote", scope["remote"], *sorted(refs), token=token).decode().splitlines()
              result = {}
              for row in rows:
                  value, ref = row.split("\t")
                  require(ref in refs and ref not in result and oid(value), "unexpected or duplicate advertised ref")
                  result[ref] = value
              return result
          def tag_refs(group):
              return {"refs/tags/" + group["tag"], "refs/tags/" + group["tag"] + "^{}"}
          def verify_tag_remote(repo, scope, group, tag_oid, token=None):
              expected = {"refs/tags/" + group["tag"]: tag_oid, "refs/tags/" + group["tag"] + "^{}": group["tip"]}
              require(remote_map(repo, scope, set(expected), token) == expected, "archive tag object or peeled commit moved/missing")
          def tag_bytes(scope, binding, group, env):
              annotation = {"schemaVersion": 1, "repository": scope["repository"], "originalBranches": group["branches"],
                            "commit": group["tip"], "scopeSha256": digest(canonical(scope)), "bindingSha256": digest(canonical(binding)),
                            "runId": env["GITHUB_RUN_ID"], "attempt": env["GITHUB_RUN_ATTEMPT"], "triggerCommit": env["GITHUB_SHA"],
                            "restoration": "Recreate an absent original branch from this exact commit only after approval; never overwrite a newer branch."}
              header = ("object " + group["tip"] + "\ntype commit\ntag " + group["tag"] +
                        "\ntagger github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com> " + str(binding["taggerEpoch"]) + " +0000\n\n")
              return header.encode() + canonical(annotation)
          def object_oid(kind, data):
              return hashlib.sha1(kind.encode() + b" " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def verify_event(repo, scope, binding, env, event):
              validate_binding(scope, binding)
              require(env.get("GITHUB_REPOSITORY") == scope["repository"] and env.get("GITHUB_REF") == "refs/heads/" + scope["anchor"] and
                      env.get("GITHUB_EVENT_NAME") == "push", "wrong repository/ref/event")
              require(env.get("GITHUB_RUN_ATTEMPT") == "1" and re.fullmatch(r"[1-9][0-9]*", env.get("GITHUB_RUN_ID", "")), "run identity/replay rejected")
              trigger = env.get("GITHUB_SHA")
              require(oid(trigger) and event.get("before") == binding["sourceParent"] and event.get("after") == trigger and
                      event.get("ref") == env["GITHUB_REF"] and event.get("repository", {}).get("full_name") == scope["repository"], "event parent binding mismatch")
              require(all(event.get(k) is False for k in ("forced", "created", "deleted")), "forced/create/delete event rejected")
              require(git(repo, "rev-parse", "HEAD").decode().strip() == trigger, "checkout is not triggering tip")
              require(git(repo, "rev-list", "--parents", "-n", "1", trigger).decode().split() == [trigger, binding["sourceParent"]], "trigger must have one exact parent")
              changes = git(repo, "diff", "--name-status", "--no-renames", binding["sourceParent"], trigger).decode().strip()
              require(changes == "A\t" + scope["workflowPath"], "trigger must add only its exact workflow")
              metadata = git(repo, "ls-tree", trigger, "--", scope["workflowPath"]).decode().split()
              require(metadata[:2] == ["100644", "blob"], "workflow is not a regular nonexecutable file")
          def fixed_proof(scope, binding, env):
              return {"schemaVersion": 1, "scopeSha256": digest(canonical(scope)), "bindingSha256": digest(canonical(binding)),
                      "repository": scope["repository"], "runId": env["GITHUB_RUN_ID"], "runAttempt": env["GITHUB_RUN_ATTEMPT"],
                      "sourceParent": binding["sourceParent"], "actualTriggerTip": env["GITHUB_SHA"],
                      "retainedAnchor": scope["anchor"], "anchorDisposition": "retain-final-anchor"}
          def write_receipt(path, value):
              data = canonical(value)
              with path.open("wb") as output:
                  output.write(data)
                  output.flush()
                  os.fsync(output.fileno())
              return digest(data)
          def read_proof(path, scope, binding, env, expected_digest):
              require(path.is_file() and not path.is_symlink(), "artifact proof is not regular")
              data = path.read_bytes()
              require(digest(data) == expected_digest, "same-run artifact digest mismatch")
              value = json.loads(data)
              require(value["identity"] == fixed_proof(scope, binding, env), "wrong run/attempt/source/plan proof")
              require(canonical(value) == data, "noncanonical proof")
              return value
          def verify_remote_history(root, name, scope, group, token=None, tag_oid=None):
              repo = fresh_bare(root / name)
              source = "refs/tags/" + group["tag"] if tag_oid else "refs/heads/" + group["branches"][0]
              git(repo, "fetch", "--no-tags", scope["remote"], source, token=token)
              fetched = git(repo, "rev-parse", "FETCH_HEAD").decode().strip()
              if tag_oid:
                  require(fetched == tag_oid and git(repo, "cat-file", "-t", fetched).strip() == b"tag", "fetched archive is not exact annotated tag object")
                  require(git(repo, "rev-parse", fetched + "^{}").decode().strip() == group["tip"], "wrong archive peel")
              else:
                  require(fetched == group["tip"], "source branch moved during full fetch")
              return repo, full_history(repo, group["tip"])
          def validate_all(repo, root, scope, binding, env, event, token):
              verify_event(repo, scope, binding, env, event)
              groups = archive_groups(scope, binding)
              guard_state(scope, binding, live_state(scope, token), env["GITHUB_SHA"])
              receipts = []
              for index, group in enumerate(groups):
                  require(remote_map(repo, scope, tag_refs(group), token) == {}, "archive name already exists; never overwrite/reuse")
                  history_repo, history = verify_remote_history(root, "validate-history-" + str(index), scope, group, token)
                  raw_tag = tag_bytes(scope, binding, group, env)
                  tag_oid = object_oid("tag", raw_tag)
                  require(git(history_repo, "mktag", data=raw_tag).decode().strip() == tag_oid, "annotated tag identity invalid")
                  for branch in group["branches"]:
                      candidate = next(r for r in scope["candidates"] if r["branch"] == branch)
                      if candidate["kind"] == "merged-doc":
                          git(history_repo, "fetch", "--no-tags", scope["remote"], "refs/heads/main", token=token)
                          require(git(history_repo, "rev-parse", "FETCH_HEAD").decode().strip() == binding["mainCommit"], "private main changed")
                          git(history_repo, "merge-base", "--is-ancestor", group["tip"], binding["mainCommit"])
                  receipts.append({**group, "tagObject": tag_oid, "history": history})
              guard_state(scope, binding, live_state(scope, token), env["GITHUB_SHA"])
              return {"identity": fixed_proof(scope, binding, env), "groups": receipts, "allTargetsRecoverable": True}
          def check_groups(proof, scope, binding, env):
              groups = archive_groups(scope, binding)
              require(len(proof["groups"]) == len(groups), "archive group set mismatch")
              for actual, expected in zip(proof["groups"], groups):
                  require(all(actual[k] == expected[k] for k in expected), "archive source group changed")
                  require(actual["tagObject"] == object_oid("tag", tag_bytes(scope, binding, expected, env)), "archive tag object changed")
                  require(actual["history"]["commit"] == expected["tip"] and actual["history"]["nonShallow"] is True and
                          actual["history"]["fsck"] == "passed" and actual["history"]["objectCount"] > 0, "incomplete history proof")
