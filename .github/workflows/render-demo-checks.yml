name: Render Demo Verification
on:
  push:
    branches: [2026-09-25-render-demo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-admin
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Deployment guard tests
        run: python -m unittest discover -s tests/py -p test_render_demo_launcher.py -v
      - name: Provision disposable database with a non-superuser owner
        env:
          PGPASSWORD: isolated-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE demo_owner LOGIN CREATEROLE PASSWORD 'isolated-ci-owner';
          CREATE DATABASE album_haven_ci_render_demo OWNER demo_owner;
          SQL
      - name: Seed twice and verify normal authentication
        run: python scripts/render_demo_smoke.py
