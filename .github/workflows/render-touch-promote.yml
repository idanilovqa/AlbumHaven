name: Promote Verified Mobile Touch Preview
on:
  push:
    branches: [2026-09-26-render-mobile-feedback]
    paths: [.github/workflows/render-touch-promote.yml]
permissions:
  contents: read
concurrency:
  group: render-demo-verified-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const cp = require('child_process');
            const source = 'af4f02d70d5c1895c73f442eea9500eb5a1ed0bc';
            const baseline = 'cfc8f9167694b15611a57632784039654c6d0e83';
            const expectedDemo = '233963c7fa78363c5cef51c385ba88b8cb8d7916';
            const verification = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 36495417867});
            if (verification.data.status !== 'completed' || verification.data.conclusion !== 'success'
                || verification.data.head_branch !== '2026-09-25-mobile-layout'
                || verification.data.path !== '.github/workflows/mobile-layout-checks.yml') {
              throw new Error('The exact Mobile Layout Verification run has not passed');
            }
            const hostingSource = '9ee67dad46202197598315a054d2dd333daa363b';
            const hosting = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 36495833072});
            if (hosting.data.status !== 'completed' || hosting.data.conclusion !== 'success'
                || hosting.data.head_sha !== hostingSource || hosting.data.path !== '.github/workflows/render-demo-checks.yml') {
              throw new Error('Hosting startup repair has not passed its dedicated verification');
            }
            const sourceCommit = await github.rest.git.getCommit({...context.repo, commit_sha: source});
            if (verification.data.head_sha !== source
                && !sourceCommit.data.parents.some(parent => parent.sha === verification.data.head_sha)) {
              throw new Error('Verified run does not own the expanded source commit');
            }
            const sourceRef = await github.rest.git.getRef({...context.repo, ref: 'heads/2026-09-25-mobile-layout'});
            const target = await github.rest.git.getRef({...context.repo, ref: 'heads/2026-09-25-render-demo'});
            if (sourceRef.data.object.sha !== source || target.data.object.sha !== expectedDemo) {
              throw new Error('A branch moved; refresh before promotion');
            }
            const paths = ["docs/mobile-touch-feedback-2026-09-28.md", "music_app/services/cover_state.py", "music_app/static/css/app-chrome.css", "music_app/static/css/appearance-backgrounds.css", "music_app/static/css/mobile-layout.css", "music_app/static/css/runtime/trigger-anchor.css", "music_app/static/js/button-component.js", "music_app/static/js/runtime/album-artbox.js", "music_app/static/js/runtime/core-state-and-helpers.js", "music_app/static/js/runtime/cover-lookup-modal-and-drawer.js", "music_app/static/js/runtime/gallery-main-interactions.js", "music_app/static/js/runtime/mobile-navigation.js", "music_app/static/js/runtime/shell-navigation-drawer.js", "music_app/static/js/runtime/track-modal-lightbox-helpers.js", "music_app/static/js/settings-navigation.js", "tests/e2e/mobile-feedback/mobileTouchFeedback.spec.js", "tests/e2e/mobile-feedback/ownerFeedback.spec.js", "tests/e2e/poms/mobileTouchFeedbackPage.js", "tests/e2e/support/mobileLayoutFixture.py", "tests/js/runtime/mobile-touch-feedback.test.js", "tests/py/test_mobile_touch_feedback.py", "music_app/static/js/runtime-bundle.js"];
            const entry = (sha, name) => {
              const row = cp.execFileSync('git', ['ls-tree', sha, '--', name], {encoding: 'utf8'}).trim();
              if (!row) return null;
              const [mode, kind, id] = row.split(/\s+/);
              if (kind !== 'blob' || !['100644', '100755'].includes(mode)) throw new Error('Unsupported file: ' + name);
              return {mode, sha: id};
            };
            const tree = [];
            for (const name of paths) {
              if (!/^(music_app|tests|docs)\//.test(name)) throw new Error('Outside approved application scope: ' + name);
              const original = entry(baseline, name), desired = entry(source, name), current = entry(expectedDemo, name);
              if (current?.sha === desired?.sha) continue;
              if (current?.sha !== original?.sha) throw new Error('Demo diverged at ' + name);
              tree.push({path: name, mode: desired?.mode || current.mode, type: 'blob', sha: desired?.sha || null});
            }
            for (const name of ['scripts/render_demo.py', 'tests/py/test_render_demo_launcher.py']) {
              const original = entry('233963c7fa78363c5cef51c385ba88b8cb8d7916', name);
              const current = entry(expectedDemo, name), desired = entry(hostingSource, name);
              if (!desired || current?.sha !== original?.sha) throw new Error('Hosting source changed: ' + name);
              tree.push({path: name, mode: desired.mode, type: 'blob', sha: desired.sha});
            }
            if (!tree.length) { console.log('No pending application delta'); return; }
            const parent = await github.rest.git.getCommit({...context.repo, commit_sha: expectedDemo});
            const updatedTree = await github.rest.git.createTree({...context.repo, base_tree: parent.data.tree.sha, tree});
            const commit = await github.rest.git.createCommit({...context.repo,
              message: 'fix(mobile): deploy verified touch, cover selection and compact footer repairs',
              tree: updatedTree.data.sha, parents: [expectedDemo]});
            await github.rest.git.updateRef({...context.repo, ref: 'heads/2026-09-25-render-demo', sha: commit.data.sha, force: false});
            console.log('RENDER_PREVIEW_PROMOTION ' + JSON.stringify({source, target: commit.data.sha,
              verification_run: verification.data.id, changed_files: tree.map(item => item.path)}));
