name: Promote Verified Mobile Touch Preview
on:
  push:
    branches: [2026-09-26-render-mobile-feedback]
    paths: [.github/workflows/render-touch-promote.yml]
permissions:
  contents: read
concurrency:
  group: render-demo-verified-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const cp = require('child_process');
            const source = '3abe98a813948dc6a1804d5b970d153ef958ca12';
            const baseline = 'af4f02d70d5c1895c73f442eea9500eb5a1ed0bc';
            const expectedDemo = 'cc892ab1b97e9078e5f63f5254d4316d5714dc3f';
            const verification = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 36502170873});
            if (verification.data.status !== 'completed' || verification.data.conclusion !== 'success'
                || verification.data.head_branch !== '2026-09-25-mobile-layout'
                || verification.data.path !== '.github/workflows/mobile-layout-checks.yml') {
              throw new Error('The exact Mobile Layout Verification run has not passed');
            }
            const sourceCommit = await github.rest.git.getCommit({...context.repo, commit_sha: source});
            if (verification.data.head_sha !== source
                && !sourceCommit.data.parents.some(parent => parent.sha === verification.data.head_sha)) {
              throw new Error('Verified run does not own the expanded source commit');
            }
            const sourceRef = await github.rest.git.getRef({...context.repo, ref: 'heads/2026-09-25-mobile-layout'});
            const target = await github.rest.git.getRef({...context.repo, ref: 'heads/2026-09-25-render-demo'});
            if (sourceRef.data.object.sha !== source || target.data.object.sha !== expectedDemo) {
              throw new Error('A branch moved; refresh before promotion');
            }
            const paths = ["docs/mobile-touch-feedback-2026-09-28.md", "music_app/static/css/mobile-layout.css", "music_app/static/js/runtime/gallery-refresh-and-status.js", "music_app/static/js/runtime/mobile-navigation.js", "music_app/static/js/runtime/search-input.js", "tests/e2e/mobile-feedback/mobileTouchFeedback.spec.js", "tests/e2e/mobile-feedback/ownerFeedback.spec.js", "tests/e2e/poms/mobileTouchFeedbackPage.js", "tests/js/runtime/mobile-touch-feedback.test.js", "tests/js/runtime/gallery-refresh-and-status.test.js", "music_app/static/js/runtime-bundle.js"];
            const changed = cp.execFileSync('git', ['diff', '--name-only', baseline, source], {encoding: 'utf8'}).trim().split('\n').filter(Boolean);
            if (changed.some(name => !paths.includes(name))) throw new Error('Unexpected source delta; review the complete change inventory');
            const entry = (sha, name) => {
              const row = cp.execFileSync('git', ['ls-tree', sha, '--', name], {encoding: 'utf8'}).trim();
              if (!row) return null;
              const [mode, kind, id] = row.split(/\s+/);
              if (kind !== 'blob' || !['100644', '100755'].includes(mode)) throw new Error('Unsupported file: ' + name);
              return {mode, sha: id};
            };
            const tree = [];
            for (const name of paths) {
              if (!/^(music_app|tests|docs)\//.test(name)) throw new Error('Outside approved application scope: ' + name);
              const original = entry(baseline, name), desired = entry(source, name), current = entry(expectedDemo, name);
              if (current?.sha === desired?.sha) continue;
              if (current?.sha !== original?.sha) throw new Error('Demo diverged at ' + name);
              tree.push({path: name, mode: desired?.mode || current.mode, type: 'blob', sha: desired?.sha || null});
            }
            if (!tree.length) { console.log('No pending application delta'); return; }
            const parent = await github.rest.git.getCommit({...context.repo, commit_sha: expectedDemo});
            const updatedTree = await github.rest.git.createTree({...context.repo, base_tree: parent.data.tree.sha, tree});
            const commit = await github.rest.git.createCommit({...context.repo,
              message: 'fix(mobile): deploy top-aligned album identity and retained-query search',
              tree: updatedTree.data.sha, parents: [expectedDemo]});
            await github.rest.git.updateRef({...context.repo, ref: 'heads/2026-09-25-render-demo', sha: commit.data.sha, force: false});
            console.log('RENDER_PREVIEW_PROMOTION ' + JSON.stringify({source, target: commit.data.sha,
              verification_run: verification.data.id, changed_files: tree.map(item => item.path)}));
