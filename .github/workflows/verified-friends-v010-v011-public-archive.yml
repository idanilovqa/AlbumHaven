              result = subprocess.run(command, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      env=git_env(token), check=False)
              require(result.returncode == 0, "git operation failed: " + args[0] + "; inspect, do not retry automatically")
              return result.stdout
          def git_tree(repo, revision):
              result = {}
              for line in git(repo, "ls-tree", "-rz", revision).split(b"\0"):
                  if not line:
                      continue
                  metadata, path = line.split(b"\t", 1)
                  mode, kind, oid = metadata.decode().split()
                  result[path.decode("utf-8")] = (mode, kind, oid)
              return result
          def diff_records(repo, old, new=None, cached=False):
              args = ["diff", "--raw", "--no-abbrev", "--no-renames", "-z"]
              if cached:
                  args.append("--cached")
              args.append(old)
              if new:
                  args.append(new)
              pieces = git(repo, *args).split(b"\0")
              require(pieces.pop() == b"", "invalid diff framing")
              require(len(pieces) % 2 == 0, "invalid diff shape")
              result = {}
              for metadata, path in zip(pieces[::2], pieces[1::2]):
                  oldmode, newmode, oldoid, newoid, operation = metadata.decode().split()
                  name = path.decode("utf-8")
                  require(name not in result, "duplicate diff path")
                  result[name] = (oldmode.lstrip(":"), newmode, oldoid, newoid, operation)
