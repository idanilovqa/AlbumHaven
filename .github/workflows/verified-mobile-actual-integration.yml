              require(re.fullmatch(r"[A-Za-z0-9._/@()+ -]+", path) is not None, "unsafe path characters")
              require(not path.startswith("/") and str(PurePosixPath(path)) == path, "noncanonical path")
              require(all(p not in ("", ".", "..", ".git") for p in path.split("/")), "unsafe path component")
              return path
          def verify_bytes(data, record):
              require(len(data) == record["bytes"], "size mismatch: " + record["path"])
              require(sha256(data) == record["sha256"], "SHA-256 mismatch: " + record["path"])
              require(git_blob(data) == record["git_blob"], "Git blob mismatch: " + record["path"])
          def git_env(token=None, index=None):
              env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
              env.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null", GIT_TERMINAL_PROMPT="0")
              if index:
                  env["GIT_INDEX_FILE"] = str(index)
              if token:
                  auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
                  env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + auth)
              return env
          def git(repo, *args, data=None, token=None, index=None, hooks=None):
              command = ["git", "-c", "core.hooksPath=" + (str(hooks) if hooks else "/dev/null"),
                         "-c", "core.autocrlf=false", "-c", "commit.gpgsign=false", "-C", str(repo), *args]
              result = subprocess.run(command, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      env=git_env(token, index), check=False)
              require(result.returncode == 0, "git operation failed: " + args[0] + "; inspect, do not retry automatically")
              return result.stdout
          def tree_entries(repo, revision):
              result = {}
              for line in git(repo, "ls-tree", "-rz", revision).split(b"\0"):
                  if line:
                      metadata, path = line.split(b"\t", 1)
                      mode, kind, oid = metadata.decode().split()
                      result[path.decode("utf-8")] = (mode, kind, oid)
              return result
          def diff_records(repo, old, new):
              pieces = git(repo, "diff", "--raw", "--no-abbrev", "--no-renames", "-z", old, new).split(b"\0")
              require(pieces.pop() == b"" and len(pieces) % 2 == 0, "invalid diff framing")
              result = {}
              for metadata, path in zip(pieces[::2], pieces[1::2]):
                  oldmode, newmode, oldoid, newoid, operation = metadata.decode().split()
                  name = path.decode("utf-8")
                  require(name not in result, "duplicate diff path")
                  result[name] = (oldmode.lstrip(":"), newmode, oldoid, newoid, operation)
              return result
          def expected_diff(old, new):
              changes = {}
              for path in old.keys() | new.keys():
                  before, after = old.get(path), new.get(path)
                  if before != after:
                      changes[path] = (before[0] if before else "000000", after[0] if after else "000000",
                                       before[2] if before else "0" * 40, after[2] if after else "0" * 40,
                                       "M" if before and after else "D" if before else "A")
              return changes
          def manifest_entries(records):
              return {r["path"]: (r["mode"], "blob", r["git_blob"]) for r in records}
          def validate_manifest(data, plan):
              require(len(data) == plan["manifestBytes"] and sha256(data) == plan["manifestSha256"], "complete manifest identity mismatch")
              records = json.loads(data)
              require(canonical_json(records) == data, "noncanonical manifest")
              require(isinstance(records, list) and len(records) == plan["fileCount"], "manifest file count mismatch")
              paths = []
              for record in records:
                  path = canonical_path(record["path"])
                  require(not path.startswith(plan["payloadPrefix"] + "/") and path != plan["workflowPath"], "helper leaked into target manifest")
                  require(record["mode"] in ("100644", "100755"), "unapproved mode/symlink/gitlink")
                  require(re.fullmatch(r"[0-9a-f]{40}", record["git_blob"]) is not None, "invalid blob ID")
                  require(re.fullmatch(r"[0-9a-f]{64}", record["sha256"]) is not None, "invalid SHA-256")
                  require(type(record["bytes"]) is int and 0 <= record["bytes"] <= plan["maxBlobBytes"], "invalid blob size")
                  require(record["source"] in ("mobile", "main", "text", "bundle"), "invalid source class")
                  paths.append(path)
              require(paths == sorted(set(paths)), "manifest paths duplicated or unsorted")
              pathset = set(paths)
              require(all(str(p) not in pathset for path in paths for p in PurePosixPath(path).parents), "file/directory collision")
              bundle = [r for r in records if r["source"] == "bundle"]
              require(len(bundle) == 1 and bundle[0]["path"] == plan["bundlePath"], "generated bundle set mismatch")
              return records
          def verify_event(plan, environment, event):
              require(environment.get("GITHUB_EVENT_NAME") == "push", "not a push event")
              require(environment.get("GITHUB_REPOSITORY") == plan["repository"], "wrong repository")
              require(environment.get("GITHUB_REF") == "refs/heads/" + plan["helperBranch"], "wrong helper ref")
              require(environment.get("GITHUB_RUN_ATTEMPT") == "1", "reruns are disabled; inspect before a new reviewed publication")
              require(re.fullmatch(r"[1-9][0-9]*", environment.get("GITHUB_RUN_ID", "")) is not None, "invalid run id")
              parent = environment.get("HELPER_PARENT", "")
              require(re.fullmatch(r"[0-9a-f]{40}", parent) is not None, "helper parent is not bound")
              require(re.fullmatch(r"[0-9a-f]{40}", environment.get("GITHUB_SHA", "")) is not None, "invalid trigger SHA")
              require(event.get("ref") == environment["GITHUB_REF"], "event ref mismatch")
              require(event.get("before") == parent and event.get("after") == environment["GITHUB_SHA"], "event ancestry mismatch")
              require(all(event.get(key) is False for key in ("forced", "deleted", "created")), "forced/create/delete push rejected")
              require(event.get("repository", {}).get("full_name") == plan["repository"], "event repository mismatch")
              return parent
          def remote_refs(repo, plan, token):
              wanted = {p["ref"] for p in plan["parents"]}
              rows = git(repo, "ls-remote", "--exit-code", plan["remote"], *sorted(wanted), token=token).decode().splitlines()
              result = {}
              for row in rows:
                  pieces = row.split("\t")
                  require(len(pieces) == 2 and pieces[1] in wanted and pieces[1] not in result and
                          re.fullmatch(r"[0-9a-f]{40}", pieces[0]), "invalid/ambiguous remote refs")
                  result[pieces[1]] = pieces[0]
              require(set(result) == wanted, "a parent ref is missing")
              return result
          def require_parent_refs(repo, plan, token):
              require(remote_refs(repo, plan, token) == {p["ref"]: p["commit"] for p in plan["parents"]}, "mobile or main moved; stop and reconcile")
          def verify_parent_objects(repo, plan):
              require(len(plan["parents"]) == 2 and plan["parents"][0]["ref"] == plan["targetRef"] and
                      plan["parents"][1]["ref"] == "refs/heads/main", "wrong parent order or count")
              trees = {}
              for parent in plan["parents"]:
                  require(git(repo, "cat-file", "-t", parent["commit"]).strip() == b"commit", "parent is not a commit")
                  require(git(repo, "rev-parse", parent["commit"] + "^{tree}").decode().strip() == parent["tree"], "parent tree mismatch")
                  trees[parent["source"]] = tree_entries(repo, parent["commit"])
              return trees
          def verify_staging(repo, plan, environment, event):
              parent = verify_event(plan, environment, event)
              trigger = environment["GITHUB_SHA"]
              require(git(repo, "rev-parse", "HEAD").decode().strip() == trigger, "checkout is not triggering commit")
              require(git(repo, "rev-list", "--parents", "-n", "1", trigger).decode().split() == [trigger, parent], "trigger must have one exact parent")
              changes = diff_records(repo, parent, trigger)
              workflow = plan["workflowPath"]
              require(set(changes) == {workflow}, "trigger changes more than the workflow")
              require(changes[workflow][:3] == ("000000", "100644", "0" * 40) and changes[workflow][4] == "A", "workflow is not a sole regular-file addition")
              git(repo, "merge-base", "--is-ancestor", plan["stagingBase"], parent)
              expected = {r["path"]: ("000000", "100644", "0" * 40, r["git_blob"], "A") for r in plan["stagedFiles"]}
              require(diff_records(repo, plan["stagingBase"], parent) == expected, "full staging delta differs from exact reviewed payload")
              payload = {}
              for record in plan["stagedFiles"]:
                  data = git(repo, "cat-file", "blob", parent + ":" + record["path"])
                  verify_bytes(data, record)
                  require(len(data) <= 250000, "oversized transport file")
                  payload[record["path"]] = data
              manifest = b"".join(payload[path] for path in plan["manifestParts"])
              return validate_manifest(manifest, plan), payload
          def collect_blobs(repo, records, payload, plan, parent_trees):
              parents = {source: {entry[2] for entry in tree.values() if entry[1] == "blob"}
                         for source, tree in parent_trees.items()}
              blobs = {}
              for record in records:
                  source = record["source"]
                  if source == "bundle":
                      continue
                  if source in parents:
                      require(record["git_blob"] in parents[source], "blob is not reachable in its pinned parent tree")
                      data = git(repo, "cat-file", "blob", record["git_blob"])
                  else:
                      data = b"".join(payload[path] for path in record["parts"])
                      require(b"\0" not in data, "new binary is not authorized")
                      data.decode("utf-8", errors="strict")
                  verify_bytes(data, record)
                  blobs[record["git_blob"]] = data
              return blobs
          def construct_tree(repo, records, blobs, index, expected_tree):
              require(not index.exists(), "temporary index already exists")
              git(repo, "read-tree", "--empty", index=index)
              for oid, data in blobs.items():
                  require(git_blob(data) == oid, "raw object key mismatch")
                  require(git(repo, "hash-object", "-w", "--stdin", data=data).decode().strip() == oid, "written object mismatch")
              entries = b"".join((r["mode"] + " " + r["git_blob"] + "\t" + r["path"]).encode() + b"\0" for r in records)
              git(repo, "update-index", "-z", "--index-info", data=entries, index=index)
              tree = git(repo, "write-tree", index=index).decode().strip()
              require(tree == expected_tree, "complete resulting tree differs from reviewed tree")
              require(tree_entries(repo, tree) == manifest_entries(records), "resulting path/mode/blob manifest mismatch")
              return tree
          def build_bundle(folder, records, blobs, plan):
              require(not folder.exists(), "isolated build folder already exists")
              by_path = {r["path"]: r for r in records}
              allowed = set(plan["builderInputs"])
              require(plan["builderPath"] in allowed and plan["bundlePath"] not in allowed, "invalid build input set")
              for path in sorted(allowed):
                  record = by_path[path]
                  verify_bytes(blobs[record["git_blob"]], record)
              for path in sorted(allowed):
                  data = blobs[by_path[path]["git_blob"]]
                  destination = folder / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
              # Only the reviewed stdlib-only existing builder executes, with no token or Node preload flags.
              environment = {"PATH": os.environ["PATH"], "LANG": "C.UTF-8"}
              result = subprocess.run(["node", plan["builderPath"]], cwd=folder, env=environment,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              require(result.returncode == 0, "pinned bundle builder failed; stop and inspect")
              expected_paths = allowed | {plan["bundlePath"]}
              entries = list(folder.rglob("*"))
              require(not any(p.is_symlink() for p in entries), "builder produced a symlink")
              observed = {p.relative_to(folder).as_posix() for p in entries if not p.is_dir()}
              require(observed == expected_paths, "builder wrote an unexpected path")
              expected_directories = {str(p) for path in expected_paths for p in PurePosixPath(path).parents if str(p) != "."}
              require({p.relative_to(folder).as_posix() for p in entries if p.is_dir()} == expected_directories,
                      "builder wrote an unexpected directory")
              for path in sorted(expected_paths):
                  destination = folder / path
                  require(stat.S_ISREG(destination.lstat().st_mode), "builder produced a nonregular file")
                  verify_bytes(destination.read_bytes(), by_path[path])
              return (folder / plan["bundlePath"]).read_bytes()
          def proof_for(plan, records, environment):
              return {"schemaVersion": 1, "repository": plan["repository"], "parents": plan["parents"],
                      "intermediateTree": plan["intermediateTree"], "finalTree": plan["finalTree"],
                      "intermediateComplete": False, "helperRef": environment["GITHUB_REF"],
                      "helperParent": environment["HELPER_PARENT"], "triggerSha": environment["GITHUB_SHA"],
                      "runId": environment["GITHUB_RUN_ID"], "runAttempt": environment["GITHUB_RUN_ATTEMPT"],
                      "planSha256": sha256(canonical_json(plan)), "manifest": records}
          def new_blob_records(records):
              return {r["git_blob"]: r for r in records if r["source"] in ("text", "bundle")}
          def write_artifact(folder, plan, records, blobs, environment):
              require(not folder.exists(), "artifact output already exists")
              needed = new_blob_records(records)
              for oid, record in needed.items():
                  verify_bytes(blobs[oid], record)
              proof = canonical_json(proof_for(plan, records, environment))
              (folder / "blobs").mkdir(parents=True)
              for oid in sorted(needed):
                  (folder / "blobs" / oid).write_bytes(blobs[oid])
              (folder / "proof.json").write_bytes(proof)
              return sha256(proof)
