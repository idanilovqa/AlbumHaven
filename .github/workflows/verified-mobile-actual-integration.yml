          construct_tree(repo, records, blobs, temporary / "publish.index", PLAN["intermediateTree"])
          commit = create_merge(repo, records, PLAN, parent_trees)
          print("Prepared reviewed intermediate commit " + commit + " with tree " + PLAN["intermediateTree"], flush=True)
