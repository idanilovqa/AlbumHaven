name: Publish exact actual-parent mobile integration
on:
  push:
    branches: [2026-09-30-mobile-bundle-transfer]
    paths: [.github/workflows/verified-mobile-actual-integration.yml]
permissions:
  contents: read
concurrency:
  group: verified-mobile-actual-integration
  cancel-in-progress: false
env:
  HELPER_PARENT: 'dad6b5b1abc2d591a96f7f4771ee8a35b60ccb19'
jobs:
  generate:
    if: github.repository == 'idanilovqa/AlbumHaven' && github.ref == 'refs/heads/2026-09-30-mobile-bundle-transfer' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      proof_sha256: ${{ steps.verify.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: objects
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all inputs and regenerate only the pinned bundle
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import sys
          class Rejected(RuntimeError):
