          environment = os.environ
          event = json.loads(Path(environment["GITHUB_EVENT_PATH"]).read_text())
          verify_event(PLAN, environment, event)
          token = environment.get("GH_TOKEN")
          require(bool(token), "transient repository token missing")
          repo = Path(environment["GITHUB_WORKSPACE"]) / "objects"
          temporary = Path(environment["RUNNER_TEMP"])
          require_parent_refs(repo, PLAN, token)
          for parent in PLAN["parents"]:
              git(repo, "fetch", "--no-tags", PLAN["remote"], parent["commit"], token=token)
          parent_trees = verify_parent_objects(repo, PLAN)

          records, payload = verify_staging(repo, PLAN, environment, event)
          blobs = collect_blobs(repo, records, payload, PLAN, parent_trees)
          bundle = build_bundle(temporary / "reviewed-bundle-source", records, blobs, PLAN)
          blobs[git_blob(bundle)] = bundle
          construct_tree(repo, records, blobs, temporary / "generate.index", PLAN["intermediateTree"])
          require_parent_refs(repo, PLAN, token)
          proof_hash = write_artifact(temporary / "integration-validated", PLAN, records, blobs, environment)
          with open(environment["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("proof_sha256=" + proof_hash + "\n")
          print("Verified complete intermediate tree and bundle; exported exact new raw blobs.")

