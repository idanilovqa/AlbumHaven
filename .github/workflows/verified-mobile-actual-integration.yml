          compression-level: 0
          retention-days: 7
          overwrite: false
  publish:
    needs: generate
    if: needs.generate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4a540bb5ae2b5ee568a4b170c560483162cdbc43
          path: objects
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: ${{ runner.temp }}/integration-downloaded
          merge-multiple: true
      - name: Verify raw blobs, create exactly two parents, and push once
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          PROOF_SHA256: ${{ needs.generate.outputs.proof_sha256 }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import sys
          class Rejected(RuntimeError):
              pass
          def require(condition, message):
              if not condition:
                  raise Rejected(message)
          def sha256(data):
              return hashlib.sha256(data).hexdigest()
          def git_blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def canonical_json(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode()
          def canonical_path(path):
              require(isinstance(path, str) and bool(path), "empty/non-string path")
              require(re.fullmatch(r"[A-Za-z0-9._/@()+ -]+", path) is not None, "unsafe path characters")
              require(not path.startswith("/") and str(PurePosixPath(path)) == path, "noncanonical path")
              require(all(p not in ("", ".", "..", ".git") for p in path.split("/")), "unsafe path component")
              return path
          def verify_bytes(data, record):
              require(len(data) == record["bytes"], "size mismatch: " + record["path"])
              require(sha256(data) == record["sha256"], "SHA-256 mismatch: " + record["path"])
              require(git_blob(data) == record["git_blob"], "Git blob mismatch: " + record["path"])
          def git_env(token=None, index=None):
              env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
              env.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null", GIT_TERMINAL_PROMPT="0")
              if index:
                  env["GIT_INDEX_FILE"] = str(index)
              if token:
                  auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
                  env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + auth)
              return env
          def git(repo, *args, data=None, token=None, index=None, hooks=None):
              command = ["git", "-c", "core.hooksPath=" + (str(hooks) if hooks else "/dev/null"),
                         "-c", "core.autocrlf=false", "-c", "commit.gpgsign=false", "-C", str(repo), *args]
              result = subprocess.run(command, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      env=git_env(token, index), check=False)
              require(result.returncode == 0, "git operation failed: " + args[0] + "; inspect, do not retry automatically")
              return result.stdout
          def tree_entries(repo, revision):
              result = {}
              for line in git(repo, "ls-tree", "-rz", revision).split(b"\0"):
                  if line:
                      metadata, path = line.split(b"\t", 1)
