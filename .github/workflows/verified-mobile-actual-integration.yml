          environment = os.environ
          event = json.loads(Path(environment["GITHUB_EVENT_PATH"]).read_text())
          verify_event(PLAN, environment, event)
          token = environment.get("GH_TOKEN")
          require(bool(token), "transient repository token missing")
          repo = Path(environment["GITHUB_WORKSPACE"]) / "objects"
          temporary = Path(environment["RUNNER_TEMP"])
          require_parent_refs(repo, PLAN, token)
          for parent in PLAN["parents"]:
              git(repo, "fetch", "--no-tags", PLAN["remote"], parent["commit"], token=token)
          parent_trees = verify_parent_objects(repo, PLAN)

