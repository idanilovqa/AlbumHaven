c0969fd382f3151d8e88420eaa72671b9', 'gitBlobSha': '51e3099d2e643f368e06fb2768338e59425a9a36', 'mode': '100644', 'operation': 'modify', 'expectedBaseBlobSha': 'e71c008bf821bf321ee38bd47f5e171439bb9862', 'baseBytes': 89720, 'baseSha256': 'e0aef3ecbbc38b755016c89f5f7c309f2f6355aa37b05580a7c6c2f02c674832'}, {'path': 'music_app/templates/index.html', 'bytes': 34663, 'sha256': '0d0a2ffd55491b320d1a6aa033c1f1f9f003c2aa98918ef30f437f7f2fb2b753', 'gitBlobSha': '96d8863f93cff688e07fade776b168607c0daa2e', 'mode': '100644', 'operation': 'modify', 'expectedBaseBlobSha': '4111afee2bed59f11971174337dd8873f20b2ea7', 'baseBytes': 34538, 'baseSha256': '6488999c4ea5001191858b81e8bbed4189adf36c185c21d9c40ec3f73adf6a1e'}, {'path': 'scripts/build-runtime-bundle.cjs', 'bytes': 4524, 'sha256': '7cd708e13373077a55b324bc29c72389904cfd727ca722072c7e400acc45e8da', 'gitBlobSha': '366159bd6b909e19e283511c340bc49cd72f5e8b', 'mode': '100644', 'operation': 'modify', 'expectedBaseBlobSha': 'c07e55f057d9ce7a9c0def90f1eb36b3d426fbf3', 'baseBytes': 4464, 'baseSha256': 'e77732178ec77166b46c3060577278c5027bca723143d7e23aca748a5cce39e7'}, {'path': 'tests/js/runtime/dashboard.test.js', 'bytes': 18677, 'sha256': '267a32849b4f4b8251fa640393481f353a5071c56bf3e80adb2a284d7e160ff4', 'gitBlobSha': '41c2493e7818fdf1f43596178363c026ddfc2a7f', 'mode': '100644', 'operation': 'add'}, {'path': 'tests/js/runtime/gallery-metadata-lifetime-harness.cjs', 'bytes': 5208, 'sha256': 'f93e0bbe54472e648e1ef3444c2052617819f6c56902a3afb068918cdcfa91db', 'gitBlobSha': '2c6cfc957d5ac6f58b7da7a51cb17388429181ab', 'mode': '100644', 'operation': 'add'}, {'path': 'tests/js/runtime/gallery-metadata-lifetime.test.js', 'bytes': 8037, 'sha256': 'dd9554e3e7a46a71ebacb26992ba432c1e6c3f7432237f06afafa817c5750b83', 'gitBlobSha': 'ab8973d2f97e2f7b9d920e8f2e26375e962eee8d', 'mode': '100644', 'operation': 'add'}, {'path': 'tests/js/runtime/home-recent.test.js', 'bytes': 27502, 'sha256': 'c98654d26e883def8809961b10433d98d8fcdf88a064a3d2c63951d36f88bc63', 'gitBlobSha': '1b4544a5ec89ce8e6c69c14c58366283bef97fd0', 'mode': '100644', 'operation': 'add'}, {'path': 'tests/js/runtime/native-home-harness.cjs', 'bytes': 19013, 'sha256': 'a3a6902dc55ea75f3e45048a952a4e1b0633717427d7892966a03cc76214e264', 'gitBlobSha': 'd3947a31fbf3d615646d157e96e691105a1ffcc0', 'mode': '100644', 'operation': 'add'}, {'path': 'tests/js/runtime/virtual-artist-grid.test.js', 'bytes': 172499, 'sha256': 'e8929d413ab2a4fa1b9a84c8f1688ad666a098ffcbb5d4cb7e29e8f938765b9c', 'gitBlobSha': '075571ad2914311c7259c77fc80b574d191cd4ad', 'mode': '100644', 'operation': 'modify', 'expectedBaseBlobSha': 'ccfdae103b9a581fe958f5920816f15f98e07fd2', 'baseBytes': 164070, 'baseSha256': '19fdbd7654054c60451ba7b9bfd2d81a15e6da14f40acb0d4910d2bc0b755164'}]}}
          class Rejected(RuntimeError):
              pass
          def require(condition, message):
              if not condition:
                  raise Rejected(message)
          def sha256(data):
              return hashlib.sha256(data).hexdigest()
          def git_blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def canonical_json(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode()
          def canonical_path(path):
              require(isinstance(path, str) and bool(path), "empty/non-string path")
              require(re.fullmatch(r"[A-Za-z0-9._/-]+", path) is not None, "unsafe path characters")
              require(not path.startswith("/") and str(PurePosixPath(path)) == path, "noncanonical path")
              require(all(p not in ("", ".", "..", ".git") for p in path.split("/")), "unsafe path component")
              return path
          def verify_bytes(data, record):
              require(len(data) == record["bytes"], "size mismatch: " + record["path"])
              require(sha256(data) == record["sha256"], "SHA-256 mismatch: " + record["path"])
              require(git_blob(data) == record["gitBlobSha"], "Git blob mismatch: " + record["path"])
          def deterministic_tar(files):
              output = io.BytesIO()
              with tarfile.open(fileobj=output, mode="w", format=tarfile.USTAR_FORMAT) as archive:
                  for path, data in sorted(files.items()):
                      member = tarfile.TarInfo(canonical_path(path))
                      member.size = len(data)
                      member.mode = 0o644
                      member.type = tarfile.REGTYPE
                      archive.addfile(member, io.BytesIO(data))
              return output.getvalue()
          def verify_scope(plan):
              repository = plan.get("repository")
              require(repository in SCOPES, "unreviewed repository")
              scope = SCOPES[repository]
              require(plan.get("repositoryPrivate") is scope["private"], "wrong repository visibility")
              require(plan.get("targetBranch") == "2026-09-30-friends-listening-home", "wrong target branch")
              require(plan.get("helperBranch") == scope["helper"], "wrong helper branch")
              require(plan.get("scopeLabel") == scope["label"], "wrong helper scope label")
              require(plan.get("workflowPath") == ".github/workflows/verified-native-home-atomic-20261006-v001.yml", "wrong workflow path")
              require(plan.get("chunkPrefix") == ".implementation-transfer/native-home-atomic-20261006-v001", "wrong chunk namespace")
              require(plan.get("remote") == "https://github.com/" + repository + ".git", "wrong remote")
              for key in ("finalTree", "targetHead", "baseTree", "mainHead", "helperBase", "helperBaseTree", "proposalSha256",
                          "publicFilesSha256", "runtimeManifestSha256", "testManifestSha256", "independentReceiptSha256", "secondIndependentReceiptSha256",
                          "greenManifestSha256", "baseInventorySha256", "targetInventorySha256", "transportSourceSha256"):
                  require(plan.get(key) == scope[key], "wrong reviewed " + key)
              return scope
          def decode_chunks(chunks, plan):
              verify_scope(plan)
              expected = plan["chunks"]
              require(len(expected) == len({r["path"] for r in expected}), "duplicate chunk manifest path")
              require([r["path"] for r in expected] == [plan["chunkPrefix"] + "/part-" + str(i).zfill(3) + ".b64" for i in range(1, len(expected) + 1)], "noncanonical chunk sequence")
              require(set(chunks) == {r["path"] for r in expected}, "chunk path set mismatch")
              encoded = bytearray()
              for record in expected:
                  chunk = chunks[record["path"]]
                  require(len(chunk) <= 230001, "oversized chunk")
                  verify_bytes(chunk, record)
                  require(chunk.endswith(b"\n") and b"\n" not in chunk[:-1], "noncanonical chunk newline")
                  encoded.extend(chunk[:-1])
              try:
                  payload = base64.b64decode(encoded, validate=True)
              except (binascii.Error, ValueError) as exc:
                  raise Rejected("invalid base64") from exc
              require(base64.b64encode(payload) == encoded, "noncanonical base64")
              return payload
          def verify_archive(payload, plan):
              scope = verify_scope(plan)
              require(len(payload) == plan["archiveBytes"], "archive size mismatch")
              require(sha256(payload) == plan["archiveSha256"], "archive SHA-256 mismatch")
              expected = {canonical_path(r["path"]): r for r in plan["files"]}
              require(len(expected) == len(plan["files"]) == scope["count"], "wrong unique helper file count")
              require(plan["files"] == scope["files"], "modified-file records differ from reviewed original/final identities")
              require(sum(r.get("operation") == "modify" for r in plan["files"]) == 8 and
                      sum(r.get("operation") == "add" for r in plan["files"]) == 8, "wrong reviewed modification/addition counts")
              for record in plan["files"]:
                  require(record.get("mode") == "100644" and "binary" not in record, "only reviewed regular UTF-8 files allowed")
                  base_keys = ("expectedBaseBlobSha", "baseBytes", "baseSha256")
                  if record["operation"] == "modify":
                      require(all(record.get(key) for key in base_keys), "modification lacks original identity")
                  else:
                      require(record["operation"] == "add" and not any(key in record for key in base_keys), "addition carries original identity")
              files = {}
              try:
                  with tarfile.open(fileobj=io.BytesIO(payload), mode="r:") as archive:
                      for member in archive:
                          path = canonical_path(member.name)
                          require(path in expected and path not in files, "extra or duplicate archive path")
                          require(member.type == tarfile.REGTYPE and not member.pax_headers, "nonregular archive member")
                          require(member.mode == 0o644 and member.uid == member.gid == member.mtime == 0,
                                  "unexpected archive metadata")
                          require(not member.uname and not member.gname and not member.linkname, "unexpected archive name/link")
                          require(member.size == expected[path]["bytes"], "archive member size mismatch")
                          data = archive.extractfile(member).read()
                          verify_bytes(data, expected[path])
                          try:
                              text = data.decode("utf-8", errors="strict")
                          except UnicodeError as exc:
                              raise Rejected("repair payload is not UTF-8") from exc
                          require(text.encode("utf-8") == data and "\0" not in text, "non-text repair payload")
                          files[path] = data
              except (tarfile.TarError, OSError) as exc:
                  raise Rejected("invalid tar archive") from exc
              require(set(files) == set(expected), "missing archive paths")
              require(deterministic_tar(files) == payload, "noncanonical archive or trailing data")
              return files
          def git_env(token=None):
              # Do not inherit configuration that could redirect a remote, a hook or object store.
              env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
              env.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null", GIT_TERMINAL_PROMPT="0")
              if token:
                  auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
                  env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + auth)
              return env
          def git(repo, *args, data=None, token=None, hooks=None):
              command = ["git", "-c", "core.hooksPath=" + (str(hooks) if hooks else "/dev/null"),
                         "-c", "core.autocrlf=false", "-c", "commit.gpgsign=false", "-C", str(repo), *args]
              result = subprocess.run(command, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      env=git_env(token), check=False)
              require(result.returncode == 0, "git operation failed: " + args[0] + "; inspect, do not retry automatically")
              return result.stdout
          def git_tree(repo, revision):
              result = {}
              for line in git(repo, "ls-tree", "-rz", revision).split(b"\0"):
                  if not line:
                      continue
                  metadata, path = line.split(b"\t", 1)
                  mode, kind, oid = metadata.decode().split()
                  result[path.decode("utf-8")] = (mode, kind, oid)
              return result
          def diff_records(repo, old, new=None, cached=False):
              args = ["diff", "--raw", "--no-abbrev", "--no-renames", "-z"]
              if cached:
                  args.append("--cached")
              args.append(old)
              if new:
                  args.append(new)
              pieces = git(repo, *args).split(b"\0")
              require(pieces.pop() == b"", "invalid diff framing")
              require(len(pieces) % 2 == 0, "invalid diff shape")
              result = {}
              for metadata, path in zip(pieces[::2], pieces[1::2]):
                  oldmode, newmode, oldoid, newoid, operation = metadata.decode().split()
                  name = path.decode("utf-8")
                  require(name not in result, "duplicate diff path")
                  result[name] = (oldmode.lstrip(":"), newmode, oldoid, newoid, operation)
              return result
          def expected_changes(records):
              return {r["path"]: ("100644" if r.get("expectedBaseBlobSha") else "000000", "100644",
                                  r.get("expectedBaseBlobSha", "0" * 40), r["gitBlobSha"],
                                  "M" if r.get("expectedBaseBlobSha") else "A") for r in records}
          def verify_target_base(repo, plan):
              head = plan["targetHead"]
              require(git(repo, "rev-parse", head + "^{tree}").decode().strip() == plan["baseTree"], "base tree changed")
              tree = git_tree(repo, head)
              for record in plan["files"]:
                  path = record["path"]
                  canonical_path(path)
                  for parent in PurePosixPath(path).parents:
                      require(str(parent) not in tree, "target path has a non-directory ancestor")
                  if "expectedBaseBlobSha" in record:
                      require(tree.get(path) == ("100644", "blob", record["expectedBaseBlobSha"]), "original target blob changed")
                      old = git(repo, "cat-file", "blob", head + ":" + path)
                      require(len(old) == record["baseBytes"] and sha256(old) == record["baseSha256"], "original target bytes changed")
                  else:
                      require(path not in tree and not any(p.startswith(path + "/") for p in tree), "new target path already exists")
          def verify_event(plan, environment, event):
              scope = verify_scope(plan)
              require(environment.get("GITHUB_EVENT_NAME") == "push", "not a push event")
              require(environment.get("GITHUB_REPOSITORY") == plan["repository"], "wrong repository")
              require(environment.get("GITHUB_REF") == "refs/heads/" + plan["helperBranch"], "wrong helper ref")
              require(environment.get("GITHUB_RUN_ATTEMPT") == "1", "reruns require investigation; automatic replay is disabled")
              require(re.fullmatch(r"[1-9][0-9]*", environment.get("GITHUB_RUN_ID", "")) is not None, "invalid run id")
              parent = environment.get("HELPER_PARENT", "")
              require(re.fullmatch(r"[0-9a-f]{40}", parent) is not None, "helper parent is not bound")
              require(re.fullmatch(r"[0-9a-f]{40}", environment.get("GITHUB_SHA", "")) is not None, "invalid trigger SHA")
              require(event.get("ref") == environment["GITHUB_REF"], "event ref mismatch")
              require(event.get("before") == parent and event.get("after") == environment["GITHUB_SHA"], "event ancestry mismatch")
              require(all(event.get(key) is False for key in ("forced", "deleted", "created")), "forced/create/delete push rejected")
              require(event.get("repository", {}).get("full_name") == plan["repository"] and
                      event["repository"].get("private") is scope["private"], "event repository/private guard failed")
              return parent
          def remote_oid(repo, plan, token, branch=None):
              selected = plan["targetBranch"] if branch is None else branch
              require(selected in (plan["targetBranch"], "main"), "unreviewed read ref")
              ref = "refs/heads/" + selected
              lines = git(repo, "ls-remote", "--exit-code", plan["remote"], ref, token=token).decode().splitlines()
              require(len(lines) == 1, "target ref is missing or ambiguous")
              parts = lines[0].split("\t")
              require(len(parts) == 2 and parts[1] == ref and re.fullmatch(r"[0-9a-f]{40}", parts[0]), "invalid remote ref")
              return parts[0]
          def require_remote_base(repo, plan, token):
              require(remote_oid(repo, plan, token) == plan["targetHead"], "target branch moved; stop and inspect")
              require(remote_oid(repo, plan, token, "main") == plan["mainHead"], "main advanced; reconcile migration and source guards")
          def proof_for(plan, environment):
              return {"schemaVersion": 1, "repository": plan["repository"], "targetBranch": plan["targetBranch"],
                      "targetHead": plan["targetHead"], "baseTree": plan["baseTree"], "finalTree": plan["finalTree"],
                      "helperBase": plan["helperBase"], "helperBaseTree": plan["helperBaseTree"],
                      "helperRef": environment["GITHUB_REF"], "helperParent": environment["HELPER_PARENT"],
                      "triggerSha": environment["GITHUB_SHA"], "runId": environment["GITHUB_RUN_ID"],
                      "runAttempt": environment["GITHUB_RUN_ATTEMPT"], "planSha256": sha256(canonical_json(plan)),
                      "proposalSha256": plan["proposalSha256"], "publicFilesSha256": plan["publicFilesSha256"],
                      "runtimeManifestSha256": plan["runtimeManifestSha256"], "testManifestSha256": plan["testManifestSha256"],
                      "mainHead": plan["mainHead"],
                      "independentReceiptSha256": plan["independentReceiptSha256"],
                      "secondIndependentReceiptSha256": plan["secondIndependentReceiptSha256"],
                      "greenManifestSha256": plan["greenManifestSha256"],
                      "baseInventorySha256": plan["baseInventorySha256"], "targetInventorySha256": plan["targetInventorySha256"],
                      "transportSourceSha256": plan["transportSourceSha256"],
                      "archiveSha256": plan["archiveSha256"], "files": plan["files"]}
          def validate_transport(repo, plan, environment, event, token):
              parent = verify_event(plan, environment, event)
              trigger = environment["GITHUB_SHA"]
              require(git(repo, "rev-parse", "HEAD").decode().strip() == trigger, "checkout is not triggering commit")
