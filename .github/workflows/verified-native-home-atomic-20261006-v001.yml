name: Publish exact reviewed Home component slice
on:
  push:
    branches: [2026-09-30-mobile-bundle-transfer]
    paths: [.github/workflows/verified-native-home-atomic-20261006-v001.yml]
permissions:
  contents: read
concurrency:
  group: verified-native-home-atomic-20261006-v001
  cancel-in-progress: false
env:
  HELPER_PARENT: '7a8062184e837d28d8d13666379a190d137287dd'
jobs:
  validate:
