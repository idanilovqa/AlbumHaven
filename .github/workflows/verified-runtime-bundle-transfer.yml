          for name, digest in C['manifest'].items():
              path = root / name
              require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid source: ' + name)
              require(hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'Source hash mismatch: ' + name)
          print('SOURCE_MANIFEST_OK ' + str(len(C['manifest'])), flush=True)
          run('node', C['builder'])
          result = (root / C['bundle']).read_bytes()
          require(len(result) == C['bundle_bytes'], 'Generated bundle size differs from reviewed bytes')
          require(hashlib.sha256(result).hexdigest() == C['bundle_sha256'], 'Generated bundle SHA-256 differs from reviewed bytes')
          require(git('hash-object', C['bundle']) == C['bundle_blob'], 'Generated bundle Git blob differs from reviewed bytes')
          run('node', '--check', C['bundle'])
          require(git('diff', '--name-only') == C['bundle'], 'Unexpected generated file changes')
          require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked generated files')
          run('git', 'diff', '--check')
          run('git', 'add', '--', C['bundle'])
          require(git('diff', '--cached', '--name-only') == C['bundle'], 'Unexpected staged file set')
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'commit', '-m', 'build: regenerate exact reviewed runtime bundle [skip ci] [skip render]')
          require(git('show', '-s', '--format=%P', 'HEAD') == C['base'], 'Generated commit parent mismatch')
          require(git('diff', '--name-only', C['base'], 'HEAD') == C['bundle'], 'Generated commit contains unexpected paths')
          require(git('rev-parse', 'HEAD:' + C['bundle']) == C['bundle_blob'], 'Committed bundle blob mismatch')
          require(not git('status', '--porcelain'), 'Generated commit left unexpected files')
          require(remote_head() == C['base'], 'Target moved during generation; refusing publication')
          published = git('rev-parse', 'HEAD')
          # Validate the advertised old OID at push negotiation, not only an earlier read.
          # The server rejects a subsequent change against the old OID sent by Git.
          with tempfile.TemporaryDirectory(prefix='verified-bundle-push-') as hooks:
              hook = pathlib.Path(hooks, 'pre-push')
              hook.write_text('#!/usr/bin/env python3\nimport sys\n' +
                  'updates = [line.split() for line in sys.stdin if line.strip()]\n' +
                  'expected = ' + repr([['HEAD', published, 'refs/heads/' + C['target'], C['base']]]) + '\n' +
                  'if updates != expected:\n    sys.exit("Ref update differs from the pinned target and generated commit")\n')
              hook.chmod(0o700)
              run('git', '-c', 'core.hooksPath=' + hooks, 'push', 'origin', 'HEAD:refs/heads/' + C['target'])
          require(remote_head() == published, 'Remote target did not confirm the generated commit')
          print('VERIFIED_RUNTIME_BUNDLE_COMMIT ' + json.dumps({'branch': C['target'], 'commit': published, 'blob': C['bundle_blob'], 'sha256': C['bundle_sha256']}), flush=True)
