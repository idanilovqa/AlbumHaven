3d7e23aca748a5cce39e7","scripts/ci/validate-foundation-gates.cjs":"42101e2f3b95c25bfcd7377911ac9ca47571461bb2bafdb274c0eaffd4e7f29b","tests/ci/test-data-matrix.json":"1d29c3bec1a5522b7fd80eaff73e5fb346a1ad8eda8f1935e47b86691f851776","tests/components/coverLookupTaskCard.spec.js":"87ad7de5b51bb73e159a2a3600c3fca1cbb17cab8cf7f46db8ff80bd4036c0e8","tests/js/ci-fixture-data-contracts.test.js":"f10af971ef25014ddfcd3700e81b449f9afbd9993f33855a3c6f71a2c997deab","tests/js/runtime/cover-lookup-modal-and-drawer.test.js":"76ae8937e1777402af309917e341da766b0d702b0e6342c9150bef3d8f2afce4","tests/js/validate-foundation-gates.test.js":"51b6402aed8be215cc207256d9f3b070d3ac56bd901a2f9962181387d0490385","tests/py/conftest.py":"6cf6a6228bccac1ad823dff1efd67b8fd6d6642a01fd5b714d5cebbef80f24ce"},"repository":"idanilovqa/AlbumHaven","target":"2026-09-25-mobile-layout","transfer":"2026-09-30-mobile-bundle-transfer","workflow":".github/workflows/verified-runtime-bundle-transfer.yml"}
          root = pathlib.Path.cwd().resolve()
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def remote_head():
              lines = git('ls-remote', '--exit-code', 'origin', 'refs/heads/' + C['target']).splitlines()
              require(len(lines) == 1, 'Target ref did not resolve uniquely')
              sha, ref = lines[0].split()
              require(ref == 'refs/heads/' + C['target'], 'Unexpected target ref')
              return sha
          require(os.environ.get('GITHUB_REPOSITORY') == C['repository'], 'Unexpected repository')
          require(os.environ.get('GITHUB_EVENT_NAME') == 'push', 'Unexpected event')
          require(os.environ.get('GITHUB_REF') == 'refs/heads/' + C['transfer'], 'Unexpected helper branch')
          start = os.environ['GITHUB_SHA']
          require(git('rev-parse', 'HEAD') == start, 'Checkout does not match triggering commit')
          require(git('show', '-s', '--format=%P', start) == C['helper_parent'], 'Helper is not the sole child of the pinned helper parent')
          helper_delta = git('diff', '--name-status', C['helper_parent'], start)
          require(helper_delta in ['A\t' + C['workflow'], 'M\t' + C['workflow']], 'Helper changed more than its one workflow')
          require(not git('status', '--porcelain'), 'Helper checkout is not clean')
          require(remote_head() == C['base'], 'Target moved; reconcile instead of overwriting')
          run('git', 'fetch', '--no-tags', 'origin', C['base'])
          run('git', 'checkout', '--detach', C['base'])
          require(git('rev-parse', 'HEAD') == C['base'], 'Pinned target checkout failed')
          require(not git('status', '--porcelain'), 'Pinned target checkout is not clean')
          require(not (root / C['workflow']).exists(), 'Helper workflow unexpectedly exists in target')
          for name in C['absent_paths']:
              require(not (root / name).exists() and not (root / name).is_symlink(), 'Withheld file unexpectedly exists: ' + name)
          for name, digest in C['manifest'].items():
              path = root / name
              require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root), 'Invalid source: ' + name)
              require(hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'Source hash mismatch: ' + name)
          print('SOURCE_MANIFEST_OK ' + str(len(C['manifest'])), flush=True)
          run('node', C['builder'])
          result = (root / C['bundle']).read_bytes()
          require(len(result) == C['bundle_bytes'], 'Generated bundle size differs from reviewed bytes')
          require(hashlib.sha256(result).hexdigest() == C['bundle_sha256'], 'Generated bundle SHA-256 differs from reviewed bytes')
          require(git('hash-object', C['bundle']) == C['bundle_blob'], 'Generated bundle Git blob differs from reviewed bytes')
          run('node', '--check', C['bundle'])
          require(git('diff', '--name-only') == C['bundle'], 'Unexpected generated file changes')
          require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked generated files')
          run('git', 'diff', '--check')
          run('git', 'add', '--', C['bundle'])
          require(git('diff', '--cached', '--name-only') == C['bundle'], 'Unexpected staged file set')
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'commit', '-m', 'build: regenerate exact reviewed runtime bundle [skip ci] [skip render]')
          require(git('show', '-s', '--format=%P', 'HEAD') == C['base'], 'Generated commit parent mismatch')
          require(git('diff', '--name-only', C['base'], 'HEAD') == C['bundle'], 'Generated commit contains unexpected paths')
          require(git('rev-parse', 'HEAD:' + C['bundle']) == C['bundle_blob'], 'Committed bundle blob mismatch')
          require(not git('status', '--porcelain'), 'Generated commit left unexpected files')
          require(remote_head() == C['base'], 'Target moved during generation; refusing publication')
          published = git('rev-parse', 'HEAD')
          # Validate the advertised old OID at push negotiation, not only an earlier read.
          # The server rejects a subsequent change against the old OID sent by Git.
          with tempfile.TemporaryDirectory(prefix='verified-bundle-push-') as hooks:
              hook = pathlib.Path(hooks, 'pre-push')
              hook.write_text('#!/usr/bin/env python3\nimport sys\n' +
                  'updates = [line.split() for line in sys.stdin if line.strip()]\n' +
                  'expected = ' + repr([['HEAD', published, 'refs/heads/' + C['target'], C['base']]]) + '\n' +
                  'if updates != expected:\n    sys.exit("Ref update differs from the pinned target and generated commit")\n')
              hook.chmod(0o700)
              run('git', '-c', 'core.hooksPath=' + hooks, 'push', 'origin', 'HEAD:refs/heads/' + C['target'])
          require(remote_head() == published, 'Remote target did not confirm the generated commit')
          print('VERIFIED_RUNTIME_BUNDLE_COMMIT ' + json.dumps({'branch': C['target'], 'commit': published, 'blob': C['bundle_blob'], 'sha256': C['bundle_sha256']}), flush=True)
