          root = pathlib.Path.cwd().resolve()
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def remote_head():
              lines = git('ls-remote', '--exit-code', 'origin', 'refs/heads/' + C['target']).splitlines()
              require(len(lines) == 1, 'Target ref did not resolve uniquely')
              sha, ref = lines[0].split()
              require(ref == 'refs/heads/' + C['target'], 'Unexpected target ref')
