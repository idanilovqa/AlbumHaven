          run('git', 'fetch', '--no-tags', 'origin', C['base'])
          run('git', 'checkout', '--detach', C['base'])
          require(git('rev-parse', 'HEAD') == C['base'], 'Pinned target checkout failed')
          require(not git('status', '--porcelain'), 'Pinned target checkout is not clean')
          require(not (root / C['workflow']).exists(), 'Helper workflow unexpectedly exists in target')
          for name in C['absent_paths']:
