          require(not git('status', '--porcelain'), 'Helper checkout is not clean')
          require(remote_head() == C['base'], 'Target moved; reconcile instead of overwriting')
          run('git', 'fetch', '--no-tags', 'origin', C['base'])
          run('git', 'checkout', '--detach', C['base'])
          require(git('rev-parse', 'HEAD') == C['base'], 'Pinned target checkout failed')
