on:
  push:
    branches: [2026-09-30-mobile-bundle-transfer]
    paths: [.github/workflows/verified-runtime-bundle-transfer.yml]

permissions:
  contents: read

concurrency:
  group: verified-runtime-bundle-2026-09-25-mobile-layout
  cancel-in-progress: false

