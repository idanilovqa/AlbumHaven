ar(--line);flex:1}.divider small{color:var(--muted);font-weight:400;margin-left:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{font-size:10px;color:var(--muted);font-weight:550;letter-spacing:.07em;text-transform:uppercase;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:15px 10px;border-bottom:1px solid var(--line)}td small{display:block;color:var(--muted);margin-top:5px}td .pill+ .pill{margin-left:5px}.actions{display:flex;gap:10px;align-items:center;margin-top:25px}.primary{background:#2b735f;color:#e7fff5;border-color:#5cd7aa50}.primary:hover{background:#348d72}.helper{font-size:11px;color:var(--muted);line-height:1.6}.actions .helper{max-width:420px}.link{background:none;border:0;color:var(--accent);font-size:12px;white-space:nowrap}.nested{margin-left:24px;padding:3px 10px;background:#152636;border-radius:0 0 8px 8px}.nested td{padding:10px 5px;font-size:10px}.loop{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px}.loop-body{padding:18px}.loop-title{display:flex;justify-content:space-between;align-items:center}.wave{display:flex;align-items:center;gap:3px;height:80px;margin:15px 0;background:linear-gradient(90deg,transparent 12%,#52d7aa12 12%,#52d7aa12 82%,transparent 82%);position:relative;overflow:hidden}.wave:after{content:"";position:absolute;inset:0 18% 0 12%;border-left:2px solid var(--accent);border-right:2px solid var(--accent)}.wave i{flex:1;background:#74adab;min-width:2px;opacity:.65;border-radius:2px}.loop-footer{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#1b2e3e;border-top:1px solid var(--line)}.loop-footer .time{flex:1;font:11px ui-monospace,monospace;color:var(--muted)}.console{background:#08131e;border:1px solid var(--line);border-radius:9px;overflow:hidden}.console-head{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(-- <div class="review"><b>DESIGN REVIEW · v001</b><span>Interactive sample data · current stack · changes stay in this preview</span><a href="notes.md" target="_blank">Review notes</a><button id="reset">Reset preview</button></div>
<main class="shell"><header><div><h1>Utilities</h1><p>Review fixes, loops, integrations, and library settings.</p></div><button class="icon" id="close" aria-label="Close utilities">×</button></header><div class="tabs" role="tablist" aria-label="Utilities"></div><div class="layout"><aside></aside><section class="detail" role="tabpanel"></section></div></main>
<dialog class="modal" id="modal"></dialog><div class="toast" role="status" hidden></div>
<link rel="stylesheet" href="components/album-artbox.css"><script src="components/album-artbox.js"></script><script>
const names=['Problematic files','Rules','Loops','Log History','Integrations','Appearance'];
const tracks=['A New Horizon','The Quiet Hours','Northbound','Signals at Dusk','Where We Begin'];
const iconPaths={folder:'M3 6h6l2 2h10v12H3z',edit:'m4 16 11-11 4 4L8 20H4z M13 7l4 4',cover:'M3 3h18v18H3z M3 16l6-6 5 5 3-3 4 4',disc:'M21 12a9 9 0 1 1-9-9 M3 3l18 18 M14 12a2 2 0 1 1-2-2',search:'M16 16l5 5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',filter:'M4 6h16 M7 12h10 M10 18h4',external:'M14 3h7v7 M21 3 10 14 M10 3H3v18h18v-7'};
const svg=k=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+iconPaths[k]+'"/></svg>';
const ib=(k,label)=>'<button class="icon" title="'+label+'" aria-label="'+label+'" data-demo="'+label+'">'+svg(k)+'</button>';
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const art=(large=false,missing=false)=>'<span class="review-artbox '+(large?'review-artbox--large':'')+'">'+buildAlbumArtboxHtml({state:missing?'empty':'ready',label:missing?'No cover art':'Sample album artwork',coverHtml:'<span class="sample-album-cover" aria-hidden="true"></span>'})+'</span>';
const pill=(text,id)=>'<button class="pill" data-problem="'+text+'" data-id="'+id+'" aria-pressed="false">'+text+'</button>';
let tab=0,selected=0,ruleType=0,dragProblem=null,dragSelect=true,dragIndex=null;
const $=s=>document.querySelector(s);
const toast=text=>{$('.toast').textContent=text;$('.toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('.toast').hidden=true,3000)};
function navItem(title,sub,i,extra=''){return '<button class="nav '+(selected===i?'active':'')+'" data-nav="'+i+'">'+extra+'<span class="title">'+title+'<small>'+sub+'</small></span><span class="count">'+(tab===0?[4,2,1][i]||'':tab===2?'2':'›')+'</span></button>'}
function render(){
$('.tabs').innerHTML=names.map((n,i)=>'<button class="tab" role="tab" id="tab-'+i+'" aria-selected="'+(tab===i)+'" tabindex="'+(tab===i?0:-1)+'" data-tab="'+i+'">'+n+'</button>').join('');
$('.detail').setAttribute('aria-labelledby','tab-'+tab);
const headings=['Albums','Rules','Loops','History','Integrations','Appearance'];
let entries=[];
if(tab===0)entries=['Northern Lights','Paper Gardens','Low Tide'].map((n,i)=>navItem(n,['The Meridian · 2008','Lena Vale · 2022','Stillwater · 2019'][i],i,art(false,i===0)));
if(tab===1)entries=['Version exceptions','Problem exclusions'].map((n,i)=>navItem(n,i?'Selected album and track problems':'Albums kept as separate releases',i));
if(tab===2)entries=['A New Horizon','The Quiet Hours'].map((n,i)=>'<div class="drag-item" draggable="true" data-drag="'+i+'">'+navItem('⠿ '+n,'The Meridian · Northern Lights',i,art())+'<details '+(i===0?'open':'')+'><summary class="helper" style="margin:8px 15px">Saved loops</summary><div class="nested"><table><tr><th>#</th><th>Loop name</th><th>Length</th></tr><tr draggable="true"><td>⠿ 1</td><td>Opening phrase</td><td>0:18</td></tr><tr draggable="true"><td>⠿ 2</td><td>Chorus</td><td>0:24</td></tr></table></div></details></div>');
if(tab===3)entries=['Tags edited','Library status error','Cover art update completed','Library indexing failed'].map((n,i)=>navItem(n,'Northern Lights · Sep 8, 10:'+String(42-i*8).padStart(2,'0'),i));
if(tab===4)entries=['Last.FM','Library','Foobar2000','Import Local Playlist'].map((n,i)=>navItem(n,['Listening history and scrobbling','Library connection','Desktop playback','Bring in a playlist'][i],i));
if(tab===5)entries=['Theme & colors','Navigation','Player'].map((n,i)=>navItem(n,'Existing Appearance settings',i));
$('aside').innerHTML='<div class="aside-head">'+headings[tab]+'<span class="count">'+entries.length+'</span></div><div class="search"><span>⌕</span><input aria-label="Search '+headings[tab]+'" placeholder="Search '+headings[tab].toLowerCase()+'…"><button class="icon" aria-label="Filter '+headings[tab]+'" id="filter">'+svg('filter')+'</button></div><div id="nav-list">'+entries.join('')+'</div>';
if(tab===0)problemView();if(tab===1)rulesView();if(tab===2)loopsView();if(tab===3)logsView();if(tab===4)integrationsView();if(tab===5)appearanceView();
}
function summary(title,sub,missing=false,actions=false){return '<div class="summary">'+art(true,missing)+'<div class="info"><h2>'+title+'</h2><div class="meta">'+sub+'</div></div>'+(actions?'<div class="toolbar">'+ib('folder','Open in Explorer')+ib('edit','Edit Tags')+ib('cover','Fetch Cover')+ib('external','Find on Discogs')+'</div>':'')+'</div>'}
function problemView(){
$('.detail').innerHTML=summary(['Northern Lights','Paper Gardens','Low Tide'][selected],'The Meridian<br>2008 · 5 tracks',selected===0,true)+'<div class="labels">'+pill('Missing year','album-year')+pill('Missing cover art','album-cover')+'</div><div class="divider"><h3>Detected problems <small>5 tracks</small></h3></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" aria-label="Select all track problems" id="all"></th><th>Track / file</th><th>Problems</th></tr></thead><tbody>'+tracks.map((n,i)=>'<tr><td><input type="checkbox" aria-label="Select problems for '+n+'" data-row="'+i+'"></td><td>'+String(i+1).padStart(2,'0')+' &nbsp; '+n+'<small>FLAC · Stereo</small></td><td>'+pill('Missing year','track-'+i)+(i===1||i===3?pill('Missing track number','number-'+i):'')+'</td></tr>').join('')+'</tbody></table></div><div class="actions"><button class="primary" id="exception" disabled>Create Exception</button><span class="helper">Select album or track problem labels. Drag across matching labels to select several at once.</span></div><p class="helper" id="selection">No problems selected.</p>';
}
function rulesView(){const type=selected?'Problem exclusions':'Version exceptions';$('.detail').innerHTML='<h2>'+type+'</h2><p>'+(selected?'Problems intentionally excluded from Problematic Files.':'Albums that should not be counted as versions of another album with the same title.')+'</p><div class="divider"><h3>Active rules <small>3</small></h3></div><div class="table-wrap"><table><tr><th>Album / target</th><th>Rule</th><th></th></tr>'+['Northern Lights','Paper Gardens','Low Tide'].map((n,i)=>'<tr><td>'+n+'<small>'+['The Meridian','Lena Vale','Stillwater'][i]+'</small></td><td>'+(selected?'Missing year':'Separate album version')+'</td><td><button class="link" data-revert="'+n+'">Revert rule</button></td></tr>').join('')+'</table></div>'}
function wave(){return '<div class="wave" aria-label="Sample waveform">'+Array.from({length:100},(_,i)=>'<i style="height:'+(8+Math.abs(Math.sin(i*1.9)*Math.cos(i*.17))*58)+'px"></i>').join('')+'</div>'}
function loopsView(){$('.detail').innerHTML=summary(selected?'The Quiet Hours':'A New Horizon','The Meridian · Northern Lights<br>2008 · 2 saved loops')+'<div class="divider"><h3>Saved loops (2)</h3><button data-demo="Add loop">+ Add loop</button></div>'+['Opening phrase','Chorus'].map((n,i)=>'<article class="loop"><div class="loop-body"><div class="loop-title"><h3>'+n+'</h3><div class="toolbar">'+ib('edit','Edit '+n)+'<button class="icon" aria-label="Delete '+n+'" data-demo="Delete loop">×</button></div></div><div class="meta">'+(i?'1:12 — 1:36 · 24 seconds':'0:12 — 0:30 · 18 seconds')+'</div>'+wave()+'<div class="helper">Range handles shown for layout review.</div></div><footer class="loop-footer"><button class="icon primary" aria-label="Play '+n+'" data-play="1">▶</button><span class="time">0:00 / '+(i?'0:24':'0:18')+'</span><button data-demo="Reset loop" title="Reset">↺</button><button data-speed="-1" aria-label="Decrease playback speed">−</button><span class="speed">1.00×</span><button data-speed="1" aria-label="Increase playback speed">+</button></footer></article>').join('')}
function logsView(){const titles=['Tags edited','Library status error','Cover art update completed','Library indexing failed'];$('.detail').innerHTML='<h2>'+titles[selected]+'</h2><div class="meta">September 8, 2026 · 10:42 AM<br>Web browser · This device · Northern Lights · 5 files</div><div class="divider"><h3>Event output</h3></div><div class="console"><div class="console-head"><span>Console log · '+(selected?'1 event':'5 files')+'</span><button class="icon" data-demo="Copy log" aria-label="Copy log">⧉</button></div><pre>'+ (selected===1||selected===3?'10:42:01  [ERROR] Library unavailable\n10:42:01  The selected source could not be reached.\n10:42:02  Existing library data retained.':'10:42:01  [INFO] Tag update started\n'+tracks.map((n,i)=>'10:42:0'+(i+2)+'  <span class="ok">[OK]</span> '+String(i+1).padStart(2,'0')+' · '+n).join('\n')+'\n10:42:08  <span class="ok">[DONE] 5 of 5 files updated</span>')+'</pre></div><div class="actions"><button data-demo="Export selected log">Export log</button><button id="export-all">Export all logs</button></div>'}
function integrationsView(){
let content='';
if(selected===0)content='<div class="settings-section"><h2>Last.FM <span class="status">· Connected</span></h2><p>Connect your Last.FM account to scrobble and import your listening history.</p><div class="meta">Connected as demo_listener · 1,248 scrobbled · 0 queued</div><div class="fields" style="margin-top:20px"><label>Username<input value="demo_listener"></label><label>Connection<input value="Account connected" disabled></label></div><div class="actions"><button class="primary" data-demo="Reconnect Last.FM">Reconnect Last.FM</button><button data-demo="Disconnect Last.FM">Disconnect</button></div></div><div class="settings-section"><h3>Timezone</h3><p>Use this timezone when displaying your listening history.</p><div class="fields"><label>Timezone<select class="select"><option>America/Denver</option><option>America/New_York</option><option>Europe/London</option></select></label></div><div class="actions"><button data-demo="Save timezone">Save timezone</button></div></div><div class="settings-section"><h3>Help</h3><p>Learn how to connect your account and manage scrobbling.</p><button data-demo="Integration guide">Integration guide ↗</button></div>';
else content='<div class="settings-section"><h2>'+['Last.FM','Library','Foobar2000','Import Local Playlist'][selected]+'</h2><p>'+['','Manage the connected library.','Connect desktop playback using your existing integration.','Import a playlist into your library.'][selected]+'</p><div class="fields"><label>'+(selected===3?'Playlist name':'Connection name')+'<input placeholder="'+(selected===3?'My playlist':'Local library')+'"></label></div><div class="actions"><button data-demo="Integration action">'+(selected===3?'Choose playlist':'Review connection')+'</button></div></div><p class="helper">Layout study: existing integration controls will be mapped before implementation.</p>';
$('.detail').innerHTML=content;
}
function appearanceView(){$('.detail').innerHTML='<h2>'+['Theme & colors','Navigation','Player'][selected]+'</h2><p>Appearance retains its existing editors within the shared Utilities shell.</p><div class="settings-section"><h3>Current theme</h3><p>Shared surfaces, accent, and text colors.</p><div class="swatches"><div class="swatch" style="background:#111e2c"></div><div class="swatch" style="background:#203043"></div><div class="swatch" style="background:#52d7aa"></div><div class="swatch" style="background:#e6edf5"></div></div></div><p class="helper">Context preview only. No redesign of the Appearance editor is proposed.</p>'}
function selectionUpdate(){const pills=[...document.querySelectorAll('.pill[aria-pressed=true]')];$('#exception').disabled=!pills.length;$('#selection').textContent=pills.length?pills.length+' problems selected.':'No problems selected.'}
function modal(title,body,yes,no='Cancel'){const d=$('#modal');d.innerHTML='<h2>'+title+'</h2>'+body+'<div class="actions"><button data-dismiss="1">'+no+'</button><button class="primary" data-confirm="1">'+yes+'</button></div>';d.showModal()}
document.addEventListener('click',e=>{
const t=e.target.closest('button');if(!t)return;
if(t.dataset.tab!==undefined){tab=+t.dataset.tab;selected=0;render()}
else if(t.dataset.nav!==undefined){selected=+t.dataset.nav;render()}
else if(t.id==='reset'){tab=0;selected=0;render()}
else if(t.id==='close'){toast('Preview only — Utilities close action')}
else if(t.id==='exception'){const selectedPills=[...document.querySelectorAll('.pill[aria-pressed=true]')];const reasons=[...new Set(selectedPills.map(x=>x.dataset.problem))].join(', ');modal('Create Exception?','<p>This will create a rule to exclude the selected album or tracks in <strong>Northern Lights</strong> with <strong>'+reasons+'</strong> from Problematic Files.</p><p>You can later find this rule under Rules and revert it.</p><div class="helper">'+selectedPills.length+' selected problem labels</div>','Create Exception')}
else if(t.dataset.revert){modal('Revert rule?','<p>Restore normal '+(selected?'problem detection':'version grouping')+' for <strong>'+t.dataset.revert+'</strong> by reverting this rule.</p>','Yes','No')}
else if(t.id==='export-all'){modal('Export all logs','<p>Choose which history to include in your export.</p><h3>Date range</h3><div class="presets">'+['Today','7 days','30 days','Custom'].map((x,i)=>'<button data-range="'+x+'" class="'+(i===1?'active':'')+'">'+x+'</button>').join('')+'</div><div class="fields" id="custom-dates" hidden><label>From date<input type="date" value="2026-09-01"></label><label>To date<input type="date" value="2026-09-08"></label></div><div class="divider"><h3>Log types</h3></div><div class="checks">'+['Tags edited','Library status error','Local cover selection persisted','Cover art update completed','Library indexing failed'].map(x=>'<label><input type="checkbox" checked> '+x+'</label>').join('')+'</div><div class="fields"><label>Source<select class="select"><option>All sources</option><option>This device</option><option>Web browser</option></select></label></div>','Export logs')}
else if(t.dataset.range){document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',b===t));$('#custom-dates').hidden=t.dataset.range!=='Custom'}
else if(t.dataset.dismiss){$('#modal').close()}
else if(t.dataset.confirm){$('#modal').close();toast('Preview confirmed — no application data changed')}
else if(t.dataset.play){t.textContent=t.textContent==='▶'?'Ⅱ':'▶';toast('Playback state preview — no audio')}
else if(t.dataset.speed){const s=t.parentElement.querySelector('.speed');s.textContent=Math.max(.25,Math.min(2,parseFloat(s.textContent)+Number(t.dataset.speed)*.05)).toFixed(2)+'×'}
else if(t.id==='filter'){modal('Filter '+['albums','rules','loops','history','integrations','appearance'][tab],'<p>Limit the navigation list to matching items.</p><div class="checks"><label><input type="checkbox" checked> '+(tab===0?'Missing year':'All items')+'</label><label><input type="checkbox" checked> '+(tab===0?'Missing cover art':'Recently changed')+'</label></div>','Apply filters')}
else if(t.dataset.demo){toast(t.dataset.demo+' — preview only')}
});
document.addEventListener('input',e=>{if(e.target.matches('.search input')){const q=e.target.value.toLowerCase();document.querySelectorAll('#nav-list>.nav,#nav-list>.drag-item').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(q))}});
document.addEventListener('change',e=>{if(e.target.id==='all'){document.querySelectorAll('.detail tbody .pill').forEach(p=>p.setAttribute('aria-pressed',e.target.checked));document.querySelectorAll('[data-row]').forEach(c=>c.checked=e.target.checked);selectionUpdate()}else if(e.target.dataset.row!==undefined){e.target.closest('tr').querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed',e.target.checked));selectionUpdate()}});
document.addEventListener('pointerdown',e=>{const p=e.target.closest('.pill');if(p){dragProblem=p.dataset.problem;dragSelect=p.getAttribute('aria-pressed')!=='true';p.setAttribute('aria-pressed',dragSelect);selectionUpdate();e.preventDefault()}});
document.addEventListener('pointerover',e=>{const p=e.target.closest('.pill');if(p&&dragProblem===p.dataset.problem){p.setAttribute('aria-pressed',dragSelect);selectionUpdate()}});
document.addEventListener('pointerup',()=>dragProblem=null);
document.addEventListener('keydown',e=>{const t=e.target;if(t.matches('.pill')&&(e.key===' '||e.key==='Enter')){e.preventDefault();t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');selectionUpdate()}if(t.matches('.tab')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();tab=e.key==='Home'?0:e.key==='End'?5:(tab+(e.key==='ArrowRight'?1:5))%6;selected=0;render();$('#tab-'+tab).focus()}});
document.addEventListener('dragstart',e=>{dragIndex=e.target.closest('.drag-item')});
document.addEventListener('dragover',e=>{if(e.target.closest('.drag-item'))e.preventDefault()});
document.addEventListener('drop',e=>{const target=e.target.closest('.drag-item');if(target&&dragIndex&&target!==dragIndex){e.preventDefault();target.before(dragIndex)}dragIndex=null});
render();

<h2>What Album Haven does not do</h2>
<p>Album Haven does not configure Foobar2000 for you.</p>
<p>- It does not launch Foobar2000.</p>
<p>- It does not enable or disable Foobar components.</p>
<p>- It does not paste or save Text Tools presets into Foobar.</p>
<p>- It does not save Foobar configuration, register Windows scheduled tasks, or change backup settings.</p>
<p>- It does not read or write Foobar profile databases automatically just because you opened the help modal or configured manual export files.</p>
<p>- It does not keep Foobar exports automatically in sync after you keep listening in Foobar.</p>
<p>- If you later enable `Continuous Foobar sync` in Album Haven, that authorizes Album Haven to re-read and incrementally update only the live custom DB source you selected for `History of plays` and `Favorite songs`. It does not authorize Foobar settings changes, preset rewrites, component toggles, or scheduled-task changes.</p>
<p>If you change playback data in Foobar after making an export, export a fresh file and import that newer file later when Album Haven supports that manual import flow.</p>
<h2>What Playback Statistics, Text Tools, and Enhanced Playback Statistics are</h2>
<p>`Playback Statistics` / `foo_playcount` is the Foobar component that tracks fields such as play count, first played, last played, rating, and added time.</p>
<p>`Text Tools` is Foobar&#39;s text-export utility. It lets you define a `Header`, `Body`, and `Footer` template and then export rows through `Legacy commands -&gt; Save Text...`. This is the recommended manual export bridge because it is readable, track-addressable, and easier to inspect than older hashed XML exports.</p>
<p>`foo_enhanced_playcount` adds richer playback-history fields beyond the aggregate first-played/last-played view, including array-style fields such as `played_times_js`.</p>
<p>If Album Haven later offers a Foobar custom-DB source, treat that source as separate from the manual XML and Text Tools export files. With `Continuous Foobar sync` off, it should behave as a one-time import. With it on, Album Haven may re-read and incrementally update only the selected live custom DB source.</p>
<p>In v1, that outbound Foobar update path should be limited to new app play-history deltas and newly-loved tracks. It should not decrement play counts, clear favorites on later app un-love, or write ratings back.</p>
<p>If you want to confirm which components are installed or which version you have, check Foobar directly under `File -&gt; Preferences -&gt; Components`.</p>
<h2>Recommended standard Text Tools setup</h2>
<p>Recommended baseline preset:</p>
<pre>
Header
path$char(9)artist$char(9)album$char(9)date$char(9)discnumber$char(9)tracknumber$char(9)title$char(9)rating$char(9)play_count$char(9)first_played$char(9)last_played$char(9)added$crlf()

Body
%path%$char(9)%artist%$char(9)%album%$char(9)%date%$char(9)%discnumber%$char(9)%tracknumber%$char(9)%title%$char(9)%rating%$char(9)%play_count%$char(9)%first_played%$char(9)%last_played%$char(9)%added%$crlf()

Footer
&lt;leave empty&gt;
</pre>
<p>Set it up locally in Foobar:</p>
<p>1. Open `File -&gt; Preferences -&gt; Tools -&gt; Text tools`.</p>
<p>2. Paste the `Header` line into Foobar&#39;s `Header` field.</p>
<p>3. Paste the `Body` line into Foobar&#39;s `Body` field.</p>
<p>4. Leave Foobar&#39;s `Footer` field empty.</p>
<p>5. Click `Apply`.</p>
<p>6. Verify the preview looks correct before exporting anything.</p>

<h2>Enhanced setup and when to use it</h2>
<p>Use the enhanced preset only if you want richer playback-history arrays from `foo_enhanced_playcount`.</p>
<p>Recommended enhanced preset:</p>
<pre>
Header
path$char(9)artist$char(9)album$char(9)date$char(9)discnumber$char(9)tracknumber$char(9)title$char(9)rating$char(9)play_count$char(9)first_played$char(9)last_played$char(9)added$char(9)added_enhanced$char(9)first_played_enhanced$char(9)last_played_enhanced$char(9)played_times_js$char(9)lastfm_played_times_js$char(9)lastfm_play_count$crlf()

Body
%path%$char(9)%artist%$char(9)%album%$char(9)%date%$char(9)%discnumber%$char(9)%tracknumber%$char(9)%title%$char(9)%rating%$char(9)%play_count%$char(9)%first_played%$char(9)%last_played%$char(9)%added%$char(9)%added_enhanced%$char(9)%first_played_enhanced%$char(9)%last_played_enhanced%$char(9)%played_times_js%$char(9)%lastfm_played_times_js%$char(9)%lastfm_play_count%$crlf()

Footer
&lt;leave empty&gt;
</pre>
<p>Use the same setup steps as the standard preset, but replace the `Header` and `Body` text with the enhanced version.</p>

<p>Recommended default:</p>
<p>- Leave `lastfm_*` fields out unless you explicitly want them in your own export.</p>
<p>- Keep the standard preset as the normal default and use the enhanced preset only when you need richer playback-history arrays.</p>
<h2>How to export manually from Foobar</h2>
<h3>Standard Text Tools export</h3>
<p>1. Configure the standard preset in `File -&gt; Preferences -&gt; Tools -&gt; Text tools`.</p>
<p>2. Select the tracks you want to export.</p>
<p>3. Right-click the selection.</p>
<p>4. Choose `Legacy commands -&gt; Save Text...`.</p>
<p>5. Save the file somewhere you can find again.</p>
<h3>Enhanced Text Tools export</h3>
<p>1. Configure the enhanced preset in `File -&gt; Preferences -&gt; Tools -&gt; Text tools`.</p>
<p>2. Select the tracks you want to export.</p>
<p>3. Right-click the selection.</p>
<p>4. Choose `Legacy commands -&gt; Save Text...`.</p>
<p>5. Save the file somewhere you can find again.</p>
<h3>Playback Statistics XML export</h3>
<p>1. Open `Library -&gt; Playback Statistics -&gt; Export statistics to XML...`.</p>
<p>2. Choose a save path.</p>
<p>3. Save the XML file.</p>
<h2>Playback Statistics XML notes and legacy hashed warning</h2>
<p>Older `Playback Statistics` XML exports may contain only hashed IDs instead of clear track text.</p>
<p>That matters because:</p>
<p>- the export may not carry enough readable track identity for later import</p>
<p>- the file can be harder to inspect manually</p>
<p>- the app should not pretend those hashes are always reversible</p>
<p>If you want the clearest manual export, prefer Text Tools.</p>
<p>XML is still useful as a manual snapshot, but it is not a live sync channel. If Foobar data changes later, export a new XML file.</p>
<h2>Portable profile and backup notes</h2>

<p>Important notes from that observed setup:</p>
<p>- the install used `portable_mode_enabled`</p>
<p>- the live profile state lived beside `foobar2000.exe`</p>
<p>- the observed `foo_jesus` autobackup config looked like a lightweight config backup, not a full restore snapshot</p>
<p>- important state in that observed setup included `configuration/`, `config.sqlite`, `metadb.sqlite`, `library-v2.0/`, `playlists-v2.0/`, `index-data/`, `customdb_sqlite.db`, and `theme.fth`</p>
<p>These notes are here to help you understand your own local setup. Album Haven does not repair or rewrite your Foobar backup configuration for you.</p>
<p>If you later enable `Continuous Foobar sync` in Album Haven, leave it off unless you want Album Haven to keep the selected live Foobar DB updated with new app history and newly-loved tracks. If you leave it off, the DB import should behave as one-time only.</p>
<h2>Optional external helper scripts</h2>

<p>Album Haven does not execute these scripts for you and does not require them for the help surface.</p>
