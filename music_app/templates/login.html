{% from "components/on-page-alert.html" import on_page_alert %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album Haven sign in</title>
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="stylesheet" href="/static/css/scrollbar.css">
  <script src="/static/js/login.js" defer></script>
  <link rel="stylesheet" href="/static/css/runtime/alert-components.css">
</head>
<body>
  <main class="login-glow">
    <form class="login-form" method="post" action="/login" aria-label="Album Haven sign in">
      <img class="login-mark" src="/static/images/album-haven-cloud-vinyl.png" alt="Album Haven">

      {% if failed %}
      {{ on_page_alert('Sign-in failed. Check your credentials and try again.', severity='error', class_name='login-alert') }}
      {% endif %}

      <div class="login-field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required autofocus>
      </div>

      <div class="login-field">
        <label for="login-password">Password</label>
        <div class="login-password-control">
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button class="login-password-toggle" type="button" aria-controls="login-password" aria-pressed="false">Show</button>
        </div>
      </div>

      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="return_to" value="{{ return_to }}">
      <button class="login-submit" type="submit">Sign in</button>
      <a class="login-forgot" href="/forgot-password">Forgot password?</a>
    </form>
  </main>
</body>
</html>
