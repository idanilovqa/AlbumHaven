{% set navigation_actions = account_allowed_actions if account_allowed_actions is defined else allowed_actions %}
<aside class="settings-nav" aria-label="Settings navigation" data-settings-nav>
  <a class="settings-brand" href="/" aria-label="Album Haven library">
    <img src="/static/images/album-haven-cloud-vinyl.png" alt="">
  </a>
  <h2>Settings</h2>
  <nav>
    {% if navigation_actions.allows('accounts.read') %}<a class="settings-nav-item{% if settings_section != 'account' %} is-active{% endif %}" href="/admin/members" data-settings-section="users"{% if settings_section != 'account' %} aria-current="page"{% endif %}><span aria-hidden="true">♙</span> Users</a>{% endif %}
    <a class="settings-nav-item{% if settings_section == 'account' %} is-active{% endif %}" href="/account" data-settings-section="account"{% if settings_section == 'account' %} aria-current="page"{% endif %}><span aria-hidden="true">◇</span> My account</a>
    <form class="settings-logout" method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="settings-nav-item" type="submit"><span aria-hidden="true">↪</span> Sign Out</button>
    </form>
  </nav>
</aside>
