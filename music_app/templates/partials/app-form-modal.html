{% from "partials/button.html" import action_button %}
  <div class="confirm-modal" id="app-form-modal" hidden>
    <div class="confirm-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="app-form-title" aria-describedby="app-form-description app-form-error">
      <div class="app-form-header"><h3 class="confirm-modal-title" id="app-form-title"></h3>{% call action_button('Close', class_name='app-form-close', id='app-form-close', presentation='bare') %}<svg class="ui-icon action-button__icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>{% endcall %}</div>
      <div class="confirm-modal-text" id="app-form-description" hidden></div>
      <div id="app-form-content"></div>
      <p id="app-form-error" role="alert"></p>
      <div class="confirm-modal-actions">
      <button class="button ui-button ui-button--quiet ui-button--medium" type="button" id="app-form-cancel">Cancel</button>
        <button class="button ui-button ui-button--primary ui-button--medium" type="button" id="app-form-submit">Apply</button>
      </div>
    </div>
  </div>
