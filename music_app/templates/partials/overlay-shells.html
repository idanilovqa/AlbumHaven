  <div class="repair-progress-overlay" id="repair-progress-overlay" hidden>
    <div class="repair-progress-card" role="status" aria-live="polite">
      <div class="repair-progress-spinner" aria-hidden="true"></div>
      <div class="repair-progress-title" id="repair-progress-title">Repairing tags</div>
      <div class="repair-progress-text" id="repair-progress-text">Applying selected repairs to local files...</div>
    </div>
  </div>

  <div class="image-lightbox" id="image-lightbox" hidden>
    <nav class="image-lightbox-navigation" aria-label="Cover navigation">
    <button class="image-lightbox-nav image-lightbox-prev" type="button" id="image-lightbox-prev" aria-label="Previous cover" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="image-lightbox-nav image-lightbox-next" type="button" id="image-lightbox-next" aria-label="Next cover" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></button>
    </nav>
    {% call action_button('Close full-screen cover', class_name='image-lightbox-close', id='image-lightbox-close', presentation='bare') %}<svg class="ui-icon action-button__icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>{% endcall %}
    <div class="image-lightbox-loading" id="image-lightbox-loading" role="status" aria-label="Loading full-size album cover" hidden>
      <span class="image-lightbox-loading-spinner" aria-hidden="true"></span>
    </div>
    <div class="image-lightbox-error" id="image-lightbox-error" role="status" hidden>
      <span id="image-lightbox-status">Cover could not be loaded.</span>
    </div>
    <button class="button ui-button ui-button--secondary ui-button--small image-lightbox-retry" id="image-lightbox-retry" type="button" hidden>Retry full-size cover</button>
    <img class="image-lightbox-image" id="image-lightbox-image" alt="" aria-hidden="true" hidden>
  </div>
