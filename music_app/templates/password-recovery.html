<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Reset your Album Haven password</title>
  <link rel="stylesheet" href="/static/css/password-recovery.css">
  <script src="/static/js/password-recovery.js" defer></script>
</head>
<body>
  <main class="recovery-glow">
    <section class="recovery-panel" aria-labelledby="recovery-title">
      <img class="recovery-mark" src="/static/images/album-haven-cloud-vinyl.png" alt="Album Haven">
      {% if sent %}
      <div class="recovery-sent" role="status">
        <h1 id="recovery-title">Check your email</h1>
        <p>If the account exists and email can be delivered, the message includes a single-use reset link.</p>
      </div>
      {% else %}
      <h1 id="recovery-title">Reset your password</h1>
      <p>Enter your username or account email. If it matches an account, a reset link will be sent.</p>
      <form class="recovery-form" method="post" action="/forgot-password">
        <label for="recovery-candidate">Username or email</label>
        <input id="recovery-candidate" name="candidate" type="text" autocomplete="username" required autofocus>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="recovery-submit" type="submit">Send reset link</button>
      </form>
      {% endif %}
      <a class="recovery-back" href="/login">← Back to sign in</a>
    </section>
  </main>
</body>
</html>
